<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐍 Змейка+</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 16px;
    background: radial-gradient(circle at 50% 0%, #10161f 0%, #05080c 70%);
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; overflow-x: hidden;
  }
  h1 {
    font-size: 18px; font-weight: 600; letter-spacing: 1px; margin: 0 0 10px;
    color: #7ee787; text-shadow: 0 0 20px rgba(126,231,135,.4);
  }
  #hud {
    display: flex; gap: 22px; align-items: center;
    font-size: 14px; margin-bottom: 12px; min-height: 24px;
    background: linear-gradient(180deg, rgba(20,29,40,.9), rgba(14,20,28,.9));
    border: 1px solid #1c2632; border-radius: 10px;
    padding: 8px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(6px);
  }
  #hud b { color: #7ee787; font-variant-numeric: tabular-nums; }
  #hudEffects {
    color: #ffb86b; font-size: 13px; white-space: nowrap;
    text-shadow: 0 0 12px rgba(255,184,107,.5);
  }
  canvas {
    border-radius: 16px; display: block; max-width: 96vw; height: auto;
    box-shadow: 0 0 0 1px #1e2733, 0 24px 60px rgba(0,0,0,.7), inset 0 0 60px rgba(0,0,0,.5);
  }
  #hint { margin-top: 12px; font-size: 12px; color: #5b6b7c; text-align: center; }

  /* ========== МАТЕМАТИЧЕСКИЙ ОВЕРЛЕЙ (по центру) ========== */
  #mathBackdrop {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(3,6,10,.22);
    backdrop-filter: blur(2.5px);
    -webkit-backdrop-filter: blur(2.5px);
    display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  #mathBackdrop.show { display: flex; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  #mathCard {
    background: linear-gradient(180deg, rgba(20,29,40,.98), rgba(13,19,27,.98));
    border: 1px solid rgba(63,185,80,.5);
    border-radius: 18px;
    padding: 22px 26px 24px;
    width: 360px; max-width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(63,185,80,.15),
                inset 0 1px 0 rgba(255,255,255,.06);
    text-align: center;
    animation: pop .25s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes pop {
    from { transform: scale(.9); opacity: 0 }
    to   { transform: scale(1); opacity: 1 }
  }
  #mathCard h2 {
    margin: 0 0 12px; font-size: 14px; font-weight: 600;
    color: #7ee787; letter-spacing: .5px;
  }
  #mathTimerRow {
    display: flex; align-items: baseline; justify-content: center; gap: 4px;
    margin-bottom: 4px;
  }
  #mathTimer {
    font-size: 32px; font-weight: 800; letter-spacing: 1px;
    color: #7ee787; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px currentColor;
    transition: color .25s;
  }
  #mathTimerRow span { font-size: 14px; color: #8b98a5; }

  #mathTimerBar {
    height: 5px; background: rgba(255,255,255,.08);
    border-radius: 3px; overflow: hidden; margin: 0 0 16px;
  }
  #mathTimerFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #3fb950, #7ee787);
    transition: width .1s linear, background .2s;
  }

  #mathQuestion {
    font-size: 30px; font-weight: 800; letter-spacing: 1px;
    margin: 6px 0 14px; color: #fff; text-align: center;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(255,255,255,.2);
  }
  #mathInput {
    width: 100%; padding: 10px 14px; font-size: 20px; text-align: center;
    border-radius: 10px; border: 1px solid #2b3a49; background: #0a1119;
    color: #fff; outline: none; font-variant-numeric: tabular-nums;
    transition: border-color .15s, box-shadow .15s;
  }
  #mathInput:focus {
    border-color: #3fb950; box-shadow: 0 0 0 3px rgba(63,185,80,.18);
  }
  #mathInput:disabled { opacity: .5; }
  #mathHint {
    margin-top: 6px; font-size: 11px; color: #6e7f90; min-height: 14px;
  }
  #mathFeedback {
    margin-top: 8px; font-size: 13px; min-height: 18px;
    color: #8b98a5; text-align: center;
  }
  #mathFeedback.ok  { color: #56d364; }
  #mathFeedback.bad { color: #f85149; }
  #mathBtn {
    margin-top: 12px; width: 100%; padding: 11px; border-radius: 10px;
    border: 1px solid #2ea043; cursor: pointer;
    background: linear-gradient(180deg, #2ea043, #238636); color: #fff;
    font-size: 15px; font-weight: 600; transition: filter .15s, transform .1s;
  }
  #mathBtn:hover { filter: brightness(1.12); }
  #mathBtn:active { transform: scale(.98); }

  /* ========== GAME OVER ========== */
  #gameOverModal {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(3,6,10,.78); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #gameOverModal.show { display: flex; animation: fadeIn .25s ease; }
  .panel {
    background: linear-gradient(180deg, #141d28, #0f1620);
    border: 1px solid #26333f; border-radius: 20px;
    padding: 28px 30px; width: 340px; max-width: 100%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
    animation: pop .25s cubic-bezier(.2,1.4,.5,1);
  }
  .panel h2 {
    margin: 0 0 14px; font-size: 20px; font-weight: 700;
    color: #f85149; letter-spacing: .5px;
  }
  .panel .reason { font-size: 15px; color: #c9d1d9; margin: 0 0 16px; }
  .panel .score { font-size: 14px; color: #8b98a5; margin-bottom: 18px; }
  .panel .score b { color: #7ee787; font-size: 20px; }
  .panel button {
    width: 100%; padding: 12px; border-radius: 11px;
    border: 1px solid #2ea043; cursor: pointer;
    background: linear-gradient(180deg, #2ea043, #238636); color: #fff;
    font-size: 15px; font-weight: 600; transition: filter .15s, transform .1s;
  }
  .panel button:hover { filter: brightness(1.12); }
  .panel button:active { transform: scale(.98); }
</style>
</head>
<body>

<h1>🐍 ЗМЕЙКА+</h1>

<div id="hud">
  <span>🍎 <b id="hudApples">0</b></span>
  <span>⚡ <b id="hudSpeed">5.0</b></span>
  <span id="hudEffects"></span>
</div>

<canvas id="game"></canvas>
<div id="hint">Стрелки / WASD — управление · Пример: нажми на поле ввода и введи ответ</div>

<!-- ===== Математический оверлей (по центру) ===== -->
<div id="mathBackdrop">
  <div id="mathCard">
    <h2>🧮 Реши пример!</h2>
    <div id="mathTimerRow">
      <span id="mathTimer">10.0</span><span>сек</span>
    </div>
    <div id="mathTimerBar"><div id="mathTimerFill"></div></div>
    <div id="mathQuestion">—</div>
    <input id="mathInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Нажми сюда и введи ответ">
    <div id="mathHint">⏳ игра замедлена ×0.5, пока открыто окошко</div>
    <div id="mathFeedback"></div>
    <button id="mathBtn">Ответить (Enter)</button>
  </div>
</div>

<!-- ===== Game Over ===== -->
<div id="gameOverModal">
  <div class="panel">
    <h2>💀 Игра окончена</h2>
    <div class="reason" id="gameOverText">—</div>
    <div class="score">Яблок съедено: <b id="gameOverScore">0</b></div>
    <button id="restartBtn">Заново (Enter)</button>
  </div>
</div>

<script>
(function () {
'use strict';

/* ================= КОНСТАНТЫ ================= */
const COLS = 24, ROWS = 24, CELL = 24;
const W = COLS * CELL, H = ROWS * CELL;

/* Скорость теперь в «клетках в секунду» */
const START_SPEED    = 5.0;   // начальная скорость
const SPEED_PER_APPLE = 0.1;  // +0.1 за каждое съеденное яблоко
const SPEED_MIN      = 2.0;   // медленнее некуда
const SPEED_MAX      = 18.0;  // быстрее некуда

const MATH_PERIOD    = 33000; // примеры чаще
const MATH_TIME      = 10000; // на решение — 10 секунд
const MATH_SLOW_MUL  = 2;     // во время примера игра замедлена в 2 раза

const canvas = document.getElementById('game');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const mathInputEl = $('mathInput');

/* ================= СОСТОЯНИЕ ================= */
let snake, prevSnake, dir, nextDirs;
let apples, fakeApple, mushrooms, mines, meteors;
let particles, dyingApples;
let applesEaten, speed, reverseUntil, gameTime;
let running = false, gameOver = false, mathActive = false;
let mathCardShowing = false;
let acc = 0, lastTime = 0, lastEffInterval = 200;
let nextMathAt, nextMineAt, nextMeteorAt, nextMushroomAt, nextFakeAt;
let hardMode = false;
let currentProblem = null;
let mathDeadline = 0;

const rnd  = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));

/* ================= СКОРОСТЬ ================= */
function getBaseInterval() {
  return 1000 / speed;
}
function getEffectiveInterval() {
  return getBaseInterval() * (mathCardShowing ? MATH_SLOW_MUL : 1);
}
function toggleMathSlow(on) {
  if (mathCardShowing === on) return;
  const oldEff = getEffectiveInterval();
  mathCardShowing = on;
  const newEff = getEffectiveInterval();
  // сохраняем визуальный прогресс шага, чтобы не было рывка
  if (oldEff > 0) acc = acc * (newEff / oldEff);
  lastEffInterval = newEff;
}

/* ================= УТИЛИТЫ ================= */
function occupied(x, y) {
  if (snake && snake.some(s => s.x === x && s.y === y)) return true;
  if (mines.some(m => m.x === x && m.y === y)) return true;
  if (mushrooms.some(m => m.x === x && m.y === y)) return true;
  if (apples.some(a => a.x === x && a.y === y)) return true;
  if (fakeApple && fakeApple.x === x && fakeApple.y === y) return true;
  return false;
}

function randomFreeCell() {
  for (let i = 0; i < 800; i++) {
    const x = rnd(0, COLS - 1), y = rnd(0, ROWS - 1);
    if (!occupied(x, y)) return { x, y };
  }
  return null;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function cx(c) { return c * CELL + CELL / 2; }

/* ================= ЧАСТИЦЫ ================= */
function spawnParticles(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 140;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.45 + Math.random() * 0.5,
      age: 0,
      color: colors[rnd(0, colors.length - 1)],
      size: 1.5 + Math.random() * 3
    });
  }
}

function updateParticles(dt) {
  const s = dt / 1000;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * s;
    p.y += p.vy * s;
    p.vx *= 0.93;
    p.vy *= 0.93;
    p.vy += 80 * s;
    p.age += s;
    if (p.age >= p.life) particles.splice(i, 1);
  }
  for (let i = dyingApples.length - 1; i >= 0; i--) {
    dyingApples[i].t += dt;
    if (dyingApples[i].t > 300) dyingApples.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const k = 1 - p.age / p.life;
    ctx.globalAlpha = k * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * k, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================= СБРОС ================= */
function resetGame() {
  snake = [{ x: 6, y: 12 }, { x: 5, y: 12 }, { x: 4, y: 12 }];
  prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
  dir = { x: 1, y: 0 };
  nextDirs = [];

  apples = [];
  fakeApple = null;
  mushrooms = [];
  mines = [];
  meteors = [];
  particles = [];
  dyingApples = [];

  applesEaten = 0;
  speed = START_SPEED;
  reverseUntil = 0;
  gameTime = 0;
  acc = 0;
  lastEffInterval = getBaseInterval();

  running = true; gameOver = false; mathActive = false;
  mathCardShowing = false;
  hardMode = false;

  nextMathAt = Infinity;
  nextMineAt = Infinity;
  nextMeteorAt = Infinity;
  nextMushroomAt = Infinity;
  nextFakeAt = Infinity;

  spawnApple();

  $('mathBackdrop').classList.remove('show');
  $('gameOverModal').classList.remove('show');
  mathInputEl.blur();

  updateHud();
  lastTime = performance.now();
}

/* ================= ЯБЛОКИ ================= */
function spawnApple() {
  if (apples.length >= 3) return;
  const p = randomFreeCell();
  if (p) apples.push(p);
}

function onAppleEaten() {
  if (apples.length === 0) spawnApple();

  // +0.1 к скорости за каждое яблоко
  speed = Math.min(SPEED_MAX, speed + SPEED_PER_APPLE);

  if (applesEaten === 5)  nextMathAt     = gameTime;
  if (applesEaten === 15) { nextMineAt = gameTime + 1500; nextMeteorAt = gameTime + 4500; }
  if (applesEaten === 30) nextMushroomAt = gameTime + 4000;
  if (applesEaten === 35) nextFakeAt     = gameTime + 6000;

  if (applesEaten === 50) {
    hardMode = true;
    nextMeteorAt = Math.min(nextMeteorAt, gameTime + 2000);
    nextMineAt   = Math.min(nextMineAt,   gameTime + 1000);
  }
}

/* ================= МИНЫ ================= */
function trySpawnMine() {
  if (mines.length >= 7) return;
  for (let i = 0; i < 400; i++) {
    const x = rnd(0, COLS - 1), y = rnd(0, ROWS - 1);
    const p = { x, y };
    if (snake.some(s => s.x === x && s.y === y)) continue;
    if (cheb(p, snake[0]) < 3) continue;
    if (cheb(p, snake[snake.length - 1]) <= 2) continue;
    if (apples.some(a => cheb(p, a) < 1)) continue;
    if (mushrooms.some(m => m.x === x && m.y === y)) continue;
    if (fakeApple && fakeApple.x === x && fakeApple.y === y) continue;
    mines.push(p);
    return;
  }
}

/* ================= МЕТЕОРИТЫ ================= */
function spawnMeteor() {
  const mw = 3, mh = 3;
  const x = rnd(0, COLS - mw);
  const y = rnd(0, ROWS - mh);
  meteors.push({ x, y, w: mw, h: mh, state: 'warning', impactAt: gameTime + 5000, boomAt: 0 });
}

/* ================= ГРИБЫ / ФЕЙК ================= */
function trySpawnMushroom() {
  if (mushrooms.length >= 3) return;
  for (let i = 0; i < 300; i++) {
    const x = rnd(0, COLS - 1), y = rnd(0, ROWS - 1);
    if (occupied(x, y)) continue;
    if (cheb({ x, y }, snake[0]) < 2) continue;
    mushrooms.push({ x, y });
    return;
  }
}

function trySpawnFakeApple() {
  if (fakeApple) return;
  for (let i = 0; i < 300; i++) {
    const x = rnd(0, COLS - 1), y = rnd(0, ROWS - 1);
    if (occupied(x, y)) continue;
    if (cheb({ x, y }, snake[0]) < 2) continue;
    fakeApple = { x, y };
    return;
  }
}

/* ================= МАТЕМАТИКА ================= */
function makeProblem() {
  const ops = ['+', '-', '*', '/'];
  const op = ops[rnd(0, 3)];
  let a, b, answer, text;
  if (op === '+') {
    a = rnd(1, 9); b = rnd(1, 9); answer = a + b; text = `${a} + ${b}`;
  } else if (op === '-') {
    a = rnd(2, 9); b = rnd(1, a); answer = a - b; text = `${a} − ${b}`;
  } else if (op === '*') {
    a = rnd(1, 9); b = rnd(1, 9); answer = a * b; text = `${a} × ${b}`;
  } else {
    b = rnd(2, 9);
    const q = rnd(1, Math.floor(9 / b));
    a = b * q; answer = q; text = `${a} ÷ ${b}`;
  }
  return { text, answer };
}

function showMath() {
  mathActive = true;
  currentProblem = makeProblem();
  mathDeadline = gameTime + MATH_TIME;

  $('mathQuestion').textContent = currentProblem.text + ' = ?';
  mathInputEl.value = '';
  mathInputEl.disabled = false;
  const fb = $('mathFeedback');
  fb.textContent = '';
  fb.className = '';

  toggleMathSlow(true);
  $('mathBackdrop').classList.add('show');
  // НЕ фокусируем поле — игрок продолжает играть стрелками,
  // чтобы ответить, надо самому кликнуть в поле ввода.
}

function hideMathCard(delay) {
  setTimeout(() => {
    $('mathBackdrop').classList.remove('show');
    mathInputEl.blur();
    toggleMathSlow(false);
  }, delay);
}

function submitMath() {
  if (!mathActive) return;
  const raw = mathInputEl.value.trim();
  if (raw === '') return;

  const num = Number(raw.replace(',', '.'));
  const fb = $('mathFeedback');
  mathActive = false;

  if (num === currentProblem.answer) {
    speed = Math.max(SPEED_MIN, speed - 0.3);
    spawnApple();
    fb.textContent = '✅ Верно! +1 яблоко, скорость чуть ниже';
    fb.className = 'ok';
  } else {
    speed = Math.min(SPEED_MAX, speed + 0.4);
    fb.textContent = `❌ Неверно! Было ${currentProblem.answer}. Скорость выросла`;
    fb.className = 'bad';
  }

  mathInputEl.disabled = true;
  nextMathAt = gameTime + MATH_PERIOD;
  hideMathCard(950);
}

function timeoutMath() {
  if (!mathActive) return;
  mathActive = false;
  speed = Math.min(SPEED_MAX, speed + 0.5);
  const fb = $('mathFeedback');
  fb.textContent = `⏱ Время вышло! Ответ: ${currentProblem.answer}. Скорость выросла`;
  fb.className = 'bad';
  mathInputEl.disabled = true;
  nextMathAt = gameTime + MATH_PERIOD;
  hideMathCard(1300);
}

/* ================= СМЕРТЬ ================= */
function die(reason) {
  if (gameOver) return;
  gameOver = true;
  running = false;
  mathActive = false;
  toggleMathSlow(false);
  $('mathBackdrop').classList.remove('show');
  mathInputEl.blur();
  $('gameOverText').textContent = reason || 'Игра окончена';
  $('gameOverScore').textContent = applesEaten;
  $('gameOverModal').classList.add('show');
}

/* ================= ШАГ ================= */
function step() {
  prevSnake = snake.map(s => ({ x: s.x, y: s.y }));

  if (nextDirs.length) dir = nextDirs.shift();

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return die('Врезался в стену');
  }
  if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) {
    return die('Съел сам себя');
  }
  if (mines.some(m => m.x === head.x && m.y === head.y)) {
    return die('Подорвался на мине 💥');
  }

  snake.unshift(head);
  let grow = false;

  const ai = apples.findIndex(a => a.x === head.x && a.y === head.y);
  if (ai >= 0) {
    const apple = apples.splice(ai, 1)[0];
    applesEaten++;
    grow = true;
    dyingApples.push({ x: apple.x, y: apple.y, t: 0 });
    spawnParticles(cx(apple.x), cx(apple.y), 14,
      ['#ff2f4f', '#ff6a35', '#ffd166', '#ffffff']);
    onAppleEaten();
  }

  if (fakeApple && fakeApple.x === head.x && fakeApple.y === head.y) {
    fakeApple = null;
  }

  const mi = mushrooms.findIndex(m => m.x === head.x && m.y === head.y);
  if (mi >= 0) {
    mushrooms.splice(mi, 1);
    reverseUntil = gameTime + 7000;
    spawnParticles(cx(head.x), cx(head.y), 10, ['#e63946', '#ffffff', '#e8e2d0']);
  }

  if (!grow) snake.pop();
}

/* ================= ТАЙМЕРЫ ================= */
function updateTimers() {
  if (mathActive && gameTime >= mathDeadline) {
    timeoutMath();
  }

  if (applesEaten >= 5 && gameTime >= nextMathAt && !mathActive && !gameOver) {
    nextMathAt = gameTime + MATH_PERIOD;
    showMath();
  }

  if (applesEaten >= 15 && gameTime >= nextMineAt) {
    trySpawnMine();
    nextMineAt = gameTime + (hardMode ? 1800 : 3800);
  }

  if (applesEaten >= 15 && gameTime >= nextMeteorAt) {
    spawnMeteor();
    nextMeteorAt = gameTime + (hardMode ? 4200 : 8500);
  }

  if (applesEaten >= 30 && gameTime >= nextMushroomAt) {
    trySpawnMushroom();
    nextMushroomAt = gameTime + (hardMode ? 7000 : 13000);
  }

  if (applesEaten >= 35 && gameTime >= nextFakeAt) {
    trySpawnFakeApple();
    nextFakeAt = gameTime + 15000;
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    if (m.state === 'warning' && gameTime >= m.impactAt) {
      m.state = 'boom';
      m.boomAt = gameTime + 650;
      const cxp = cx(m.x + m.w / 2);
      const cyp = cx(m.y + m.h / 2);
      spawnParticles(cxp, cyp, 30, ['#ffd166', '#ff8c42', '#ff4d4d', '#ffffff']);
      const hit = snake.some(s =>
        s.x >= m.x && s.x < m.x + m.w && s.y >= m.y && s.y < m.y + m.h);
      mines = mines.filter(mn =>
        !(mn.x >= m.x && mn.x < m.x + m.w && mn.y >= m.y && mn.y < m.y + m.h));
      if (hit) die('Метеорит ☄️');
    } else if (m.state === 'boom' && gameTime >= m.boomAt) {
      meteors.splice(i, 1);
    }
  }
}

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(t - lastTime, 100);
  lastTime = t;

  if (!running || gameOver) {
    updateParticles(dt);
    render();
    return;
  }

  gameTime += dt;
  acc += dt;

  updateParticles(dt);
  updateTimers();

  // Эффективный интервал: во время открытой карточки игры ×0.5 (медленнее)
  const eff = getEffectiveInterval();
  lastEffInterval = eff;

  let guard = 0;
  while (acc >= eff && !gameOver && guard++ < 10) {
    acc -= eff;
    step();
  }

  // HUD-таймер примера
  if (mathActive) {
    const rem = Math.max(0, (mathDeadline - gameTime) / 1000);
    const timerEl = $('mathTimer');
    timerEl.textContent = rem.toFixed(1);
    timerEl.style.color = rem < 3 ? '#f85149' : (rem < 6 ? '#ffb86b' : '#7ee787');
    const fill = $('mathTimerFill');
    fill.style.width = (rem / (MATH_TIME / 1000) * 100) + '%';
    fill.style.background = rem < 3
      ? 'linear-gradient(90deg, #f85149, #ff8c42)'
      : 'linear-gradient(90deg, #3fb950, #7ee787)';
  }

  render();
  updateHud();
}

/* ================= HUD ================= */
function updateHud() {
  $('hudApples').textContent = applesEaten;
  $('hudSpeed').textContent = speed.toFixed(1);

  const parts = [];
  if (mathCardShowing) parts.push('🐢 ×0.5');
  if (reverseUntil > gameTime) {
    parts.push(`🔄 ${((reverseUntil - gameTime) / 1000).toFixed(1)}с`);
  }
  if (hardMode) parts.push('🔥 ХАРД');
  if (applesEaten >= 5 && nextMathAt < Infinity && !mathActive && !gameOver) {
    parts.push(`🧮 ${Math.ceil(Math.max(0, nextMathAt - gameTime) / 1000)}с`);
  }
  $('hudEffects').textContent = parts.join('   ');
}

/* ================= ОТРИСОВКА ================= */
function render() {
  drawBackground();
  mines.forEach(drawMine);
  mushrooms.forEach(drawMushroom);
  apples.forEach(a => drawApple(a, false));
  if (fakeApple) drawApple(fakeApple, true);
  meteors.forEach(drawMeteor);
  drawSnake();
  drawParticles();
  drawDyingApples();
}

function drawBackground() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.75);
  g.addColorStop(0, '#0e1620');
  g.addColorStop(1, '#05080c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(120,180,255,.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W, y * CELL + .5); }
  ctx.stroke();

  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function drawApple(a, fake) {
  const x = cx(a.x);
  const bob = Math.sin(performance.now() / 600 + a.x * 1.7 + a.y) * 0.8;
  const y = cx(a.y) + bob;
  const r = CELL * 0.34;

  ctx.beginPath();
  ctx.ellipse(x, cx(a.y) + CELL * 0.32, r * 0.9, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fill();

  const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
  glow.addColorStop(0, fake ? 'rgba(255,120,50,.35)' : 'rgba(255,50,80,.35)');
  glow.addColorStop(1, 'rgba(255,50,80,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2); ctx.fill();

  const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.1);
  if (fake) {
    grad.addColorStop(0, '#ffb380'); grad.addColorStop(0.5, '#ff7a2f'); grad.addColorStop(1, '#c43d00');
  } else {
    grad.addColorStop(0, '#ff8098'); grad.addColorStop(0.45, '#ff2f4f'); grad.addColorStop(1, '#9e0020');
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  ctx.ellipse(x - r * 0.35, y - r * 0.42, r * 0.28, r * 0.18, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();

  ctx.strokeStyle = '#4a2a12'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(x, y - r + 1);
  ctx.quadraticCurveTo(x + 2, y - r - 3, x + 4, y - r - 5);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(x + 5, y - r - 4, 4, 2.2, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = '#3fb950'; ctx.fill();
}

function drawDyingApples() {
  for (const a of dyingApples) {
    const k = a.t / 300;
    const x = cx(a.x), y = cx(a.y);
    const r = CELL * 0.34 * (1 + k * 0.8);
    ctx.globalAlpha = 1 - k;
    const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
    grad.addColorStop(0, '#ffd1dc');
    grad.addColorStop(1, '#ff2f4f');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawMushroom(m) {
  const x = cx(m.x), y = cx(m.y);
  const bob = Math.sin(performance.now() / 500 + m.x + m.y * 2) * 0.6;
  const yy = y + bob;

  ctx.beginPath();
  ctx.ellipse(x, y + CELL * 0.34, 8, 3, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();

  const stemGrad = ctx.createLinearGradient(x - 4, 0, x + 4, 0);
  stemGrad.addColorStop(0, '#cfc7b3');
  stemGrad.addColorStop(0.5, '#f0ead8');
  stemGrad.addColorStop(1, '#b8b09c');
  ctx.fillStyle = stemGrad;
  roundRect(x - 3, yy - 1, 6, 10, 2);
  ctx.fill();

  const capGrad = ctx.createRadialGradient(x - 3, yy - 8, 1, x, yy - 3, 12);
  capGrad.addColorStop(0, '#ff6b6b');
  capGrad.addColorStop(0.6, '#e63946');
  capGrad.addColorStop(1, '#8b1a1a');
  ctx.beginPath(); ctx.arc(x, yy - 1, 9.5, Math.PI, 0); ctx.fillStyle = capGrad; ctx.fill();

  ctx.fillStyle = '#fff5e6';
  ctx.beginPath(); ctx.arc(x - 4, yy - 4, 1.8, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 3.5, yy - 5, 1.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 0.5, yy - 7.5, 1.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x - 1, yy - 2.5, 1.1, 0, 7); ctx.fill();
}

function drawMine(m) {
  const x = cx(m.x), y = cx(m.y);
  const now = performance.now();
  const pulse = 0.5 + 0.5 * Math.sin(now / 260);

  const g = ctx.createRadialGradient(x, y, 0, x, y, 18);
  g.addColorStop(0, `rgba(255,60,60,${0.25 + 0.35 * pulse})`);
  g.addColorStop(1, 'rgba(255,60,60,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  for (let i = 0; i < 10; i++) {
    const ang = (Math.PI * 2 / 10) * i + now / 4000;
    ctx.strokeStyle = '#6b0000'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang) * 6.5, Math.sin(ang) * 6.5);
    ctx.lineTo(Math.cos(ang) * 10.5, Math.sin(ang) * 10.5);
    ctx.stroke();
  }
  ctx.restore();

  const bg = ctx.createRadialGradient(x - 2.5, y - 3, 1, x, y, 8);
  bg.addColorStop(0, '#5a5a5a'); bg.addColorStop(0.5, '#2a2a2a'); bg.addColorStop(1, '#0d0d0d');
  ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath(); ctx.arc(x - 2.5, y - 2.8, 1.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();

  ctx.beginPath(); ctx.arc(x + 2.5, y + 2.5, 1.7, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,${60 + 120 * pulse},40,${0.5 + 0.5 * pulse})`; ctx.fill();
}

function drawMeteor(m) {
  const now = performance.now();

  if (m.state === 'warning') {
    const blink = 0.5 + 0.5 * Math.sin(now / 110);
    const left = Math.max(0, m.impactAt - gameTime);

    for (let i = 0; i < m.w; i++) {
      for (let j = 0; j < m.h; j++) {
        const px = cx(m.x + i), py = cx(m.y + j);
        const g = ctx.createRadialGradient(px, py, 0, px, py, CELL * 0.5);
        g.addColorStop(0, `rgba(255,50,50,${0.25 + 0.35 * blink})`);
        g.addColorStop(1, 'rgba(255,50,50,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, CELL * 0.5, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.arc(px, py, CELL * 0.36, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,80,80,${0.5 + 0.5 * blink})`; ctx.lineWidth = 2; ctx.stroke();
      }
    }

    const tx = cx(m.x + m.w / 2), ty = cx(m.y + m.h / 2);
    ctx.fillStyle = `rgba(255,120,120,${0.7 + 0.3 * blink})`;
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,50,50,.8)'; ctx.shadowBlur = 12;
    ctx.fillText(Math.ceil(left / 1000), tx, ty);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

  } else if (m.state === 'boom') {
    const t = 1 - Math.max(0, m.boomAt - gameTime) / 650;
    const r = CELL * 1.8 * (0.4 + t * 0.9);
    const px = cx(m.x + m.w / 2), py = cx(m.y + m.h / 2);

    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `rgba(255,255,220,${1 - t})`);
    g.addColorStop(0.35, `rgba(255,190,60,${0.9 - t * 0.9})`);
    g.addColorStop(0.7, `rgba(255,80,20,${0.6 - t * 0.6})`);
    g.addColorStop(1, 'rgba(255,30,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  }
}

/* ================= ЗМЕЙКА (плавная интерполяция) ================= */
function drawSnake() {
  const n = snake.length;
  if (n === 0) return;

  const t = Math.min(1, acc / Math.max(1, lastEffInterval));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const to = snake[i];
    let from = to;
    if (prevSnake && i < prevSnake.length) from = prevSnake[i];
    pts.push({
      x: cx(from.x) + (cx(to.x) - cx(from.x)) * t,
      y: cx(from.y) + (cx(to.y) - cx(from.y)) * t
    });
  }

  const rev = reverseUntil > gameTime;

  // Тень
  ctx.save();
  ctx.translate(0, 3);
  if (n > 1) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.lineWidth = CELL * 0.76;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, CELL * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  }
  ctx.restore();

  if (n > 1) {
    const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
    if (rev) {
      grad.addColorStop(0, '#c08bff'); grad.addColorStop(0.5, '#8a5ad4'); grad.addColorStop(1, '#4a2482');
    } else {
      grad.addColorStop(0, '#8df39a'); grad.addColorStop(0.5, '#3fb950'); grad.addColorStop(1, '#1a6b3a');
    }

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL * 0.78;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = rev ? 'rgba(176,107,255,.7)' : 'rgba(126,231,135,.7)';
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = 'rgba(255,255,255,.16)';
    ctx.lineWidth = CELL * 0.30;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  const h = pts[0];
  const pulse = 1 + Math.sin(performance.now() / 380) * 0.035;
  const headR = CELL * 0.46 * pulse;
  const headGrad = ctx.createRadialGradient(h.x - 3, h.y - 3, 1, h.x, h.y, headR);
  if (rev) {
    headGrad.addColorStop(0, '#d9b3ff'); headGrad.addColorStop(1, '#7a4bc4');
  } else {
    headGrad.addColorStop(0, '#b6ffc0'); headGrad.addColorStop(1, '#3fb950');
  }
  ctx.beginPath(); ctx.arc(h.x, h.y, headR, 0, Math.PI * 2);
  ctx.fillStyle = headGrad; ctx.fill();

  const ex = h.x + dir.x * 3.5, ey = h.y + dir.y * 3.5;
  const px = -dir.y * 4.8, py = dir.x * 4.8;

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(ex + px, ey + py, 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex - px, ey - py, 2.8, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#08131a';
  ctx.beginPath(); ctx.arc(ex + px + dir.x * 0.9, ey + py + dir.y * 0.9, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex - px + dir.x * 0.9, ey - py + dir.y * 0.9, 1.5, 0, Math.PI * 2); ctx.fill();

  if (Math.sin(performance.now() / 300) > 0.6) {
    const tx = h.x + dir.x * headR;
    const ty = h.y + dir.y * headR;
    ctx.strokeStyle = '#ff3b5c'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + dir.x * 5, ty + dir.y * 5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx + dir.x * 5, ty + dir.y * 5);
    ctx.lineTo(tx + dir.x * 5 - dir.y * 2.5, ty + dir.y * 5 + dir.x * 2.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx + dir.x * 5, ty + dir.y * 5);
    ctx.lineTo(tx + dir.x * 5 + dir.y * 2.5, ty + dir.y * 5 - dir.x * 2.5);
    ctx.stroke();
  }
}

/* ================= УПРАВЛЕНИЕ ================= */
function dirFromKey(key) {
  switch (key) {
    case 'ArrowUp': case 'w': case 'W': case 'ц': case 'Ц': return { x: 0, y: -1 };
    case 'ArrowDown': case 's': case 'S': case 'ы': case 'Ы': return { x: 0, y: 1 };
    case 'ArrowLeft': case 'a': case 'A': case 'ф': case 'Ф': return { x: -1, y: 0 };
    case 'ArrowRight': case 'd': case 'D': case 'в': case 'В': return { x: 1, y: 0 };
  }
  return null;
}

function handleDir(d) {
  if (reverseUntil > gameTime) d = { x: -d.x, y: -d.y };
  const cur = nextDirs.length ? nextDirs[nextDirs.length - 1] : dir;
  if (d.x === -cur.x && d.y === -cur.y) return;
  if (d.x === cur.x && d.y === cur.y) return;
  if (nextDirs.length < 2) nextDirs.push(d);
}

document.addEventListener('keydown', (e) => {
  if (gameOver) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); resetGame(); }
    return;
  }

  // Пока фокус в поле ввода — Enter отправляет ответ
  if (mathActive && e.target === mathInputEl && e.key === 'Enter') {
    e.preventDefault();
    submitMath();
    return;
  }

  // Стрелки управляют змейкой ВСЕГДА, даже если фокус в поле
  // (в input type=text они всё равно бесполезны — нечего курсорить)
  const d = dirFromKey(e.key);
  if (d) { e.preventDefault(); handleDir(d); }
});

// Enter с кнопки "Ответить" тоже работает
$('mathBtn').addEventListener('click', submitMath);
$('restartBtn').addEventListener('click', resetGame);

/* ================= СТАРТ ================= */
resetGame();
requestAnimationFrame(loop);

})();
</script>
