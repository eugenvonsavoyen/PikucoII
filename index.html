            toast('Обложка добавлена ✓', 'good');
          };
          reader.readAsDataURL(res);
        },
        error() { toast('Не удалось обработать картинку','warn'); }
      });
    });

    if($('#del-preview')) $('#del-preview').addEventListener('click', () => {
      draft.previewImage = null;
      saveDraftState();
      renderEditor();
    });

    $('#e-mode').addEventListener('change',e=>{
      draft.mode=e.target.value;
      if(draft.mode==='diagram'&&(!draft.endings||!draft.endings.length))draft.endings=[{id:uid(),title:'Результат 1',desc:''}];
      if(!draft.endings)draft.endings=[];
      // текстовые вопросы не поддерживаются в этих режимах
      if(['diagram','tree','tournament'].includes(draft.mode)){
        draft.questions.forEach(q=>{
          if(q.type==='text'){q.type='single';q.answers.forEach(a=>a.correct=false);while(q.answers.length<2)q.answers.push(newAnswer())}
        });
      }
      saveDraftState();
      renderEditor();
    });

    if($('#e-time')) $('#e-time').addEventListener('input',e=>{draft.timeLimit = Math.max(2,+e.target.value || 60);saveDraftState()});
    if($('#e-shufq')) $('#e-shufq').addEventListener('change',e=>{draft.shuffleQuestions=e.target.checked;saveDraftState()});
    if($('#e-shufa')) $('#e-shufa').addEventListener('change',e=>{draft.shuffleAnswers=e.target.checked;saveDraftState()});

    if ($('#add-ending')) {
      $('#add-ending').addEventListener('click', () => {
        draft.endings.push({ id: uid(), title: 'Новый финал', desc: '' });
        saveDraftState();
        renderEditor();
      });
      bindEndings();
    }

    $('#add-q').addEventListener('click',()=>{draft.questions.push(newQuestion());saveDraftState();renderQuestions()});
    $('#save').addEventListener('click',saveDraft);
    $('#save-bottom').addEventListener('click',saveDraft);
    bindQuestions();
  }

  function renderEndingsHTML() {
    if (!draft.endings || draft.endings.length === 0) return '<p class="muted small">Нет добавленных результатов.</p>';
    return draft.endings.map((e, i) => `
      <div class="ending-card" data-ei="${i}">
        <div class="row between" style="margin-bottom:8px">
          <b>Результат ${i + 1}</b>
          <button class="btn danger sm" data-act="del-ending">Удалить</button>
        </div>
        <input class="input" placeholder="Заголовок (например: Победа)" value="${esc(e.title)}" maxlength="150" data-etitle style="margin-bottom:8px">
        <textarea class="input" placeholder="Текст концовки" maxlength="1000" data-edesc rows="2">${esc(e.desc)}</textarea>
        <div class="row" style="margin-top:8px">
          <input type="file" accept="image/*" data-eimage style="display:none">
          <button class="btn ghost sm" data-act="pick-eimg">📷 Прикрепить картинку</button>
          ${e.image ? `<button class="btn danger sm" data-act="del-eimg">Удалить картинку</button>` : ''}
        </div>
        ${e.image ? `<img src="${esc(e.image)}" alt="" class="q-img" style="max-height:150px">` : ''}
      </div>
    `).join('');
  }

  function bindEndings() {
    const list = $('#endings-list');
    list.addEventListener('input', e => {
      const ei = e.target.closest('[data-ei]')?.dataset.ei;
      if (ei == null) return;
      const ending = draft.endings[ei];
      if (e.target.matches('[data-etitle]')) ending.title = e.target.value.slice(0, 150);
      if (e.target.matches('[data-edesc]')) ending.desc = e.target.value.slice(0, 1000);
      saveDraftState();
    });
    list.addEventListener('change', e => {
      if (e.target.matches('[data-etitle]')) refreshEndingSelects();
      if (e.target.matches('[data-eimage]')) {
        const ei = e.target.closest('[data-ei]').dataset.ei;
        const file = e.target.files[0];
        if (!file) return;
        toast('Сжимаем картинку...', 'warn');
        new Compressor(file, {
          quality: 0.5, maxWidth: 400, maxHeight: 400,
          success(res) {
            const reader = new FileReader();
            reader.onload = ev => {
              const img = safeImg(ev.target.result);
              if (!img) { toast('Этот формат картинки не поддерживается','warn'); return; }
              draft.endings[ei].image = img;
              saveDraftState();
              renderEditor();
              toast('Картинка добавлена ✓', 'good');
            };
            reader.readAsDataURL(res);
          },
          error() { toast('Не удалось обработать картинку','warn'); }
        });
      }
    });
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const card = btn.closest('[data-ei]');
      const ei = +card.dataset.ei;
      if (btn.dataset.act === 'pick-eimg') {
        card.querySelector('[data-eimage]').click();
      } else if (btn.dataset.act === 'del-ending') {
        if (!confirm('Удалить результат?')) return;
        draft.endings.splice(ei, 1);
        saveDraftState();
        renderEditor();
      } else if (btn.dataset.act === 'del-eimg') {
        draft.endings[ei].image = null;
        saveDraftState();
        renderEditor();
      }
    });
  }

  function renderQuestions(){$('#qlist').innerHTML=draft.questions.map((q,i)=>questionCard(q,i)).join('')}

  // обновляет только списки концовок в вопросах, не пересобирая карточки (иначе теряется фокус)
  function refreshEndingSelects(){
    $$('#qlist [data-acat]').forEach(sel=>{
      const q=draft.questions[+sel.closest('[data-qi]').dataset.qi];
      const a=q&&q.answers[+sel.closest('[data-ai]').dataset.ai];
      if(!a)return;
      sel.innerHTML='<option value="">Без балла</option>'+(draft.endings||[]).map(e=>`<option value="${esc(e.id)}" ${a.points&&a.points[e.id]?'selected':''}>${esc(e.title)}</option>`).join('');
    });
    $$('#qlist [data-anext]').forEach(sel=>{
      const q=draft.questions[+sel.closest('[data-qi]').dataset.qi];
      const a=q&&q.answers[+sel.closest('[data-ai]').dataset.ai];
      if(!a)return;
      sel.innerHTML=buildTreeOptions(q);
      sel.value=a.nextId||'';
    });
  }

  function buildTreeOptions(q){
    let html=`<option value="">Следующий по порядку</option>`;
    draft.questions.forEach((optQ,idx)=>{
      if(optQ.id!==q.id)html+=`<option value="Q_${esc(optQ.id)}">Вопрос ${idx+1}: ${esc((optQ.text||'').substring(0,15))}...</option>`;
    });
    (draft.endings||[]).forEach(e=>{ html+=`<option value="E_${esc(e.id)}">Результат: ${esc(e.title)}</option>`; });
    return html;
  }

  function questionCard(q,qi){
    const isTree=draft.mode==='tree';
    const isDiagram=draft.mode==='diagram';
    const isTournament=draft.mode==='tournament';
    const isText=q.type==='text';
    const displayNum = Number(qi) + 1;

    const treeOptions = isTree ? buildTreeOptions(q) : '';

    if (isTournament) {
      return `<div class="card q-card" data-qi="${qi}">
        <div class="row between"><b>Вариант ${displayNum}</b><button class="btn danger sm" data-act="del-q">Удалить</button></div>
        <input class="input" style="margin-top:8px" data-qtext maxlength="500" value="${esc(q.text)}" placeholder="Название предмета (например: Красноярск)">
        <div class="row" style="margin-top:8px">
          <input type="file" accept="image/*" data-qimage style="display:none">
          <button class="btn ghost sm" data-act="pick-img">📷 Картинка</button>
          ${q.image?`<button class="btn danger sm" data-act="del-img">Удалить</button>`:''}
        </div>
        ${q.image?`<img src="${esc(q.image)}" alt="" class="q-img" style="max-height:150px">`:''}
      </div>`;
    }

    const typeSelect = (!isDiagram && !isTree) ? `<div class="row" style="margin-top:8px"><select class="input" data-qtype style="max-width:240px">
        <option value="single" ${q.type==='single'?'selected':''}>Один вариант</option>
        <option value="multi" ${q.type==='multi'?'selected':''}>Несколько вариантов</option>
        <option value="text" ${q.type==='text'?'selected':''}>Текстовый ответ</option>
      </select></div>` : '';

    return `<div class="card q-card" data-qi="${qi}">
      <div class="row between"><b>Вопрос ${displayNum}</b><button class="btn danger sm" data-act="del-q">Удалить</button></div>
      <textarea class="input" data-qtext rows="2" maxlength="500">${esc(q.text)}</textarea>
      <div class="row" style="margin-top:8px"><input type="file" accept="image/*" data-qimage style="display:none"><button class="btn ghost sm" data-act="pick-img">📷 Картинка</button>${q.image?`<button class="btn danger sm" data-act="del-img">Удалить</button>`:''}</div>
      ${q.image?`<img src="${esc(q.image)}" alt="" class="q-img" style="max-height:150px">`:''}
      ${typeSelect}
      ${isText ? `<p class="muted small" style="margin:10px 0 0">Игрок вводит ответ сам. Впишите допустимые варианты написания (регистр, пробелы и «ё/е» не учитываются).</p>` : ''}
      <div class="alist">
        ${q.answers.map((a,ai)=>`<div class="arow" data-ai="${ai}">
          ${!isDiagram && !isTree && !isText ? `<button class="mark ${a.correct?'on':''}" data-act="correct">${a.correct?'✓':''}</button>`:''}
          <input class="input" data-atext value="${esc(a.text)}" maxlength="200" ${isText?'placeholder="Правильный ответ"':''}>
          ${isTree?`<select class="input" data-anext style="max-width:200px;font-size:12px">
            ${treeOptions.replace(`value="${esc(a.nextId||'')}"`,`value="${esc(a.nextId||'')}" selected`)}
          </select>`:''}
          ${isDiagram?`<select class="input" data-acat style="max-width:200px;font-size:12px">
            <option value="">Без балла</option>
            ${(draft.endings || []).map(e => {
              const isSel = a.points && a.points[e.id];
              return `<option value="${esc(e.id)}" ${isSel ? 'selected' : ''}>${esc(e.title)}</option>`;
            }).join('')}
          </select>`:''}
          <button class="btn danger sm" data-act="del-a">✕</button>
        </div>`).join('')}
      </div>
      <button class="btn ghost sm" data-act="add-a" style="margin-top:10px">${isText?'+ Вариант написания':'+ Ответ'}</button>
    </div>`
  }

  function refreshQuestion(qi){const el=$(`[data-qi="${qi}"]`,$('#qlist'));if(el)el.outerHTML=questionCard(draft.questions[qi],qi)}

  function bindQuestions(){
    const list=$('#qlist');
    list.addEventListener('input',e=>{
      const qi=e.target.closest('[data-qi]')?.dataset.qi;if(qi==null)return;
      const q=draft.questions[qi],ai=e.target.closest('[data-ai]')?.dataset.ai;
      if(e.target.matches('[data-qtext]'))q.text=e.target.value.slice(0, 500);
      else if(e.target.matches('[data-atext]')&&ai!=null)q.answers[ai].text=e.target.value.slice(0, 200);
      saveDraftState();
    });
    list.addEventListener('change',e=>{
      const qi=e.target.closest('[data-qi]')?.dataset.qi;if(qi==null)return;
      const q=draft.questions[qi],ai=e.target.closest('[data-ai]')?.dataset.ai;
      if(e.target.matches('[data-qimage]')){
        const file=e.target.files[0];if(!file)return;
        toast('Загрузка...','warn');
        new Compressor(file,{quality:0.5,maxWidth:400,maxHeight:400,success(res){
          const reader=new FileReader();
          reader.onload=ev=>{
            const img=safeImg(ev.target.result);
            if(!img){toast('Этот формат картинки не поддерживается','warn');return}
            q.image=img;saveDraftState();refreshQuestion(qi);toast('Готово','good')
          };
          reader.readAsDataURL(res)
        },error(){toast('Не удалось обработать картинку','warn')}})
      }
      else if(e.target.matches('[data-qtype]')){
        const prev=q.type;
        q.type=e.target.value;
        if(q.type==='text'){
          q.answers.forEach(a=>a.correct=true);
        } else {
          if(prev==='text'){q.answers.forEach(a=>a.correct=false);while(q.answers.length<2)q.answers.push(newAnswer())}
          if(q.type==='single'){let seen=false;q.answers.forEach(a=>{if(a.correct){if(seen)a.correct=false;else seen=true}})}
        }
        saveDraftState();refreshQuestion(qi)
      }
      else if(e.target.matches('[data-anext]')){q.answers[ai].nextId=e.target.value||null;saveDraftState()}
      else if(e.target.matches('[data-acat]')){
        const endId=e.target.value;
        q.answers[ai].points = endId ? {[endId]:1} : {};
        saveDraftState();
      }
    });
    list.addEventListener('click',e=>{
      const btn=e.target.closest('[data-act]');if(!btn)return;e.preventDefault();
      const card=btn.closest('[data-qi]');
      const qi=+card.dataset.qi,q=draft.questions[qi],ai=btn.closest('[data-ai]')?+btn.closest('[data-ai]').dataset.ai:null,act=btn.dataset.act;
      if(act==='pick-img'){card.querySelector('[data-qimage]').click()}
      else if(act==='del-q'){if(draft.questions.length<=1){alert('Хотя бы 1');return}if(!confirm('Удалить?'))return;draft.questions.splice(qi,1);saveDraftState();renderQuestions()}
      else if(act==='add-a'){const a=newAnswer();if(q.type==='text')a.correct=true;q.answers.push(a);saveDraftState();refreshQuestion(qi)}
      else if(act==='del-a'){const min=q.type==='text'?1:2;if(q.answers.length<=min){alert('Минимум '+min);return}q.answers.splice(ai,1);saveDraftState();refreshQuestion(qi)}
      else if(act==='correct'){if(q.type==='single')q.answers.forEach((a,i)=>{a.correct=(i===ai)});else q.answers[ai].correct=!q.answers[ai].correct;saveDraftState();refreshQuestion(qi)}
      else if(act==='del-img'){q.image=null;saveDraftState();refreshQuestion(qi)}
    });
  }

  async function saveDraft(){
    if(!draft.title.trim()){alert('Введите название');return}
    if(!draft.previewImage){toast('Прикрепите обложку теста','warn');window.scrollTo({top:0,behavior:'smooth'});return}
    if(draft.mode==='diagram'&&(!draft.endings||draft.endings.length<1)){alert('Добавьте хотя бы один результат');return}
    if(draft.mode==='tournament'&&draft.questions.length<2){alert('В турнире нужно минимум 2 варианта');return}
    const needsCorrect=['standard','time','survival'].includes(draft.mode);

    for(let i=0;i<draft.questions.length;i++){
      const q=draft.questions[i];
      if(!q.text.trim()){alert(`${draft.mode==='tournament'?'Вариант':'Вопрос'} ${i+1}: нет текста`);return}
      if(draft.mode!=='tournament') {
        const min=q.type==='text'?1:2;
        if(q.answers.length<min){alert(`Вопрос ${i+1}: мало ответов`);return}
        if(q.answers.some(a=>!a.text.trim())){alert(`Вопрос ${i+1}: пустые ответы`);return}
        if(needsCorrect && q.type!=='text' && !q.answers.some(a=>a.correct)){alert(`Вопрос ${i+1}: нет верного`);return}
      }
    }

    if(draft.id){
      const old=state.tests.find(t=>t.id===draft.id);
      if(old){draft.authorId=old.authorId||state.user.id;draft.createdAt=old.createdAt||draft.createdAt}
    }else{
      draft.id=uid();draft.authorId=state.user.id;draft.author=state.user.name;draft.createdAt=Date.now();
    }

    const success = await persistTest(draft);
    if(success) {
      try { localStorage.removeItem('pikuco2.draft'); } catch {}
      location.hash='#/test/'+encodeURIComponent(draft.id);
    }
  }

  /* =========================================================
     PROFILE
     ========================================================= */
  function viewProfile(){
    const u=state.user;const mine=state.tests.filter(t=>t.authorId===u.id);
    if(u.isGuest){
      return `<div class="wrap narrow"><div class="card">
        <div class="row" style="margin-bottom:20px">
          <div class="avatar">${esc(u.avatar)}</div>
          <div>
            <h2 style="margin:0">${esc(u.name)}</h2>
            <p class="muted small" style="margin:0">Гости могут проходить и создавать тесты (реже, чем зарегистрированные). Чтобы оценивать, комментировать и не потерять свои тесты — зарегистрируйтесь.</p>
          </div>
        </div>
        <div class="auth-tabs"><div class="auth-tab active" id="tab-login">Вход</div><div class="auth-tab" id="tab-register">Регистрация</div></div>
        <div id="form-login">
          <label class="label">Логин</label><input class="input" id="auth-login" placeholder="Ваш логин" autocomplete="username">
          <label class="label">Пароль</label><input class="input" id="auth-pass" type="password" placeholder="Пароль" autocomplete="current-password">
          <button class="btn primary" id="btn-login" style="margin-top:16px;width:100%">Войти</button>
        </div>
        <div id="form-register" style="display:none">
          <label class="label">Логин (латиница)</label><input class="input" id="reg-login" placeholder="Логин" autocomplete="username">
          <label class="label">Имя (Ник)</label><input class="input" id="reg-name" placeholder="Ник" maxlength="40">
          <label class="label">Пароль</label><input class="input" id="reg-pass" type="password" placeholder="Пароль" autocomplete="new-password">
          <button class="btn primary" id="btn-register" style="margin-top:16px;width:100%">Создать</button>
        </div>
        </div>
        <h3>Мои тесты (Гость)</h3><div class="grid">${mine.map(testCard).join('')||'<p class="muted">Пусто.</p>'}</div>
      </div>`;
    }
    return `<div class="wrap narrow">
      <div class="card">
        <div class="row between">
          <div class="row">
            <div class="avatar">${esc(u.avatar)}</div>
            <div>
              <h2 style="margin:0">${esc(u.name)}</h2>
              <p class="muted small" style="margin:0">Логин: ${esc(u.login)}</p>
            </div>
          </div>
          <div class="row">
            <button class="btn ghost sm" id="btn-change-avatar">Сменить аватар</button>
            <button class="btn danger sm" id="btn-logout">Выйти</button>
          </div>
        </div>
        <div id="avatar-picker" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
          <label class="label">Выбери животное:</label>
          <div class="emoji-grid">
            ${EMOJIS.map(e => `<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}
          </div>
        </div>
      </div>
      <h3>Мои тесты</h3>
      <div class="grid">${mine.map(testCard).join('')||'<p class="muted">Пусто.</p>'}</div>
    </div>`;
  }

  function bindProfile(){
    if(state.user.isGuest){
      const tabLogin=$('#tab-login'),tabReg=$('#tab-register'),formLogin=$('#form-login'),formReg=$('#form-register');
      tabLogin.addEventListener('click',()=>{tabLogin.classList.add('active');tabReg.classList.remove('active');formLogin.style.display='block';formReg.style.display='none'});
      tabReg.addEventListener('click',()=>{tabReg.classList.add('active');tabLogin.classList.remove('active');formReg.style.display='block';formLogin.style.display='none'});

      $('#btn-login').addEventListener('click',async()=>{
        const email=$('#auth-login').value.trim(),p=$('#auth-pass').value;
        if(!email||!p){toast('Заполните поля','warn');return}
        if(await doLogin(email,p))render()
      });
      $('#btn-register').addEventListener('click',async()=>{
        const email=$('#reg-login').value.trim(),n=$('#reg-name').value.trim(),p=$('#reg-pass').value;
        if(!email||!p){toast('Заполните Логин и пароль','warn');return}
        if(await doRegister(email,p,n||email))render()
      });
    }else{
      const picker = $('#avatar-picker');
      $('#btn-change-avatar').addEventListener('click', () => {
        picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
      });
      $$('.emoji-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if(!EMOJIS.includes(btn.dataset.emoji)) return;
          state.user.avatar = btn.dataset.emoji;
          await fbFetch(`/users/${state.user.id}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ avatar: state.user.avatar })
          });
          toast('Аватар обновлен ✓', 'good');
          render();
        });
      });
      $('#btn-logout').addEventListener('click',()=>{
        if(confirm('Вы собираетесь выйти из аккаунта. Вы уверены?')) doLogout();
      });
    }
  }

  /* =========================================================
     INIT
     ========================================================= */
  async function init(){
    applyTheme();

    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        if (user.isAnonymous) {
          // гостевой профиль создаём один раз и дальше переиспользуем (раньше имя менялось при каждой загрузке)
          let profile = null;
          try { const r = await fbFetch(`/users/${user.uid}.json`); if (r.ok) profile = await r.json(); } catch {}
          if (!profile || !profile.name) {
            profile = { name: 'Гость #' + Math.floor(1000 + Math.random() * 9000), avatar: EMOJIS[Math.floor(Math.random() * EMOJIS.length)] };
            await fbFetch(`/users/${user.uid}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profile) }).catch(()=>{});
          }
          state.user = { id: user.uid, name: String(profile.name), avatar: profile.avatar || EMOJIS[0], isGuest: true };
        } else {
          let profile = null;
          try { const r = await fbFetch(`/users/${user.uid}.json`); if (r.ok) profile = await r.json(); } catch {}
          state.user = {
            id: user.uid,
            login: (user.email||'').split('@')[0],
            isGuest: false,
            name: profile?.name || (user.email||'').split('@')[0],
            avatar: profile?.avatar || EMOJIS[0]
          };
        }
      } else {
        firebase.auth().signInAnonymously().catch(e => console.error(e));
        return;
      }

      await dbLoad();

      // стартовые тесты больше не создаются автоматически: запись теперь только для зарегистрированных

      const loader = document.getElementById('loading');
      if(loader) loader.style.display = 'none';

      setupPresence();

      if(!$('#theme-toggle')._bound) {
        $('#theme-toggle').addEventListener('click',toggleTheme);
        $('#theme-toggle')._bound = true;
      }

      window.removeEventListener('hashchange', render);
      window.addEventListener('hashchange', render);

      render();
    });
  }

  document.addEventListener('DOMContentLoaded', init);
