<style>
*{box-sizing:border-box}
:root{--bg:#0d0a16;--panel:#171225;--panel2:#1f1833;--border:#2c2444;--text:#ece9f5;--muted:#9b93b8;--accent:#a855f7;--accent2:#ec4899;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme="light"]{--bg:#f6f4fb;--panel:#fff;--panel2:#f0ecfa;--border:#e3ddf0;--text:#1a1625;--muted:#6b6584;--shadow:0 10px 30px rgba(80,50,150,.12)}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(168,85,247,.18),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(236,72,153,.12),transparent 60%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.wrap.narrow{max-width:760px}
.wrap.wide{max-width:1100px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.site-header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.site-header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;gap:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:.15s}
.nav-link:hover{background:var(--panel);color:var(--text)}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 6px 20px -6px var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.big{padding:12px 24px;font-size:16px}
.btn.active-vote{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.22)}
textarea.input{resize:vertical;min-height:44px}
.label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.big{padding:32px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:16px 0}
.test-card{display:flex;flex-direction:column;gap:8px;transition:.18s;cursor:pointer;padding:0;overflow:hidden}
.test-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.test-img{width:100%;height:140px;object-fit:cover;border-bottom:1px solid var(--border)}
.test-card-content{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.test-card h3{margin:0;font-size:18px}
.test-card p{margin:0;font-size:14px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-go{margin-top:8px;color:var(--accent);font-weight:600;font-size:14px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.badge.good{color:var(--good);border-color:rgba(34,197,94,.4)}
.badge.wrong{color:var(--bad);border-color:rgba(239,68,68,.4)}
.badge.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}
.badge.quality{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.badge.new{color:var(--accent);border-color:rgba(168,85,247,.5)}
.hero{padding:56px 20px 8px;text-align:center;max-width:820px;margin:0 auto}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-size:24px;font-weight:800}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.play-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 20px;border:1px solid var(--border)}

.score-circle{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0)}
.score-circle::before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.score-circle span{position:relative;font-size:34px;font-weight:800}
.review{margin-top:12px;padding:16px}
.review.ok{border-left:4px solid var(--good)}
.review.bad{border-left:4px solid var(--bad)}
.review p{margin:6px 0}
.qlist{display:flex;flex-direction:column;gap:16px;margin:16px 0}
.q-card{padding:18px}
.q-card textarea{margin-top:10px}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mark{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:800;font-size:14px;transition:.15s}
.mark.on{background:var(--good);border-color:var(--good);color:#fff}
.arow .input{flex:1;min-width:150px}
.avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:28px;background:var(--panel2);border:1px solid var(--border);flex:none}
.attempt{padding:8px 0;border-bottom:1px solid var(--border)}
.attempt:last-child{border:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--border);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.28s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:10000;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.good{border-color:var(--good);color:var(--good)}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.confetti{position:fixed;top:-16px;width:8px;height:14px;z-index:9999;pointer-events:none;animation:fall 2.4s linear forwards}

.q-img{max-width:100%;max-height:300px;border-radius:12px;margin:12px 0;display:block;border:1px solid var(--border)}
.comment{background:var(--panel2);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border);position:relative}
.comment b{color:var(--accent)}
.comment-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px;opacity:0.5;transition:.15s}

#online-widget{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--panel);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;transition:.3s}

.online-dot{width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 8px var(--good)}
.result-layout{display:grid;grid-template-columns:1fr;gap:24px;margin-top:24px}

.sidebar-comments{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow-y:auto}
.sidebar-comments h3{margin-top:0;font-size:18px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.auth-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.auth-tab{padding:10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.auth-tab.active{border-color:var(--accent);color:var(--text)}
.ending-card{background:var(--panel2);padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid var(--border);position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.emoji-btn { font-size: 24px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; transition: .15s; display: grid; place-items: center; }
.emoji-btn:hover { border-color: var(--accent); transform: scale(1.1); }
.tournament-container { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
@media(min-width: 768px) { .tournament-container { grid-template-columns: 1fr 1fr; } }
.tournament-item { background: var(--panel2); border: 2px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: .2s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tournament-item:hover { border-color: var(--accent); transform: scale(1.02); }
.tournament-item img { max-width: 100%; max-height: 200px; border-radius: 12px; object-fit: cover; }
.tournament-item h3 { margin: 0; font-size: 20px; }

/* --- Apps gallery --- */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:24px}
.app-card{display:flex;flex-direction:column;padding:24px;border-radius:20px;color:#fff;text-decoration:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;min-height:200px}

.app-card-emoji{font-size:52px;margin-bottom:12px;line-height:1;position:relative;z-index:1}
.app-card h3{margin:0 0 8px;font-size:22px;color:#fff;position:relative;z-index:1}
.app-card p{margin:0 0 16px;opacity:.92;font-size:14px;color:#fff;line-height:1.4;position:relative;z-index:1}
.app-card-go{margin-top:auto;font-weight:600;font-size:14px;position:relative;z-index:1}
.app-card-badge{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:11px;font-weight:600;align-self:flex-start;margin-bottom:12px;position:relative;z-index:1}
.app-viewer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#141418}
.app-viewer iframe{width:100%;height:100%;border:0;display:block}
</style>

    del(k){try{localStorage.removeItem(KEY+'.'+k)}catch{}}
  };

  const state={tests:[],votes:{},user:null,theme:store.get('theme','dark')};
  let dbOk=false;

  // Антиспам: клиентские кулдауны (на сервере те же лимиты, чуть мягче — в правилах Firebase)
  // На сервере (rules) лимиты 15 с и 600 с; на клиенте +1 с запаса на задержку сети/часы
  const COMMENT_COOLDOWN = 16000;
  // у гостей лимит строже: 30 мин на аккаунт (+ общий лимит 1 гостевой тест/мин на сервере)
  const testCooldown = () => state.user.isGuest ? 1801000 : 601000;
  function cooldownLeft(kind, ms){
    const last = Number(store.get('cd.' + state.user.id + '.' + kind, 0)) || 0;
    return Math.max(0, last + ms - Date.now());
  }
  function markCooldown(kind){ store.set('cd.' + state.user.id + '.' + kind, Date.now()); }

  function newAnswer(){return{id:uid(),text:'',correct:false,nextId:null,points:{}}}
  function newQuestion(){return{id:uid(),text:'',type:'single',image:null,answers:[newAnswer(),newAnswer()]}}
  function getTest(id){return state.tests.find(t=>t.id===id)}

  function toArr(v) {
    return Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === 'object' ? Object.values(v) : []);
  }

  const MODES=['standard','time','survival','tournament','tree','diagram'];
  const safeId=v=>SAFE_ID.test(String(v))?String(v):uid();

  function sanitizeTests(tests){
    return tests.filter(t => t && t.questions && SAFE_ID.test(String(t.id))).map(t=>{
      t.title=String(t.title||'Без названия');
      t.description=String(t.description||'');
      t.author=String(t.author||'');
      t.previewImage=safeImg(t.previewImage);
      t.mode=MODES.includes(t.mode)?t.mode:'standard';
      t.createdAt=Number(t.createdAt)||0; // старые тесты без даты НЕ считаем новыми
      t.timeLimit=Math.max(2,Number(t.timeLimit)||60);
      t.shuffleQuestions=!!t.shuffleQuestions;
      t.shuffleAnswers=!!t.shuffleAnswers;
      t.endings=toArr(t.endings).map(e=>({...e,id:safeId(e.id),title:String(e.title||''),desc:String(e.desc||''),image:safeImg(e.image)}));
      t.questions=toArr(t.questions).map(q=>{
        q.id=safeId(q.id);
        q.text=String(q.text||'');
        q.image=safeImg(q.image);
        q.type=(q.type==='multi'||q.type==='text')?q.type:'single';
        if(q.type==='text'&&['tree','diagram','tournament'].includes(t.mode))q.type='single';
        q.answers=toArr(q.answers).map(a=>({...a,id:safeId(a.id),text:String(a.text||''),correct:!!a.correct,nextId:/^[QE]_[A-Za-z0-9_-]{1,64}$/.test(String(a.nextId||''))?String(a.nextId):null,points:(a.points&&typeof a.points==='object')?a.points:{}}));
        return q;
      });
      return t;
    }).filter(t => t.questions.length > 0);
  }

  async function dbLoad(){
    // тесты и оценки грузим независимо: сбой оценок не должен убивать список тестов
    let testsData = null, votesData = {};

      const r = await fbFetch('/tests.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      testsData = await r.json() || {};
    } catch (e) { console.warn('Tests load failed', e); }
    try {
      const r = await fbFetch('/votes.json');
      if (r.ok) votesData = await r.json() || {};
    } catch (e) { console.warn('Votes load failed', e); }

    if (testsData === null) {
      // офлайн-фоллбэк: последний удачно загруженный список
      const cached = store.get('testsCache', null);
      dbOk = false;
      if (cached && typeof cached === 'object') {
        testsData = cached;
        toast('Нет связи с сервером — показан сохранённый список тестов', 'warn');

      }
    } else {
      dbOk = true;
      try { if (JSON.stringify(testsData).length < 3500000) store.set('testsCache', testsData); else store.del('testsCache'); } catch {}
    }
    state.tests = sanitizeTests(Object.entries(testsData).map(([id, t]) => ({ ...(t&&typeof t==='object'?t:{}), id })));
    state.votes = votesData;
  }

  async function persistTest(test){
    test.title = cleanText(test.title).slice(0, 150);
    test.description = cleanText(test.description).slice(0, 400);
    test.previewImage = safeImg(test.previewImage);
    test.questions.forEach(q => {
      q.text = cleanText(q.text).slice(0, 500);
      q.image = safeImg(q.image);
      if (q.answers) q.answers.forEach(a => { a.text = cleanText(a.text).slice(0, 200); });
    });
    (test.endings||[]).forEach(e => {
      e.title = cleanText(e.title).slice(0, 150);
      e.desc = cleanText(e.desc).slice(0, 1000);
      e.image = safeImg(e.image);
    });
    test.authorId = state.user.id;
    test.author = state.user.name;

    let isNew = !state.tests.some(t => t.id === test.id);
    let serverCreated = 0;
    if (isNew) {
      // тест мог уже лежать в базе (другая вкладка, повтор после обрыва связи) — тогда это не создание
      try {
        const chk = await fbFetch(`/tests/${test.id}/createdAt.json`);
        if (chk.ok) { const v = await chk.json(); if (typeof v === 'number' && v > 0) { isNew = false; serverCreated = v; } }
      } catch {}
    }
    if (isNew) {
      const left = cooldownLeft('test', testCooldown());
      if (left > 0) { toast(`Новый тест можно создать через ${Math.ceil(left/60000)} мин.`, 'warn'); return false; }
    }
    // время создания ставит сервер — подделать «новизну» нельзя
    const stamp = { '.sv': 'timestamp' };
    const keepCreated = serverCreated || Number(test.createdAt) || 0;
    const body = { ...test, createdAt: (isNew || !(keepCreated > 0)) ? stamp : keepCreated };
    const payload = JSON.stringify(body);
    if (payload.length > 5000000) {
      toast('Тест слишком огромный (больше 5МБ). Попробуйте меньше картинок.', 'warn');
      return false;
    }

    try{
      let res;
      if (isNew) {
        res = await fbFetch('/.json', {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(Object.assign(
            { ['tests/' + test.id]: body, ['rateLimit/' + state.user.id + '/test']: stamp },
            state.user.isGuest ? { guestLimit: stamp } : {}
          ))
        });
      } else {
        res = await fbFetch(`/tests/${test.id}.json`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: payload
        });
      }
      if(!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error(isNew ? 'слишком частое создание тестов, попробуйте чуть позже' : 'нет прав на изменение этого теста');
        const err = await res.text();
        throw new Error(`HTTP ${res.status}: ${err}`);
      }
      let written = null;
      try { written = await res.json(); } catch {}
      const savedTest = written && (isNew ? written['tests/' + test.id] : written);
      const ts = Number(savedTest && savedTest.createdAt) || Date.now();
      test.createdAt = ts;
      if (isNew) markCooldown('test');
      const clean = sanitizeTests([JSON.parse(JSON.stringify({ ...test, createdAt: ts }))])[0];
      if (clean) {
        const idx=state.tests.findIndex(t=>t.id===test.id);
        if(idx>=0) state.tests[idx]=clean; else state.tests.unshift(clean);
      }
      return true;
    }catch(e){
      toast('Ошибка сохранения: ' + e.message, 'warn');
      console.error(e);
      return false;
    }
  }

  /* =========================================================
     PRESENCE (онлайн) — отдельный узел /presence, без загрузки всех профилей
     ========================================================= */
  let presenceCleanup = null;
  function setupPresence() {
    if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
    if (!state.user || !state.user.id) return;

    const db = firebase.database();
    const myRef = db.ref('/presence/' + state.user.id);
    const connRef = db.ref('.info/connected');
    const allRef = db.ref('/presence');
    const countEl = document.getElementById('online-count');

    const beat = () => { myRef.set({ lastSeen: Date.now() }).catch(()=>{}); };
    const onConn = (snap) => {
      if (snap.val() === false) return;
      myRef.onDisconnect().remove().then(beat).catch(()=>{});
    };
    const onAll = (snap) => {
      const users = snap.val() || {};
      const now = Date.now();
      let count = 0;
      for (const k in users) {
        const u = users[k];
        if (u && u.lastSeen && (now - u.lastSeen < 120000)) count++;
      }
      if (countEl) countEl.textContent = Math.max(count, 1);
    };

    connRef.on('value', onConn);
    allRef.on('value', onAll, () => {});
    const iv = setInterval(beat, 45000);
    presenceCleanup = () => {
      connRef.off('value', onConn);
      allRef.off('value', onAll);
      clearInterval(iv);
      myRef.remove().catch(()=>{});
    };
  }

  /* =========================================================
     ПРОВЕРКА ОТВЕТОВ
     ========================================================= */
  const normText = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();

  // resp: массив id выбранных ответов или строка (для текстового вопроса)
  function gradeQuestion(q, resp){
    if(q.type==='text'){
      const v = normText(resp);
      return !!v && q.answers.some(a => normText(a.text) === v);
    }
    const sel=(Array.isArray(resp)?resp:[]).slice().sort();
    const right=q.answers.filter(a=>a.correct).map(a=>a.id).sort();
    return sel.length===right.length&&sel.every((v,i)=>v===right[i]);
  }

  /* =========================================================
     SHARE LINK (компактная, без UUID; результат пересчитывается по тесту)
     ========================================================= */
  function b64uEnc(str){
    const bytes = new TextEncoder().encode(str);
    let s=''; bytes.forEach(b => s += String.fromCharCode(b));
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64uDec(str){
    let s = String(str).replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    const bin = atob(s);
    const u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(u);
  }

  function makeShareUrl(r){
    const base = location.origin + location.pathname;
    if(r.share){
      return `${base}#/result?id=${encodeURIComponent(r.testId)}&n=${encodeURIComponent(r.player||'')}&tm=${Math.round((r.time||0)/1000)}&d=${b64uEnc(JSON.stringify(r.share))}`;
    }
    const who = `&n=${encodeURIComponent(r.player||'')}`;
    const endId = r.mode === 'tree' ? (r.ending && r.ending.id) : r.mode === 'diagram' ? (r.winner && r.winner.id) : null;
    if (endId) return `${base}#/result?id=${encodeURIComponent(r.testId)}${who}&e=${encodeURIComponent(endId)}`;
    if (r.mode === 'tournament' && r.winner && r.winner.id) return `${base}#/result?id=${encodeURIComponent(r.testId)}${who}&w=${encodeURIComponent(r.winner.id)}`;
    return `${base}#/test/${encodeURIComponent(r.testId)}`;
  }

  async function copyText(text){

    if (!login || login.length < 3) return 'Логин — не короче 3 символов';

    if (!/^[a-z0-9._-]+$/.test(login)) return 'Логин: только латиница (a-z), цифры, точка, дефис, _';
    return null;
  }
  function validatePassword(password) {
    if (!password || password.length < 6) return 'Пароль — минимум 6 символов';
    return null;
  }
  function fbErrorToRu(code) {
    const map = {
      'auth/email-already-in-use': 'Этот логин уже занят — попробуй другой',
      'auth/credential-already-in-use': 'Этот логин уже занят — попробуй другой',
      'auth/invalid-email': 'Недопустимые символы в логине. Используй только латиницу (a-z)',
      'auth/weak-password': 'Пароль слишком простой — нужно минимум 6 символов',
      'auth/operation-not-allowed': 'Регистрация отключена в настройках Firebase',
      'auth/network-request-failed': 'Нет связи с сервером. Проверь интернет',
      'auth/too-many-requests': 'Слишком много попыток. Подожди пару минут',
      'auth/user-not-found': 'Аккаунт не найден',
      'auth/wrong-password': 'Неверный пароль',
      'auth/invalid-credential': 'Неверный логин или пароль'
    };
    return map[code] || ('Ошибка: ' + code);

  async function doRegister(login, password, displayName){
    login = (login || '').trim().toLowerCase();
    displayName = (displayName || '').trim();
    const loginErr = validateLogin(login);
    if (loginErr) { toast(loginErr, 'warn'); return false; }
    const passErr = validatePassword(password);
    if (passErr) { toast(passErr, 'warn'); return false; }

    try {
      const email = login + '@pikuko.local';
      const currentUser = firebase.auth().currentUser;
      let user;
      if (currentUser && currentUser.isAnonymous) {
        const credential = firebase.auth.EmailAuthProvider.credential(email, password);
        const res = await currentUser.linkWithCredential(credential);
        user = res.user;
      } else {
        const res = await firebase.auth().createUserWithEmailAndPassword(email, password);
        user = res.user;
      }
      const uid = user.uid;
      const cleanName = cleanText(displayName || login).slice(0, 40) || login;
      const profile = { name: cleanName, avatar: (state.user && state.user.avatar) || EMOJIS[Math.floor(Math.random()*EMOJIS.length)] };
      await fbFetch(`/users/${uid}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profile) });
      state.user = { id: uid, login: login, isGuest: false, ...profile };
      toast('Успешно!', 'good');
      return true;
    } catch (error) {
      console.error('Регистрация:', error);
      toast(fbErrorToRu(error.code), 'warn');
      return false;
    }
  }

  /* =========================================================
     СОРТИРОВКА ГЛАВНОЙ
     новые (5 дней) сверху → дальше по рейтингу: хорошие → без оценок → плохие
     ========================================================= */
  const NEW_MS = 5 * 24 * 3600 * 1000;
  const isNewTest = t => (Date.now() - (t.createdAt || 0)) < NEW_MS;
  function ratingScore(id){
    const { likes, dislikes } = voteCounts(id);
    return (likes + 1) / (likes + dislikes + 2); // 0.5 = нет оценок, >0.5 хороший, <0.5 плохой
  }
  function sortedTests(list){
    const fresh = [], rest = [];
    list.forEach(t => (isNewTest(t) ? fresh : rest).push(t));
    fresh.sort((a,b) => b.createdAt - a.createdAt);
    rest.sort((a,b) => {
      const d = ratingScore(b.id) - ratingScore(a.id);
      if (Math.abs(d) > 1e-9) return d;
      const va = voteCounts(a.id), vb = voteCounts(b.id);
      const tv = (vb.likes + vb.dislikes) - (va.likes + va.dislikes);
      if (tv) return tv;
      return b.createdAt - a.createdAt;
    });
    return fresh.concat(rest);
  }

  /* =========================================================
     SEED
     ========================================================= */
  function s1(text,ans,idx){return{id:uid(),text,type:'single',image:null,answers:ans.map((t,i)=>({id:uid(),text:t,correct:i===idx,nextId:null,points:{}}))}}
  function sM(text,ans){return{id:uid(),text,type:'multi',image:null,answers:ans.map(([t,c])=>({id:uid(),text:t,correct:!!c,nextId:null,points:{}}))}}
  function seed(){return[
    {id:uid(),title:'Основы Python',description:'Проверь базу.',author:'Пикуко',createdAt:Date.now(),mode:'standard',questions:[
      s1('Тип данных 3 / 2?',['float','int','str','complex'],0),
      s1('Объявление функции?',['def foo():','function foo():','func foo():','void foo():'],0),
      s1('len([1,2,3])?',['3','2','6','Ошибка'],0),
      sM('Изменяемые типы?',[['list',true],['dict',true],['tuple',false],['str',false]]),
    ]},
    {id:uid(),title:'Космос',description:'Знания о Солнечной системе.',author:'Пикуко',createdAt:Date.now(),mode:'standard',questions:[
      s1('Самая большая планета?',['Юпитер','Сатурн','Нептун','Земля'],0),
      s1('Сколько планет?',['8','9','7','10'],0),
      s1('Ближайшая к Солнцу?',['Меркурий','Венера','Земля','Марс'],0),
    ]},
  ]}

  function applyTheme(){document.documentElement.dataset.theme=state.theme}
  function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';store.set('theme',state.theme);applyTheme()}

  /* =========================================================
     ROUTER
     ========================================================= */
  let play=null,playTimer=null,lastResult=null,draft=null;

  function parseRoute(){
    const path=(location.hash.replace(/^#/,'')||'/').replace(/\/+$/,'')||'/';
    const parts=path.split('?');
    const routeParts=parts[0].split('/').filter(Boolean);
    return {route:routeParts[0]||'home',param:routeParts[1]?(()=>{try{return decodeURIComponent(routeParts[1])}catch{return routeParts[1]}})():undefined,params:new URLSearchParams(parts.slice(1).join('?')||'')};
  }

  function updateOnlineWidget(){
    const ow = document.getElementById('online-widget');
    if(!ow) return;
    const {route,param}=parseRoute();
    const isMobile = window.innerWidth <= 768;
    ow.style.display = ((route === 'apps' && param) || (isMobile && route !== 'home')) ? 'none' : 'flex';
  }

  function saveResult(r){
    lastResult=r;
    try{sessionStorage.setItem(KEY+'.result',JSON.stringify(r))}catch{}
  }
  function getLastResult(){
    if(!lastResult){try{lastResult=JSON.parse(sessionStorage.getItem(KEY+'.result'))}catch{}}
    return lastResult;
  }
  // После прохождения всегда идём на экран оценки, а уже потом на результат
  function endGame(r){
    r.player = state.user.name;
    saveResult(r);
    play=null;
    location.hash='#/feedback';
  }

  function render(){
    if(playTimer){clearInterval(playTimer);playTimer=null}
    const {route,param,params}=parseRoute();
    const app=$('#app');
    try{
      if(route==='home'){app.innerHTML=viewHome();bindHome()}
      else if(route==='test'&&param){app.innerHTML=viewTest(param);bindTest(param)}
      else if(route==='play'&&param){startPlay(param)}
      else if(route==='feedback'){app.innerHTML=viewFeedback();bindFeedback()}
      else if(route==='result'){app.innerHTML=viewResult(params);bindResult(params)}
      else if(route==='create'){startEditor(null)}
      else if(route==='edit'&&param){startEditor(param)}
      else if(route==='profile'){app.innerHTML=viewProfile();bindProfile()}
      else if(route==='apps'){
        if(param){
          const appItem = APPS.find(a => a.id === param);
          if(appItem){
            const headerH = document.querySelector('.site-header')?.offsetHeight || 64;
            app.innerHTML = `<div class="app-viewer" style="top:${headerH}px">
              <iframe src="${esc(appItem.url)}" title="${esc(appItem.name)}" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
            </div>`;
          } else {
            app.innerHTML = '<div class="wrap"><h1>Приложение не найдено</h1><p class="muted">Такого прикола ещё нет.</p><p><a class="btn" href="#/apps">← К приложениям</a></p></div>';
          }
        } else {
          app.innerHTML = viewApps();
        }
      }
      else{app.innerHTML='<div class="wrap"><h1>404</h1><a class="btn" href="#/">На главную</a></div>'}
      updateOnlineWidget();
    }catch(e){
      console.error(e);app.innerHTML=`<div class="wrap"><h1>Ошибка</h1><pre>${esc(e.message)}</pre><a class="btn" href="#/">На главную</a></div>`;
    }
    window.scrollTo({top:0});
  }
  window.addEventListener('resize', updateOnlineWidget);

     GALLERY / HOME / TEST

    let m='📝';if(t.mode==='time')m='⏱';if(t.mode==='survival')m='💀';if(t.mode==='tournament')m='🏆';if(t.mode==='tree')m='🌳';if(t.mode==='diagram')m='📊';

    const { likes, dislikes } = voteCounts(t.id);

    if (t.isQuality) marks.push('<span class="badge quality">⭐ Знак качества</span>');
    return `<a class="card test-card" href="#/test/${esc(t.id)}">
      ${qImg}
      <div class="test-card-content">

        <h3>${esc(t.title)}</h3><p class="muted">${esc(t.description||'Без описания')}</p>

        ${marks.length ? `<div class="row" style="margin-top:8px;gap:6px">${marks.join('')}</div>` : ''}

    const totalQ=state.tests.reduce((s,t)=>s+(t.questions?t.questions.length:0),0);
    return `<section class="hero">
      <h1>Проходи. Создавай. <span class="grad">Делись.</span></h1>
      <p class="muted">Вы вошли как: <b>${esc(state.user.avatar)} ${esc(state.user.name)}</b></p>
      <div class="hero-actions">
        <a class="btn primary" href="#/create">+ Создать тест</a>
        <button class="btn ghost" id="random-test">🎲 Случайный тест</button>
        <a class="btn ghost" href="#/apps">🎨 Приложения</a>

  function bindHome(){
    const s=$('#search');if(s)s.addEventListener('input',()=>{
      const q=s.value.trim().toLowerCase();

  function viewTest(id){

          <div class="card big">
            ${qImg}
            <div class="row"><span class="badge">${t.questions.length} вопр.</span>${t.isQuality?'<span class="badge quality">⭐ Знак качества</span>':''}</div>
            <h1>${esc(t.title)}</h1>

              <span class="badge" style="margin-left:8px" title="Оценки доступны после прохождения">👍 ${likes} &nbsp; 👎 ${dislikes}</span>

    const d=$('#del-test');if(d)d.addEventListener('click',async()=>{

  async function mountComments(testId, readonly) {
    const box = $('#comments-box');
    if(!box) return;
    try {
      const comments = await loadComments(testId);
      const t = getTest(testId);
      const ownTest = t && t.authorId === state.user.id;

      box.innerHTML = `<h3>Комментарии (${comments.length})</h3>
        ${readonly ? '' : (state.user.isGuest
          ? `<p class="muted small" style="margin-bottom:16px">Чтобы оставить отзыв, <a href="#/profile" style="color:var(--accent)">войдите или зарегистрируйтесь</a>.</p>`
          : `<div style="margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border)">
          <textarea class="input" id="test-comment" rows="2" maxlength="500" placeholder="Оставить отзыв..."></textarea>
          <button class="btn ghost sm" id="submit-test-comment" style="margin-top:8px">Отправить</button>
        </div>`)}
        ${comments.length ? comments.map(c => `
          <div class="comment">
            ${(c.authorId === state.user.id && !state.user.isGuest) ? `<button class="comment-edit" data-comment-id="${esc(c.id)}" title="Изменить">✎</button>` : ''}
            ${(c.authorId === state.user.id || ownTest) ? `<button class="comment-del" data-comment-id="${esc(c.id)}" title="Удалить">✕</button>` : ''}
            <div class="row between" style="margin-bottom:4px;padding-right:44px">

              <span class="muted small">${c.date ? new Date(c.date).toLocaleDateString() : ''}${c.edited ? ' · изменено' : ''}</span>
            </div>
            <p class="comment-text" style="margin:0;font-size:13px;white-space:pre-wrap">${esc(c.text)}</p>

      const sb = $('#submit-test-comment');
      if (sb) sb.addEventListener('click', async () => {

          const box = card.querySelector('.comment-editbox');

          box.querySelector('[data-cancel]').addEventListener('click', () => mountComments(testId, readonly));
          box.querySelector('[data-save]').addEventListener('click', async () => {

              toast('Комментарий изменён ✓', 'good');
              mountComments(testId, readonly);

  /* =========================================================
     PLAY
     ========================================================= */
  function startPlay(id){
    const t=getTest(id);if(!t){location.hash='#/';return}
    play={testId:id,index:0,maxIndex:0,answers:{},start:Date.now(),scores:{}};
    if(t.mode==='time') play.timeLeft=t.timeLimit||60; // до первого renderPlay, иначе таймер показывает 00:00

    // копии вопросов (с возможным перемешиванием)
    let qs = t.questions.map(q => ({...q, answers: q.answers.slice()}));
    const canShuffle = t.mode !== 'tree' && t.mode !== 'tournament';
    if (canShuffle && t.shuffleAnswers) qs.forEach(q => { if (q.type !== 'text') q.answers = shuffle(q.answers); });
    if (canShuffle && t.shuffleQuestions) qs = shuffle(qs);
    play.questions = qs;

    if(t.mode==='diagram'){
      (t.endings||[]).forEach(e => play.scores[e.id] = 0);
    }
    if(t.mode==='tree'){
      play.currentNodeId=qs.length>0?qs[0].id:null;
      play.history=play.currentNodeId?[play.currentNodeId]:[];
    }
    if(t.mode==='tournament'){
      play.roundItems = shuffle(t.questions);
      play.winners = [];
      play.currentPair = [];
      play.bracketRound = 1;
      nextTournamentPair();
    } else {
      renderPlay();
    }

    if (t.mode === 'time') {
      playTimer = setInterval(() => {
        if (!play) return;
        play.timeLeft--;
        const e = $('#timer');
        if (e) e.textContent = fmtTime(play.timeLeft * 1000);
        if (play.timeLeft <= 0) {
          toast('Время вышло!', 'warn');
          finishPlay();
        }
      }, 1000);
    } else if (t.mode !== 'tournament' && t.mode !== 'tree' && t.mode !== 'diagram') {
      playTimer=setInterval(()=>{const e=$('#timer');if(e&&play)e.textContent=fmtTime(Date.now()-play.start)},500);
    }
  }

  function nextTournamentPair() {
    if (!play.roundItems.length && !play.winners.length) { finishPlay(); return; } // пустой/битый тест
    if (play.roundItems.length < 2) {
      if (play.roundItems.length === 1) play.winners.push(play.roundItems.pop());
      if (play.winners.length === 1) {
        play.champion = play.winners[0];
        finishPlay();
        return;
      }
      play.roundItems = shuffle(play.winners);
      play.winners = [];
      play.bracketRound++;
    }
    const a = play.roundItems.pop();
    const b = play.roundItems.pop();
    play.currentPair = [a, b];
    renderTournamentPlay();
  }

  function renderTournamentPlay() {
    const t = getTest(play.testId);
    const [a, b] = play.currentPair;
    $('#app').innerHTML = `<div class="wrap narrow">
      <div class="play-head"><a href="#/test/${esc(t.id)}" class="muted small">← Выйти</a><span class="badge">Раунд ${play.bracketRound}</span></div>
      <p class="muted small center" style="margin-bottom:24px">Выберите лучший вариант. Остальные вылетают.</p>
      <div class="tournament-container">
        ${[a,b].map(x=>`<div class="tournament-item" data-aid="${esc(x.id)}">
          ${x.image ? `<img src="${esc(x.image)}" alt="">` : ''}
          <h3>${esc(x.text)}</h3>
        </div>`).join('')}
      </div>
    </div>`;
    $$('.tournament-item').forEach(el => {
      el.addEventListener('click', () => {
        const winner = play.currentPair.find(x => x.id === el.dataset.aid);
        play.winners.push(winner);
        nextTournamentPair();
      });
    });
  }

  function curQuestion(){
    const t=getTest(play.testId);
    return t.mode==='tree'?play.questions.find(x=>x.id===play.currentNodeId):play.questions[play.index];
  }

  function renderPlay(){
    const t=getTest(play.testId);if(!t){play=null;location.hash='#/';return}
    let q,total,pct,displayIndex;
    if(t.mode==='tree'){
      q=curQuestion();
      if(!q){finishPlay();return;}
      total=play.history.length;displayIndex=total;pct=100;
    } else {
      q=curQuestion();
      if(!q){finishPlay();return}
      total=play.questions.length;displayIndex=play.index+1;pct=Math.round((play.index/total)*100);
      play.maxIndex=Math.max(play.maxIndex,play.index);
    }

    let nextBtn = '';
    if (t.mode === 'tree') {
      nextBtn = `<button class="btn primary" id="next-step">Следующий шаг →</button>`;
    } else {
      nextBtn = play.index === total - 1
        ? `<button class="btn primary" id="finish">Завершить</button>`
        : `<button class="btn primary" id="next">Далее →</button>`;
    }
    // назад можно вернуться максимум на 2 вопроса от самого дальнего
    const prevDisabled = play.index === 0 || (play.index - 1) < (play.maxIndex - 2);

    const body = q.type==='text'
      ? `<input class="input" id="text-answer" maxlength="200" autocomplete="off" placeholder="Введите ответ" style="margin-top:16px" value="${esc(play.answers[q.id]||'')}">`
      : `<div class="answers" id="answers">${q.answers.map(a=>`<button class="answer" data-aid="${esc(a.id)}">${esc(a.text)}</button>`).join('')}</div>`;

    $('#app').innerHTML=`<div class="wrap narrow">
      <div class="play-head"><a href="#/test/${esc(t.id)}" class="muted small">← Выйти</a><span id="timer">${t.mode === 'time' ? fmtTime(play.timeLeft * 1000) : t.mode === 'diagram' ? '' : fmtTime(Date.now() - play.start)}</span></div>
      <div class="progress"><div class="bar" style="width:${t.mode==='tree' ? 100 : pct}%"></div></div>
      <p class="muted small">${t.mode==='tree' ? 'Шаг ' + displayIndex : 'Вопрос ' + displayIndex + ' из ' + total}</p>
      <div class="card">
        <h2>${esc(q.text)}</h2>
        ${q.image?`<img src="${esc(q.image)}" class="q-img" alt="">`:''}
        ${body}
      </div>
      <div class="row between" style="margin-top:16px">
        ${t.mode!=='tree' ? `<button class="btn ghost" id="prev" ${prevDisabled?'disabled':''}>← Назад</button>` : `<div></div>`}
        ${nextBtn}
      </div>
    </div>`;
    updateAnswerUI();bindPlay();
  }

  function updateAnswerUI(){
    const q=curQuestion();
    if(!q||q.type==='text')return;
    const sel=play.answers[q.id]||[];
    $$('#answers .answer').forEach(b=>b.classList.toggle('selected',sel.includes(b.dataset.aid)))
  }

  function bindPlay(){
    const t=getTest(play.testId);
    const q=curQuestion();
    if(!q)return;

    const answersEl = $('#answers');
    if(answersEl) {
      answersEl.addEventListener('click',e=>{
        const btn=e.target.closest('.answer');if(!btn)return;
        const aid=btn.dataset.aid;
        if(q.type==='single' || t.mode==='tree'){
          play.answers[q.id]=[aid];
        } else {
          const arr=(play.answers[q.id]||[]).slice();
          const i=arr.indexOf(aid);
          if(i>=0)arr.splice(i,1);else arr.push(aid);
          play.answers[q.id]=arr;
        }
        updateAnswerUI();
      });
    }

    const ti=$('#text-answer');
    if(ti){
      ti.addEventListener('input',()=>{play.answers[q.id]=ti.value});
      ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=$('#next')||$('#finish');if(b)b.click()}});
      setTimeout(()=>ti.focus(),0);
    }

    const n=$('#next'),p=$('#prev'),f=$('#finish'),ns=$('#next-step');

    // «Выживание»: неверный ответ завершает игру — и на «Далее», и на «Завершить» (и по Enter, он жмёт эти же кнопки)
    const survivalOk = () => {
      if (t.mode === 'survival' && !gradeQuestion(q, play.answers[q.id])) {
        toast('Ошибка! Выживание окончено.', 'warn');
        finishPlay();
        return false;
      }
      return true;
    };

    if(n) n.addEventListener('click', () => {
      if (!survivalOk()) return;
      play.index++; renderPlay();
    });

    if(p)p.addEventListener('click',()=>{
      if(play.index===0||(play.index-1)<(play.maxIndex-2))return;
      play.index--;renderPlay();
    });
    if(f)f.addEventListener('click',()=>{ if (!survivalOk()) return; finishPlay(); });

    if (ns) {
      ns.addEventListener('click', () => {
        const selectedId = (play.answers[q.id] || [])[0];
        if (!selectedId) { toast('Выберите вариант ответа', 'warn'); return; }
        const ans = q.answers.find(a => a.id === selectedId);

        if (ans && ans.nextId) {
          if (ans.nextId.startsWith('E_')) {
            const endingId = ans.nextId.slice(2);
            const ending = (t.endings || []).find(e => e.id === endingId);
            endGame({ testId: t.id, title: t.title, mode: t.mode, ending: ending || { title: 'Конец', desc: '' }, time: Date.now() - play.start });
            return;
          } else if (ans.nextId.startsWith('Q_')) {
            play.currentNodeId = ans.nextId.slice(2);
            play.history.push(play.currentNodeId);
            renderPlay(); return;
          }
        }

        const currentIndex = play.questions.findIndex(x => x.id === q.id);
        if (currentIndex >= 0 && currentIndex < play.questions.length - 1) {
          play.currentNodeId = play.questions[currentIndex + 1].id;
          play.history.push(play.currentNodeId);
          renderPlay();
        } else {
          const fallbackEnding = (t.endings && t.endings.length > 0) ? t.endings[0] : { title: 'Конец', desc: '' };
          endGame({ testId: t.id, title: t.title, mode: t.mode, ending: fallbackEnding, time: Date.now() - play.start });
        }
      });
    }
  }

  function finishPlay(){
    if (!play) return;
    const t=getTest(play.testId);
    if (!t) { location.hash = '#/'; return; }
    const time = Date.now() - play.start;

    if(t.mode==='tournament'){
      const winner = play.champion || play.currentPair[0];
      endGame({ testId: t.id, title: t.title, mode: t.mode, winner, time });
      return;
    }

    if(t.mode==='tree'){
      const fallbackEnding = (t.endings && t.endings.length > 0) ? t.endings[0] : { title: 'Конец', desc: 'Вы завершили прохождение.' };
      endGame({ testId: t.id, title: t.title, mode: t.mode, ending: fallbackEnding, time });
      return;
    }

    if(t.mode==='diagram'){
      play.questions.forEach(q=>{
        (play.answers[q.id]||[]).forEach(aid=>{
          const ans=q.answers.find(a=>a.id===aid);
          if(ans && ans.points){
            Object.entries(ans.points).forEach(([endId, val])=>{
              play.scores[endId] = (play.scores[endId] || 0) + Number(val);
            });
          }
        });
      });
      let maxId = Object.keys(play.scores)[0];
      let maxVal = -1;
      Object.entries(play.scores).forEach(([id, val]) => { if(val > maxVal) { maxVal = val; maxId = id; } });
      const winnerEnding = (t.endings || []).find(e => e.id === maxId) || (t.endings && t.endings.length > 0 ? t.endings[0] : { title: 'Нет данных', desc: '' });
      endGame({testId:t.id,title:t.title,mode:t.mode,scores:play.scores,winner:winnerEnding,time});
      return;
    }

    let correct=0;
    const review=play.questions.map(q=>{
      const resp=play.answers[q.id];
      const ok=gradeQuestion(q,resp);
      if(ok)correct++;
      const sel=q.type==='text'?String(resp||''):(Array.isArray(resp)?resp.slice():[]);
      const right=q.answers.filter(a=>a.correct).map(a=>a.id);
      return{q,sel,right,ok};
    });
    // компактные данные для ссылки: по порядку оригинальных вопросов
    const share=t.questions.map(oq=>{
      const it=review.find(x=>x.q.id===oq.id);
      if(oq.type==='text')return it?String(it.sel).slice(0,120):'';
      if(!it)return [];
      return it.sel.map(id=>oq.answers.findIndex(a=>a.id===id)).filter(i=>i>=0);
    });
    const total=t.questions.length,percent=total>0?Math.round((correct/total)*100):0;
    endGame({testId:t.id,title:t.title,mode:t.mode,correct,total,percent,review,share,time});
  }

  /* =========================================================
     FEEDBACK (после теста: оценка + необязательный комментарий)
     ========================================================= */
  // Оценивать могут только зарегистрированные и не авторы теста; комментировать — зарегистрированные
  function fbPerms(testId){
    const t=getTest(testId);
    return { t, canVote: !!t && !state.user.isGuest && t.authorId!==state.user.id, canComment: !!t && !state.user.isGuest };
  }

  function viewFeedback(){
    const r=getLastResult();
    if(!r) return `<div class="wrap"><p class="muted">Результат не найден.</p><a class="btn" href="#/">На главную</a></div>`;
    const voted = myVote(r.testId);
    const { canVote, canComment } = fbPerms(r.testId);
    return `<div class="wrap narrow">
      <div class="card big center">
        <div style="font-size:48px">🎉</div>
        <h1>Тест пройден!</h1>
        <p class="muted">${esc(r.title)}</p>
        ${canVote ? `<h3 style="margin-top:24px">Оцените тест</h3>
        <div class="row center">
          <button class="btn ghost big ${voted==='like'?'active-vote':''}" data-vote="like">👍 Нравится</button>
          <button class="btn ghost big ${voted==='dislike'?'active-vote':''}" data-vote="dislike">👎 Не нравится</button>
        </div>` : `<p class="muted small" style="margin-top:24px">${state.user.isGuest
          ? 'Оценивать и комментировать тесты могут только зарегистрированные пользователи. <a href="#/profile" style="color:var(--accent)">Войти / Регистрация</a>'
          : 'Свой тест оценивать нельзя.'}</p>`}
        ${canComment ? `<div style="margin-top:20px;text-align:left">
          <label class="label">Комментарий (по желанию)</label>
          <textarea class="input" id="fb-comment" rows="3" maxlength="500" placeholder="Что думаете о тесте?"></textarea>
        </div>` : ''}
        <button class="btn primary big" id="show-result" style="margin-top:20px;width:100%">Показать результат</button>
      </div>
    </div>`;
  }

  function bindFeedback(){
    const r=getLastResult();if(!r)return;
    $$('[data-vote]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const type=btn.dataset.vote;
        const t=getTest(r.testId);
        if(!t){toast('Тест уже удалён','warn');return}
        const next = myVote(t.id) === type ? null : type;
        if (await castVote(t.id, next)) {
          $$('[data-vote]').forEach(b => b.classList.toggle('active-vote', b.dataset.vote === next));
          toast(next ? 'Оценка сохранена' : 'Оценка снята', 'good');
        }
      });
    });
    const sb=$('#show-result');
    sb.addEventListener('click',async()=>{
      const { t, canVote, canComment } = fbPerms(r.testId);
      if(canVote && !myVote(t.id)){toast('Сначала оцените тест','warn');return}
      const txt=(($('#fb-comment')||{}).value||'').trim();
      sb.disabled=true;
      if(t && txt && canComment){
        if(!(await postComment(r.testId, txt))){ sb.disabled=false; return; }
      }
      location.hash='#/result';
    });
  }

  /* =========================================================
     RESULT
     ========================================================= */
  function reviewItemHtml(q, i, ok, mine, right){
    return `<div class="card review ${ok?'ok':'bad'}">
      <div class="row between"><b>${i+1}. ${esc(q.text)}</b><span class="badge ${ok?'good':'wrong'}">${ok?'✓':'✗'}</span></div>
      <p class="small"><span class="muted">Ответ:</span> ${mine?esc(mine):'<i>нет ответа</i>'}</p>
      ${ok?'':`<p class="small"><span class="muted">Правильный ответ:</span> ${esc(right)}</p>`}
    </div>`;
  }
  const answerTexts=(q,ids)=>ids.map(id=>q.answers.find(a=>a.id===id)?.text||'').filter(Boolean).join(', ');
  const rightText=q=>q.type==='text'?q.answers.map(a=>a.text).join(' / '):q.answers.filter(a=>a.correct).map(a=>a.text).join(', ');

  const isSharedParams = p => !!p.get('id') && !!(p.get('d') || p.get('e') || p.get('w'));

  function viewSharedResult(params){
    const test = getTest(params.get('id'));
    if (!test) return `<div class="wrap"><h1>Тест не найден</h1><p class="muted">Возможно, автор удалил его.</p><a class="btn" href="#/">На главную</a></div>`;

    // режимы «Древо», «Диаграмма» (e = id концовки) и «Турнир» (w = id победителя)
    if (params.get('e') || params.get('w')) {
      const nm = (params.get('n')||'').slice(0,40);
      const who = nm ? `Игрок <b>${esc(nm)}</b>` : 'Игрок';
      const isWinner = !!params.get('w');
      const item = isWinner
        ? test.questions.find(x => x.id === params.get('w'))
        : (test.endings||[]).find(x => x.id === params.get('e'));
      if (!item) return `<div class="wrap"><h1>Результат не найден</h1><p class="muted">Тест мог быть изменён автором.</p><a class="btn" href="#/test/${esc(test.id)}">Открыть тест</a></div>`;
      const title = isWinner ? item.text : item.title;
      const desc = isWinner ? '' : item.desc;
      const img = safeImg(item.image) ? `<img src="${esc(item.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : '';
      const lead = isWinner ? `${who} выбрал победителем турнира «${esc(test.title)}»` : `${who} прошёл «${esc(test.title)}» и получил результат`;
      return `<div class="wrap narrow"><div class="card center">
        <p class="muted">${lead}</p>
        ${img}
        <h1 style="color:var(--accent)">${esc(title)}</h1>
        ${desc ? `<p style="margin:16px auto;max-width:600px;white-space:pre-wrap">${esc(desc)}</p>` : ''}
        <div class="row center" style="margin-top:24px">
          <a class="btn primary" href="#/test/${esc(test.id)}">Пройти тест</a>
          <a class="btn ghost" href="#/">Все тесты</a>
        </div>
      </div></div>`;
    }

    let details=null;
    try{details=JSON.parse(b64uDec(params.get('d')||''))}catch{}
    if(!Array.isArray(details)) return `<div class="wrap"><h1>Ссылка повреждена</h1><a class="btn" href="#/test/${esc(test.id)}">Открыть тест</a></div>`;

    let correct=0;
    const items=test.questions.map((q,i)=>{
      const raw=details[i];
      let resp,mine;
      if(q.type==='text'){resp=typeof raw==='string'?raw:'';mine=resp}
      else{const ids=(Array.isArray(raw)?raw:[]).map(ix=>q.answers[ix]?.id).filter(Boolean);resp=ids;mine=answerTexts(q,ids)}
      const ok=gradeQuestion(q,resp);if(ok)correct++;
      return reviewItemHtml(q,i,ok,mine,rightText(q));
    });
    const total=test.questions.length;
    const p=total?Math.round(correct/total*100):0;
    const name=(params.get('n')||'').slice(0,40);
    const tm=parseInt(params.get('tm'))||0;
    return `<div class="wrap narrow">
      <div class="card center">
        <p class="muted">${name?`Результат игрока <b>${esc(name)}</b>`:'Результат прохождения'}</p>
        <h1>${esc(test.title)}</h1>
        <div class="score-circle" style="--p:${p}"><span>${p}%</span></div>
        <h2>Правильно ${correct} из ${total}</h2>
        <p class="muted">Время: ${fmtTime(tm*1000)}</p>
        <div class="row center" style="margin-top:16px">
          <a class="btn primary" href="#/test/${esc(test.id)}">Пройти тест</a>
          <a class="btn ghost" href="#/">Все тесты</a>
        </div>
      </div>
      <h3 style="margin-top:24px">Разбор ответов</h3>
      ${items.join('')}
    </div>`;
  }

  function viewResult(params){
    if (isSharedParams(params)) return viewSharedResult(params);

    const r=getLastResult();
    if(!r) return `<div class="wrap"><p class="muted">Результат не найден.</p><a class="btn" href="#/">На главную</a></div>`;

    let main='';
    const buttons = `<div class="row center" style="margin-top:24px">
        <button class="btn primary" id="share-result-link">🔗 Скопировать ссылку</button>
        <a class="btn ghost" href="#/">К тестам</a>
      </div>`;

    if(r.mode === 'tree') {
      const ending = r.ending || { title: 'Конец', desc: '' };
      main = `<div class="card center">
        <p class="muted" style="margin-bottom:24px">Финал истории</p>
        ${safeImg(ending.image) ? `<img src="${esc(ending.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : ''}
        <h1 style="color:var(--accent)">${esc(ending.title)}</h1>
        <p style="font-size:16px;margin:24px auto;line-height:1.6;max-width:600px;white-space:pre-wrap">${esc(ending.desc)}</p>
        ${buttons}
      </div>`;
    } else if (r.mode === 'tournament') {
      const winner = r.winner || { text: 'Нет данных', image: '' };
      main = `<div class="card center">
        <h1>Победитель турнира</h1>
        ${safeImg(winner.image) ? `<img src="${esc(winner.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : ''}
        <h2 style="color:var(--accent);margin-top:20px">${esc(winner.text)}</h2>
        ${buttons}
      </div>`;
    } else if(r.mode==='diagram'){
      const winner = r.winner || { title: 'Нет данных', desc: '' };
      main=`<div class="card center">
        <h1>Твой результат</h1>
        <p class="muted">${esc(r.title)}</p>
        ${safeImg(winner.image) ? `<img src="${esc(winner.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : ''}
        <h2 style="color:var(--accent)">Ты — <span class="grad">${esc(winner.title)}</span>!</h2>
        ${winner.desc ? `<p style="margin:16px auto;max-width:600px;white-space:pre-wrap">${esc(winner.desc)}</p>` : ''}
        ${buttons}
      </div>`;
    } else {
      const msg=r.percent>=90?'Блестяще! 🏆':r.percent>=70?'Отлично! 🎉':r.percent>=50?'Неплохо 💪':'Повтори 📚';
      main=`<div class="card center">
        <p class="muted">${esc(r.title)}</p>
        <div class="score-circle" style="--p:${r.percent}"><span>${r.percent}%</span></div>
        <h2>${msg}</h2>
        <p class="muted">Правильно ${r.correct} из ${r.total}</p>
        <p class="muted small">Время: ${fmtTime(r.time)}</p>
        ${buttons}
      </div>
      <h3>Разбор</h3>
      ${(r.review||[]).map((it,i)=>{
        const q=it.q;
        const mine=q.type==='text'?String(it.sel||'').trim():answerTexts(q,it.sel||[]);
        return reviewItemHtml(q,i,it.ok,mine,rightText(q));
      }).join('')}`;
    }
    return `<div class="wrap wide"><div class="result-layout"><div class="result-main">${main}</div><div class="result-sidebar sidebar-sticky"><div class="sidebar-comments" id="comments-box"><h3>Загрузка...</h3></div></div></div></div>`;
  }

  function bindResult(params){
    if (isSharedParams(params)) return;
    const r=getLastResult();if(!r)return;

    const shareLink=$('#share-result-link');
    if(shareLink)shareLink.addEventListener('click',async ()=>{
      const url = makeShareUrl(r);
      if(navigator.share) {
        try { await navigator.share({title:'Мой результат',text:`Я прошёл «${r.title}»!`,url}); return; } catch(e) { if(e && e.name==='AbortError') return; }
      }
      toast((await copyText(url)) ? 'Ссылка скопирована ✓' : 'Не удалось скопировать', 'good');
    });

    mountComments(r.testId, true);
    if(r.percent>=70&&r.mode==='standard')confetti();
  }

  function confetti(){const c=['#a855f7','#ec4899','#22c55e','#f59e0b','#3b82f6'];for(let i=0;i<80;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.animationDelay=(Math.random()*0.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}

  /* =========================================================
     EDITOR
     ========================================================= */
  function blankDraft(){return { id:null, title:'', description:'', mode:'standard', categories:[], endings:[], questions:[newQuestion()], previewImage:null, timeLimit:60, shuffleQuestions:false, shuffleAnswers:false };}

  function startEditor(id){
    if (id) {
      const t = getTest(id);
      if (t && t.authorId !== state.user.id) { toast('Редактировать можно только свои тесты','warn'); location.hash = '#/test/' + encodeURIComponent(id); return; }
      draft = t ? JSON.parse(JSON.stringify(t)) : null;
    } else {
      let saved = null;
      try { saved = localStorage.getItem('pikuco2.draft'); } catch {}
      if (saved) {
        if (confirm('У вас есть незаконченный тест. Восстановить его?')) {
          try { draft = JSON.parse(saved); } catch { draft = blankDraft(); }
        } else {
          try { localStorage.removeItem('pikuco2.draft'); } catch {}
          draft = blankDraft();
        }
      } else {
        draft = blankDraft();
      }
    }
    if(!draft) { location.hash = '#/'; return; }
    if(!draft.mode) draft.mode='standard';
    if(draft.mode==='diagram' && (!draft.endings||!draft.endings.length)) draft.endings=[{id:uid(),title:'Результат 1',desc:''}];
    if(!draft.endings) draft.endings=[];
    if(!draft.timeLimit) draft.timeLimit = 60;
    renderEditor();
  }

  function saveDraftState() {
    if (draft && !draft.id) {
      try { localStorage.setItem('pikuco2.draft', JSON.stringify(draft)); } catch {}
    }
  }

  function renderEditor(){
    const isDiagram=draft.mode==='diagram';
    const isTree=draft.mode==='tree';
    const isTournament=draft.mode==='tournament';
    const isTime=draft.mode==='time';

    $('#app').innerHTML=`<div class="wrap narrow">
      <a href="#/" class="muted small" id="cancel-editor">← Отмена</a>
      <div class="row between" style="margin-top:8px"><h1 style="margin:0">${draft.id?'Редактирование':'Новый тест'}</h1><button class="btn primary" id="save">Сохранить</button></div>

      <label class="label">Название (макс. 150 символов)</label>
      <input class="input" id="e-title" maxlength="150" value="${esc(draft.title)}">

      <label class="label">Описание (макс. 400 символов)</label>
      <textarea class="input" id="e-desc" rows="3" maxlength="400">${esc(draft.description)}</textarea>

      <label class="label">Превью (обложка теста) — обязательна</label>
      <div class="row">
        <input type="file" accept="image/*" id="e-preview" style="display:none">
        <button class="btn ghost sm" id="pick-preview">📷 Загрузить обложку</button>
        ${draft.previewImage ? `<button class="btn danger sm" id="del-preview">Удалить обложку</button>` : ''}
      </div>
      ${draft.previewImage ? `<img src="${esc(draft.previewImage)}" alt="" style="max-height:150px;border-radius:12px;margin-top:12px;border:1px solid var(--border)">` : ''}

      <div class="row" style="margin-top:16px">
        <div style="flex:1">
          <label class="label">Режим</label>
          <select class="input" id="e-mode">
            <option value="standard" ${draft.mode==='standard'?'selected':''}>📝 Обычный</option>
            <option value="time" ${draft.mode==='time'?'selected':''}>⏱ На время</option>
            <option value="survival" ${draft.mode==='survival'?'selected':''}>💀 Выживание</option>
            <option value="tournament" ${draft.mode==='tournament'?'selected':''}>🏆 Турнир</option>
            <option value="tree" ${draft.mode==='tree'?'selected':''}>🌳 Древо</option>
            <option value="diagram" ${draft.mode==='diagram'?'selected':''}>📊 Диаграмма</option>
          </select>
        </div>
        ${isTime ? `
        <div style="flex:1">
          <label class="label">Время на тест (сек)</label>
          <input class="input" type="number" id="e-time" value="${esc(draft.timeLimit)}" min="2">
        </div>` : ''}
      </div>

      ${(!isTree && !isTournament) ? `
      <div class="row" style="margin-top:16px;gap:24px">
        <label class="check"><input type="checkbox" id="e-shufq" ${draft.shuffleQuestions?'checked':''}> Перемешать вопросы</label>
        <label class="check"><input type="checkbox" id="e-shufa" ${draft.shuffleAnswers?'checked':''}> Перемешать варианты ответа</label>
      </div>` : ''}

      ${(isDiagram || isTree) ? `
        <div style="margin-top:24px">
          <label class="label">Концовки / Результаты</label>
          <div id="endings-list">${renderEndingsHTML()}</div>
          <button class="btn ghost sm" id="add-ending" style="margin-top:8px">+ Добавить результат</button>
        </div>
      ` : ''}

      <div id="qlist" class="qlist" style="margin-top:24px"></div>
      <button class="btn ghost" id="add-q">+ Добавить ${isTournament?'вариант':'вопрос'}</button>

      <div class="row center" style="margin-top:32px;margin-bottom:64px">
        <button class="btn primary" id="save-bottom" style="min-width:200px">Сохранить</button>
      </div>
    </div>`;
    renderQuestions();

    $('#cancel-editor').addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('Выйти из редактора? Несохранённый новый тест останется в черновике.')) {

    $('#e-desc').addEventListener('input',e=>{draft.description=e.target.value.slice(0,400);saveDraftState()});

    $('#pick-preview').addEventListener('click',()=>$('#e-preview').click());
    $('#e-preview').addEventListener('change', e => {
      const file = e.target.files[0];

        quality: 0.5, maxWidth: 400, maxHeight: 400,
        success(res) {
          const reader = new FileReader();
          reader.onload = ev => {
            const img = safeImg(ev.target.result);

            draft.previewImage = img;
            saveDraftState();
