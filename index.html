      ${inner}
    </div>`
  }

  function refreshQuestion(qi){const el=$(`[data-qi="${qi}"]`,$('#qlist'));if(el)el.outerHTML=questionCard(draft.questions[qi],qi)}

  function bindQuestions(){
    const list=$('#qlist');
    list.addEventListener('input',e=>{
      const qi=e.target.closest('[data-qi]')?.dataset.qi;if(qi==null)return;
      const q=draft.questions[qi],ai=e.target.closest('[data-ai]')?.dataset.ai;
      if(e.target.matches('[data-qtext]'))q.text=e.target.value.slice(0, 500);
      else if(e.target.matches('[data-atext]')&&ai!=null)q.answers[ai].text=e.target.value.slice(0, q.type==='assemble'?150:200);
      else if(e.target.matches('[data-aright]')&&ai!=null)q.answers[ai].right=e.target.value.slice(0, 200);
      else if(e.target.matches('[data-ctext]')){const ci=e.target.closest('[data-ci]').dataset.ci;q.categories[ci].text=e.target.value.slice(0,60)}
      else if(e.target.matches('[data-sc]')){
        const v=parseFloat(e.target.value);
        if(Number.isFinite(v))q.scale[e.target.dataset.sc]=v;
        const pv=e.target.closest('.q-card').querySelector('.sc-prev');if(pv)pv.textContent=scalePreviewText(q.scale)
      }
      saveDraftState();
    });
    list.addEventListener('change',e=>{
      const qi=e.target.closest('[data-qi]')?.dataset.qi;if(qi==null)return;
      const q=draft.questions[qi],ai=e.target.closest('[data-ai]')?.dataset.ai;
      if(e.target.matches('[data-qimage]')){
        const file=e.target.files[0];if(!file)return;
        toast('Загрузка...','warn');
        new Compressor(file,{quality:0.5,maxWidth:400,maxHeight:400,success(res){
          const reader=new FileReader();
          reader.onload=ev=>{
            const img=safeImg(ev.target.result);
            if(!img){toast('Этот формат картинки не поддерживается','warn');return}
            q.image=img;saveDraftState();refreshQuestion(qi);toast('Готово','good')
          };
          reader.readAsDataURL(res)
        },error(){toast('Не удалось обработать картинку','warn')}})
      }
      else if(e.target.matches('[data-qtype]')){
        const prev=q.type;
        q.type=e.target.value;
        const ensure=n=>{while(q.answers.length<n)q.answers.push(newAnswer())};
        if(['sort','scale','swipe'].includes(q.type)){
          initType(q);
        } else if(q.type==='text'){
          ensure(1);q.answers.forEach(a=>{a.correct=true;delete a.right});
        } else if(q.type==='match'){
          q.answers.forEach(a=>{a.correct=false;if(a.right==null)a.right=''});ensure(2);
          q.answers.forEach(a=>{if(a.right==null)a.right=''});
        } else if(q.type==='assemble'){
          q.answers.forEach(a=>{delete a.right;a.text=String(a.text||'').slice(0,150)});ensure(2);
          if(q.answers.filter(a=>a.correct).length<2)q.answers.forEach(a=>a.correct=true);
          // правильные блоки идут первыми, лишние — после них
          q.answers=q.answers.filter(a=>a.correct).concat(q.answers.filter(a=>!a.correct));
        } else {
          if(['text','match','assemble','sort','scale','swipe'].includes(prev)){q.answers.forEach(a=>{a.correct=false;delete a.right});ensure(2)}
          if(q.type==='single'){let seen=false;q.answers.forEach(a=>{if(a.correct){if(seen)a.correct=false;else seen=true}})}
        }
        saveDraftState();refreshQuestion(qi)
      }
      else if(e.target.matches('[data-icat]')&&ai!=null){q.answers[ai].cat=e.target.value;saveDraftState()}
      else if(e.target.matches('[data-ctext]')){
        // обновляем списки категорий у карточек без перерисовки (чтобы не терять фокус)
        e.target.closest('.q-card').querySelectorAll('[data-icat]').forEach(sel=>{
          const a=q.answers[+sel.closest('[data-ai]').dataset.ai];
          sel.innerHTML='<option value="">— категория —</option>'+q.categories.map(c=>`<option value="${esc(c.id)}" ${a.cat===c.id?'selected':''}>${esc(c.text||'(без названия)')}</option>`).join('')
        });
        saveDraftState()
      }
      else if(e.target.matches('[data-truth]')){q.truth=e.target.value==='1';saveDraftState()}
      else if(e.target.matches('[data-anext]')){q.answers[ai].nextId=e.target.value||null;saveDraftState()}
      else if(e.target.matches('[data-acat]')){
        const endId=e.target.value;
        q.answers[ai].points = endId ? {[endId]:1} : {};
        saveDraftState();
      }
    });
    list.addEventListener('click',e=>{
      const btn=e.target.closest('[data-act]');if(!btn)return;e.preventDefault();
      const card=btn.closest('[data-qi]');
      const qi=+card.dataset.qi,q=draft.questions[qi],ai=btn.closest('[data-ai]')?+btn.closest('[data-ai]').dataset.ai:null,ci=btn.closest('[data-ci]')?+btn.closest('[data-ci]').dataset.ci:null,act=btn.dataset.act;
      if(act==='pick-img'){card.querySelector('[data-qimage]').click()}
      else if(act==='del-q'){if(draft.questions.length<=1){alert('Хотя бы 1');return}if(!confirm('Удалить?'))return;draft.questions.splice(qi,1);saveDraftState();renderQuestions()}
      else if(act==='add-a'){
        const a=newAnswer();
        if(q.type==='text')a.correct=true;
        if(q.type==='match')a.right='';
        if(q.type==='sort')a.cat='';
        if(q.type==='assemble'){
          a.correct=true;
          let last=-1;q.answers.forEach((x,i)=>{if(x.correct)last=i});
          q.answers.splice(last+1,0,a);
        } else q.answers.push(a);
        saveDraftState();refreshQuestion(qi)
      }
      else if(act==='add-cat'){q.categories.push({id:uid(),text:''});saveDraftState();refreshQuestion(qi)}
      else if(act==='del-cat'){
        if(q.categories.length<=2){alert('Минимум 2 категории');return}
        const cid=q.categories[ci].id;q.categories.splice(ci,1);q.answers.forEach(a=>{if(a.cat===cid)a.cat=''});
        saveDraftState();refreshQuestion(qi)
      }
      else if(act==='add-decoy'){const a=newAnswer();a.correct=false;q.answers.push(a);saveDraftState();refreshQuestion(qi)}
      else if(act==='up'||act==='down'){
        const idxs=q.answers.map((x,i)=>x.correct?i:-1).filter(i=>i>=0);
        const k=idxs.indexOf(ai),o=idxs[k+(act==='up'?-1:1)];
        if(o!=null){const tmp=q.answers[ai];q.answers[ai]=q.answers[o];q.answers[o]=tmp;saveDraftState();refreshQuestion(qi)}
      }
      else if(act==='del-a'){
        if(q.type==='assemble'){
          if(q.answers[ai].correct&&q.answers.filter(a=>a.correct).length<=2){alert('В ответе должно остаться минимум 2 блока');return}
        } else {
          const min=q.type==='text'?1:2;if(q.answers.length<=min){alert('Минимум '+min);return}
        }
        q.answers.splice(ai,1);saveDraftState();refreshQuestion(qi)
      }
      else if(act==='correct'){if(q.type==='single')q.answers.forEach((a,i)=>{a.correct=(i===ai)});else q.answers[ai].correct=!q.answers[ai].correct;saveDraftState();refreshQuestion(qi)}
      else if(act==='del-img'){q.image=null;saveDraftState();refreshQuestion(qi)}
    });
  }

  async function saveDraft(){
    if(!draft.title.trim()){alert('Введите название');return}
    if(!draft.previewImage){toast('Прикрепите обложку теста','warn');window.scrollTo({top:0,behavior:'smooth'});return}
    if(draft.mode==='diagram'&&(!draft.endings||draft.endings.length<1)){alert('Добавьте хотя бы один результат');return}
    if(draft.mode==='tournament'&&draft.questions.length<2){alert('В турнире нужно минимум 2 варианта');return}
    const needsCorrect=['standard','time','survival'].includes(draft.mode);

    for(let i=0;i<draft.questions.length;i++){
      const q=draft.questions[i];
      if(!q.text.trim()){alert(`${draft.mode==='tournament'?'Вариант':'Вопрос'} ${i+1}: нет текста`);return}
      if(draft.mode!=='tournament' && q.type==='match') {
        if(q.answers.length<2){alert(`Вопрос ${i+1}: нужно минимум 2 пары`);return}
        if(q.answers.some(a=>!a.text.trim()||!String(a.right||'').trim())){alert(`Вопрос ${i+1}: заполните обе части каждой пары`);return}
        const rs=q.answers.map(a=>normText(a.right));
        if(new Set(rs).size!==rs.length){alert(`Вопрос ${i+1}: правые блоки не должны повторяться`);return}
        continue;
      }
      if(draft.mode!=='tournament' && q.type==='assemble') {
        const corr=q.answers.filter(a=>a.correct);
        if(corr.length<2){alert(`Вопрос ${i+1}: в ответе должно быть минимум 2 блока`);return}
        if(q.answers.some(a=>!a.text.trim())){alert(`Вопрос ${i+1}: есть пустые блоки`);return}
        if(q.answers.some(a=>a.text.length>150)){alert(`Вопрос ${i+1}: в блоке не больше 150 символов`);return}
        const ct=new Set(corr.map(a=>a.text.trim()));
        if(q.answers.some(a=>!a.correct&&ct.has(a.text.trim()))){alert(`Вопрос ${i+1}: лишний блок совпадает с блоком ответа`);return}
        continue;
      }
      if(draft.mode!=='tournament' && q.type==='sort') {
        const cats=q.categories||[];
        if(cats.length<2){alert(`Вопрос ${i+1}: нужно минимум 2 категории`);return}
        if(cats.some(c=>!String(c.text||'').trim())){alert(`Вопрос ${i+1}: у каждой категории должно быть название`);return}
        const cn=cats.map(c=>normText(c.text));
        if(new Set(cn).size!==cn.length){alert(`Вопрос ${i+1}: названия категорий не должны повторяться`);return}
        if(q.answers.length<2){alert(`Вопрос ${i+1}: нужно минимум 2 карточки`);return}
        if(q.answers.some(a=>!a.text.trim())){alert(`Вопрос ${i+1}: есть пустые карточки`);return}
        if(q.answers.some(a=>!cats.some(c=>c.id===a.cat))){alert(`Вопрос ${i+1}: привяжите каждую карточку к категории`);return}
        continue;
      }
      if(draft.mode!=='tournament' && q.type==='scale') {
        const sc=q.scale||{};
        const [mn,mx,cv,tl,st]=[sc.min,sc.max,sc.correct,sc.tolerance,sc.step].map(Number);
        if(![mn,mx,cv,tl,st].every(Number.isFinite)){alert(`Вопрос ${i+1}: заполните все поля шкалы`);return}
        if(mx<=mn){alert(`Вопрос ${i+1}: максимум должен быть больше минимума`);return}
        if(cv<mn||cv>mx){alert(`Вопрос ${i+1}: правильное значение должно быть внутри диапазона`);return}
        if(tl<0||tl>50){alert(`Вопрос ${i+1}: погрешность — от 0 до 50 %`);return}
        if(st<=0||(mx-mn)/st>10000){alert(`Вопрос ${i+1}: шаг должен быть больше 0 и не слишком мелким`);return}
        continue;
      }
      if(draft.mode!=='tournament' && q.type==='swipe') { if(typeof q.truth!=='boolean')q.truth=true; continue; }
      if(draft.mode!=='tournament') {
        const min=q.type==='text'?1:2;
        if(q.answers.length<min){alert(`Вопрос ${i+1}: мало ответов`);return}
        if(q.answers.some(a=>!a.text.trim())){alert(`Вопрос ${i+1}: пустые ответы`);return}
        if(needsCorrect && q.type!=='text' && !q.answers.some(a=>a.correct)){alert(`Вопрос ${i+1}: нет верного`);return}
      }
    }

    if(draft.id){
      const old=state.tests.find(t=>t.id===draft.id);
      if(old){draft.authorId=old.authorId||state.user.id;draft.createdAt=old.createdAt||draft.createdAt}
    }else{
      draft.id=uid();draft.authorId=state.user.id;draft.author=state.user.name;draft.createdAt=Date.now();
    }

    const success = await persistTest(draft);
    if(success) {
      try { localStorage.removeItem('pikuco2.draft'); } catch {}
      location.hash='#/test/'+encodeURIComponent(draft.id);
    }
  }

  /* =========================================================
     БЛОГ: посты, картинки в тексте, лайки, комментарии, теги
     ========================================================= */
  const POST_MIN_AGE = 86400000, POST_COOLDOWN = 1800000, POST_MIN_LEN = 100, POST_MAX_LEN = 10000, POST_MAX_IMG = 8;
  let posts = [], postVotes = {}, blogTags = new Set();
  const IMG_MARK_RE = () => /\[\[img:([A-Za-z0-9_-]{1,64})\]\]/g;

  function cleanPost(p, id) {
    if (!p || typeof p !== 'object' || !SAFE_ID.test(String(id))) return null;
    return { id: String(id), title: String(p.title || 'Без названия').slice(0, 120), body: String(p.body || '').slice(0, 12000),
      author: String(p.author || ''), authorId: String(p.authorId || ''), createdAt: Number(p.createdAt) || 0,
      tags: cleanTagList(p.tags), customTags: cleanCustomTags(p.customTags) };
  }
  const postPlain = body => String(body || '').replace(IMG_MARK_RE(), ' ').replace(/\s+/g, ' ').trim();
  function parseBody(body) {
    const out = []; let last = 0, m; const re = IMG_MARK_RE(); body = String(body || '');
    const text = v => v.replace(/^\n/, '').replace(/\n$/, '');
    while ((m = re.exec(body)) !== null) {
      if (m.index > last) out.push({ t: 'text', v: text(body.slice(last, m.index)) });
      out.push({ t: 'img', id: m[1] }); last = re.lastIndex;
    }
    if (last < body.length) out.push({ t: 'text', v: text(body.slice(last)) });
    return out;
  }
  const fmtDate = ts => ts ? new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  function fmtLeft(ms) {
    const m = Math.ceil(ms / 60000);
    if (m >= 60) return `${Math.floor(m / 60)} ч ${m % 60} мин`;
    return `${m} мин`;
  }
  function postEligibility() {
    const u = state.user;
    if (!u || u.isGuest) return { ok: false, msg: 'Публиковать посты могут только зарегистрированные пользователи, чей аккаунт старше 1 дня.' };
    const reg = Number(u.registeredAt) || 0;
    if (!reg) return { ok: false, msg: 'Не удалось определить возраст аккаунта. Обновите страницу.' };
    const left = reg + POST_MIN_AGE - Date.now();
    if (left > 0) return { ok: false, msg: `Публиковать посты можно, когда аккаунту исполнится 1 день. Осталось: ${fmtLeft(left)}.` };
    return { ok: true };
  }
  const postVotesOf = id => {
    let likes = 0, dislikes = 0;
    Object.values(postVotes[id] || {}).forEach(v => { if (v === 'like') likes++; else if (v === 'dislike') dislikes++; });
    return { likes, dislikes, mine: (postVotes[id] || {})[state.user.id] || null };
  };
  async function loadPosts() {
    let data = null;
    try {
      let r = await fbFetch('/posts.json?orderBy=%22createdAt%22&limitToLast=100');
      if (!r.ok) r = await fbFetch('/posts.json');
      if (r.ok) data = await r.json();
    } catch {}
    posts = Object.entries(data || {}).map(([id, p]) => cleanPost(p, id)).filter(Boolean).sort((a, b) => b.createdAt - a.createdAt);
    try { const r = await fbFetch('/postVotes.json'); if (r.ok) postVotes = (await r.json()) || {}; } catch {}
  }
  const cmOwner = id => getTest(id) || posts.find(p => p.id === id);

  function blogTagPanelHtml() {
    return TAGS.map(([id, l]) => `<button type="button" class="tag-chip ${blogTags.has(id) ? 'on' : ''}" data-btag="${id}">${l}</button>`).join('')
      + (blogTags.size ? '<button type="button" class="tag-chip reset" data-btag="">✕ Сбросить</button>' : '');
  }
  function postCardHtml(p) {
    const { likes, dislikes } = postVotesOf(p.id);
    const ex = postPlain(p.body);
    return `<a class="card post-card" href="#/post/${esc(p.id)}">
      <h3>${esc(p.title)}</h3>
      <p class="muted post-ex">${esc(ex.slice(0, 220))}${ex.length > 220 ? '…' : ''}</p>
      ${(p.tags.length || p.customTags.length) ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${p.tags.map(id => `<span class="badge tag">${esc(tagLabel(id))}</span>`).join('')}${p.customTags.map(c => `<span class="badge tag custom">#${esc(c)}</span>`).join('')}</div>` : ''}
      <div class="row between small muted" style="margin-top:10px"><span>${esc(p.author)} · ${esc(fmtDate(p.createdAt))}</span><span>👍${likes} 👎${dislikes}</span></div>
    </a>`;
  }
  function blogListHtml(q) {
    q = normText(q || '');
    const f = posts.filter(p => (!blogTags.size || p.tags.some(x => blogTags.has(x)))
      && (!q || normText(p.title).includes(q) || normText(postPlain(p.body)).includes(q) || p.customTags.some(c => normText(c).includes(q))));
    return f.map(postCardHtml).join('') || `<p class="muted">${posts.length ? 'Ничего не найдено.' : 'Пока нет постов. Станьте первым!'}</p>`;
  }
  function viewBlog() {
    const el = postEligibility();
    return `<div class="wrap">
      <div class="row between" style="margin-top:24px;flex-wrap:wrap;gap:10px"><h1 style="margin:0">📝 Блог</h1>
        ${el.ok ? '<a class="btn primary" href="#/postnew">+ Написать пост</a>' : '<button class="btn ghost" id="post-locked" type="button">+ Написать пост</button>'}</div>
      <div class="row between" style="margin-top:16px;flex-wrap:wrap;gap:10px"><span></span>
        <div class="search-row"><input id="b-search" class="input" placeholder="Поиск по блогу…"><button class="btn ghost" id="b-tags-toggle" type="button">${blogTags.size ? `Темы (${blogTags.size})` : 'Показать темы'}</button></div></div>
      <div class="tag-row" id="b-tag-panel" ${blogTags.size ? '' : 'hidden'}>${blogTagPanelHtml()}</div>
      <div class="post-list" id="blog-list"><p class="muted">Загрузка…</p></div>
    </div>`;
  }
  async function bindBlog() {
    const lk = $('#post-locked'); if (lk) lk.addEventListener('click', () => toast(postEligibility().msg, 'warn'));
    await loadPosts();
    const list = $('#blog-list'); if (!list) return;

    };
    refresh();
    s.addEventListener('input', refresh);
    $('#b-tags-toggle').addEventListener('click', () => { const pn = $('#b-tag-panel'); pn.hidden = !pn.hidden; refresh(); });
    $('#b-tag-panel').addEventListener('click', e => {
      const b = e.target.closest('[data-btag]'); if (!b) return;
      const id = b.dataset.btag;
      if (!id) blogTags.clear(); else if (blogTags.has(id)) blogTags.delete(id); else blogTags.add(id);
      refresh();

  }

  /* ---------- страница поста ---------- */
  function viewPost() { return `<div class="wrap narrow" id="post-root"><p class="muted">Загрузка…</p></div>`; }
  async function bindPost(id) {
    const root = $('#post-root'); if (!root) return;
    let post = null, imgs = {}, votes = {};
    try {
      const [rp, ri, rv] = await Promise.all([fbFetch(`/posts/${encodeURIComponent(id)}.json`), fbFetch(`/postImages/${encodeURIComponent(id)}.json`), fbFetch(`/postVotes/${encodeURIComponent(id)}.json`)]);
      if (rp.ok) post = cleanPost(await rp.json(), id);
      if (ri.ok) imgs = (await ri.json()) || {};
      if (rv.ok) votes = (await rv.json()) || {};
    } catch {}
    if (!post) { root.innerHTML = '<h1>Пост не найден</h1><a class="btn" href="#/blog">В блог</a>'; return; }
    postVotes[id] = votes;
    if (!posts.some(p => p.id === id)) posts.unshift(post);
    const own = post.authorId === state.user.id;
    const guest = !!state.user.isGuest;
    const body = parseBody(post.body).map(b => {
      if (b.t === 'text') return b.v.trim() ? `<p class="post-p">${esc(b.v)}</p>` : '';
      const src = safeImg(imgs[b.id]);
      return src ? `<img class="post-img" src="${esc(src)}" alt="" draggable="false">` : '';
    }).join('');
    const authorHtml = (!guest && post.authorId && SAFE_ID.test(post.authorId) && post.authorId !== state.user.id)
      ? `<a href="#/user/${encodeURIComponent(post.authorId)}" class="c-author">${esc(post.author)}</a>` : `<b>${esc(post.author)}</b>`;
    const voteHtml = () => { const v = postVotesOf(id); const dis = (guest || own) ? 'disabled' : '';
      const hint = guest ? 'Оценивать могут зарегистрированные пользователи' : own ? 'Свой пост оценивать нельзя' : '';
      return `<button class="btn ghost ${v.mine === 'like' ? 'active-vote' : ''}" data-pvote="like" ${dis} title="${hint}">👍 ${v.likes}</button>
        <button class="btn ghost ${v.mine === 'dislike' ? 'active-vote' : ''}" data-pvote="dislike" ${dis} title="${hint}">👎 ${v.dislikes}</button>`; };
    root.innerHTML = `<a href="#/blog" class="muted small">← В блог</a>
      <article class="card big post" style="margin-top:12px">
        <h1 style="margin-top:0">${esc(post.title)}</h1>
        <p class="muted small">${authorHtml} · ${esc(fmtDate(post.createdAt))}</p>
        ${(post.tags.length || post.customTags.length) ? `<div class="row" style="gap:6px;flex-wrap:wrap">${post.tags.map(t => `<span class="badge tag">${esc(tagLabel(t))}</span>`).join('')}${post.customTags.map(c => `<span class="badge tag custom">#${esc(c)}</span>`).join('')}</div>` : ''}
        <div class="post-body">${body}</div>
        <div class="row" style="margin-top:20px;gap:10px;flex-wrap:wrap"><span id="pvotes" class="row" style="gap:8px">${voteHtml()}</span>
          ${own ? `<a class="btn ghost" href="#/postedit/${esc(id)}">Редактировать</a><button class="btn danger" id="post-del">Удалить</button>` : ''}</div>
      </article>
      <div class="sidebar-comments post-comments" id="comments-box" style="margin-top:16px"><h3>Загрузка...</h3></div>`;
    $('#pvotes').addEventListener('click', async e => {
      const b = e.target.closest('[data-pvote]'); if (!b || b.disabled) return;
      const kind = b.dataset.pvote, mine = postVotesOf(id).mine, uidv = state.user.id;
      try {
        let res;
        if (mine === kind) res = await fbFetch(`/postVotes/${encodeURIComponent(id)}/${uidv}.json`, { method: 'DELETE' });
        else res = await fbFetch(`/postVotes/${encodeURIComponent(id)}/${uidv}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(kind) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        postVotes[id] = postVotes[id] || {};
        if (mine === kind) delete postVotes[id][uidv]; else postVotes[id][uidv] = kind;
        $('#pvotes').innerHTML = voteHtml();
      } catch { toast('Не удалось сохранить оценку', 'warn'); }
    });
    const d = $('#post-del');
    if (d) d.addEventListener('click', async () => {
      if (!confirm('Удалить пост навсегда?')) return;
      try {
        const res = await fbFetch('/.json', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          ['postImages/' + id]: null, ['postVotes/' + id]: null, ['comments/' + id]: null, ['posts/' + id]: null }) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        posts = posts.filter(p => p.id !== id);
        toast('Пост удалён', 'good'); location.hash = '#/blog';
      } catch { toast('Не удалось удалить пост', 'warn'); }
    });
    mountComments(id);
  }

  /* ---------- редактор поста ---------- */
  let pdraft = null;
  function tagEditorHtml() {
    return `<label class="label">Темы (необязательно, до 2)</label><div class="tag-row" id="p-presets"></div>
      <label class="label">Свои теги (необязательно, до 3, до 50 символов) — по ним пост находится через поиск</label>
      <div class="row"><input class="input" id="p-ctag" maxlength="50" placeholder="Например: наполеон" style="flex:1"><button class="btn ghost sm" id="p-ctag-add" type="button">Добавить</button></div>
      <div class="tag-row" id="p-ctags"></div>`;
  }
  async function startPostEditor(id) {
    const app = $('#app');
    if (!id) {
      const el = postEligibility();
      if (!el.ok) { toast(el.msg, 'warn'); location.hash = '#/blog'; return; }
      pdraft = { id: uid(), title: '', blocks: [{ t: 'text', v: '' }], tags: [], customTags: [], isNew: true, oldImgs: [] };
    } else {
      app.innerHTML = '<div class="wrap narrow"><p class="muted">Загрузка…</p></div>';
      let post = null, imgs = {};
      try {
        const [rp, ri] = await Promise.all([fbFetch(`/posts/${encodeURIComponent(id)}.json`), fbFetch(`/postImages/${encodeURIComponent(id)}.json`)]);
        if (rp.ok) post = cleanPost(await rp.json(), id);
        if (ri.ok) imgs = (await ri.json()) || {};
      } catch {}
      if (!post || post.authorId !== state.user.id) { toast('Редактировать можно только свои посты', 'warn'); location.hash = '#/blog'; return; }
      const blocks = parseBody(post.body).map(b => b.t === 'img' ? { t: 'img', id: b.id, src: safeImg(imgs[b.id]) } : b).filter(b => b.t === 'text' || b.src);
      if (!blocks.length || blocks[blocks.length - 1].t === 'img') blocks.push({ t: 'text', v: '' });
      pdraft = { id, title: post.title, blocks, tags: post.tags.slice(), customTags: post.customTags.slice(), isNew: false, createdAt: post.createdAt, oldImgs: Object.keys(imgs) };
    }
    app.innerHTML = `<div class="wrap narrow">
      <a href="#/blog" class="muted small">← Отмена</a>
      <div class="row between" style="margin-top:8px"><h1 style="margin:0">${pdraft.isNew ? 'Новый пост' : 'Редактирование поста'}</h1><button class="btn primary" id="p-save">${pdraft.isNew ? 'Опубликовать' : 'Сохранить'}</button></div>
      <label class="label">Заголовок (до 120 символов)</label>
      <input class="input" id="p-title" maxlength="120" value="${esc(pdraft.title)}">
      <label class="label">Текст поста (минимум ${POST_MIN_LEN} символов). Картинку можно вставить после любого абзаца.</label>
      <div id="p-blocks"></div>
      <input type="file" accept="image/*" id="p-file" style="display:none">
      <p class="muted small" id="p-count"></p>
      ${tagEditorHtml()}
      <div class="row center" style="margin:32px 0 64px"><button class="btn primary" id="p-save2" style="min-width:200px">${pdraft.isNew ? 'Опубликовать' : 'Сохранить'}</button></div>
    </div>`;
    bindPostEditor();
  }
  function bindPostEditor() {
    const d = pdraft;
    const countText = () => d.blocks.reduce((n, b) => n + (b.t === 'text' ? b.v.trim().length : 0), 0);
    const imgCount = () => d.blocks.filter(b => b.t === 'img').length;
    const drawCount = () => {
      const n = countText();
      $('#p-count').innerHTML = `Символов: <b style="color:${n >= POST_MIN_LEN ? 'var(--good)' : 'var(--bad)'}">${n}</b> из ${POST_MIN_LEN} (макс. ${POST_MAX_LEN}) · картинок: ${imgCount()} из ${POST_MAX_IMG}`;
    };
    const drawBlocks = () => {
      $('#p-blocks').innerHTML = d.blocks.map((b, i) => b.t === 'text'
        ? `<div class="pb" data-bi="${i}"><textarea class="input" data-ptext rows="6" maxlength="${POST_MAX_LEN}" placeholder="Пишите здесь…">${esc(b.v)}</textarea>
            <div class="pb-tools"><button class="btn ghost sm" type="button" data-pact="img">🖼 Вставить картинку ниже</button>${d.blocks.length > 1 ? '<button class="btn danger sm" type="button" data-pact="delb">Удалить блок</button>' : ''}</div></div>`
        : `<div class="pb pb-img" data-bi="${i}"><img src="${esc(b.src)}" alt="" draggable="false"><div class="pb-tools"><button class="btn danger sm" type="button" data-pact="delimg">✕ Убрать картинку</button></div></div>`).join('');
      drawCount();
    };
    drawBlocks();
    let pendingIdx = -1;
    $('#p-title').addEventListener('input', e => { d.title = e.target.value.slice(0, 120); });
    $('#p-blocks').addEventListener('input', e => {
      if (!e.target.matches('[data-ptext]')) return;
      d.blocks[+e.target.closest('[data-bi]').dataset.bi].v = e.target.value; drawCount();
    });
    $('#p-blocks').addEventListener('click', e => {
      const btn = e.target.closest('[data-pact]'); if (!btn) return;
      const bi = +btn.closest('[data-bi]').dataset.bi, act = btn.dataset.pact;
      if (act === 'img') {
        if (imgCount() >= POST_MAX_IMG) { toast(`Не больше ${POST_MAX_IMG} картинок в посте`, 'warn'); return; }
        pendingIdx = bi; $('#p-file').value = ''; $('#p-file').click();
      } else if (act === 'delimg') { d.blocks.splice(bi, 1); drawBlocks(); }
      else if (act === 'delb') { d.blocks.splice(bi, 1); drawBlocks(); }
    });
    $('#p-file').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file || pendingIdx < 0) return;
      const at = pendingIdx; pendingIdx = -1;
      toast('Сжимаем картинку...', 'warn');
      new Compressor(file, { quality: 0.6, maxWidth: 900, maxHeight: 900, success(res) {
        const fr = new FileReader();
        fr.onload = ev => {
          const src = safeImg(ev.target.result);
          if (!src) { toast('Этот формат картинки не поддерживается', 'warn'); return; }
          if (src.length > 550000) { toast('Картинка слишком тяжёлая даже после сжатия', 'warn'); return; }
          const ins = [{ t: 'img', id: uid(), src }];
          if (!d.blocks[at + 1] || d.blocks[at + 1].t !== 'text') ins.push({ t: 'text', v: '' });
          d.blocks.splice(at + 1, 0, ...ins); drawBlocks();
          toast('Картинка добавлена ✓', 'good');
        };
        fr.readAsDataURL(res);
      }, error() { toast('Не удалось обработать картинку', 'warn'); } });
    });
    // теги
    const drawTags = () => {
      $('#p-presets').innerHTML = TAGS.map(([id, l]) => `<button type="button" class="tag-chip ${d.tags.includes(id) ? 'on' : ''}" data-ptag="${id}">${l}</button>`).join('');
      $('#p-ctags').innerHTML = d.customTags.map((c, i) => `<span class="tag-chip custom on">#${esc(c)} <button type="button" class="tag-x" data-ctag-del="${i}" aria-label="Убрать">✕</button></span>`).join('');
    };
    drawTags();
    $('#p-presets').addEventListener('click', e => {
      const b = e.target.closest('[data-ptag]'); if (!b) return;
      const id = b.dataset.ptag, i = d.tags.indexOf(id);
      if (i >= 0) d.tags.splice(i, 1); else if (d.tags.length >= 2) { toast('Можно выбрать не больше 2 тем', 'warn'); return; } else d.tags.push(id);
      drawTags();
    });
    const addCustom = () => {
      const inp = $('#p-ctag'), v = inp.value.replace(/\s+/g, ' ').trim().slice(0, 50);
      if (!v) return;
      if (d.customTags.some(c => c.toLowerCase() === v.toLowerCase())) { inp.value = ''; return; }
      if (d.customTags.length >= 3) { toast('Можно добавить не больше 3 своих тегов', 'warn'); return; }
      d.customTags.push(v); inp.value = ''; drawTags(); inp.focus();
    };
    $('#p-ctag-add').addEventListener('click', addCustom);
    $('#p-ctag').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } });
    $('#p-ctags').addEventListener('click', e => { const b = e.target.closest('[data-ctag-del]'); if (!b) return; d.customTags.splice(+b.dataset.ctagDel, 1); drawTags(); });

    let saving = false;
    const save = async () => {
      if (saving) return;
      const title = cleanText(d.title).slice(0, 120);
      if (!title) { toast('Введите заголовок', 'warn'); return; }
      const n = countText();
      if (n < POST_MIN_LEN) { toast(`В посте должно быть минимум ${POST_MIN_LEN} символов (сейчас ${n})`, 'warn'); return; }
      if (n > POST_MAX_LEN) { toast(`Пост слишком длинный (максимум ${POST_MAX_LEN})`, 'warn'); return; }
      const stamp = { '.sv': 'timestamp' };
      saving = true; $('#p-save').disabled = $('#p-save2').disabled = true;
      try {
        if (d.isNew) {
          const el = postEligibility(); if (!el.ok) { toast(el.msg, 'warn'); return; }
          let last = 0;
          try { const r = await fbFetch(`/rateLimit/${state.user.id}/post.json`); if (r.ok) last = Number(await r.json()) || 0; } catch {}
          const left = last + POST_COOLDOWN + 1000 - Date.now();
          if (last && left > 0) { toast(`Следующий пост можно опубликовать через ${fmtLeft(left)}`, 'warn'); return; }
        }
        const kept = d.blocks.filter(b => b.t === 'img' || b.v.trim());
        const body = kept.map(b => b.t === 'img' ? `[[img:${b.id}]]` : cleanText(b.v, true)).join('\n');
        const post = { id: d.id, title, body, authorId: state.user.id, author: String(state.user.name).slice(0, 40), createdAt: d.isNew ? stamp : d.createdAt };
        const tg = cleanTagList(d.tags), ct = cleanCustomTags(d.customTags);
        if (tg.length) post.tags = tg; if (ct.length) post.customTags = ct;
        const upd = { ['posts/' + d.id]: post };
        const used = new Set();
        kept.forEach(b => { if (b.t === 'img') { used.add(b.id); upd[`postImages/${d.id}/${b.id}`] = b.src; } });
        (d.oldImgs || []).forEach(k => { if (!used.has(k)) upd[`postImages/${d.id}/${k}`] = null; });
        if (d.isNew) upd[`rateLimit/${state.user.id}/post`] = stamp;
        const payload = JSON.stringify(upd);
        if (payload.length > 7000000) { toast('Пост слишком тяжёлый — уберите несколько картинок', 'warn'); return; }
        const res = await fbFetch('/.json', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: payload });
        if (!res.ok) {
          if (res.status === 401 || res.status === 403) throw new Error(d.isNew ? 'сервер отклонил публикацию (аккаунт младше 1 дня или с прошлого поста не прошло 30 минут)' : 'сервер отклонил изменение поста');
          throw new Error('HTTP ' + res.status);
        }
        toast(d.isNew ? 'Пост опубликован ✓' : 'Пост сохранён ✓', 'good');
        pdraft = null; location.hash = '#/post/' + encodeURIComponent(d.id);
      } catch (e) {
        console.error(e); toast('Не получилось: ' + (e && e.message ? e.message : e), 'warn');
      } finally { saving = false; const a = $('#p-save'), b = $('#p-save2'); if (a) a.disabled = false; if (b) b.disabled = false; }
    };
    $('#p-save').addEventListener('click', save);
    $('#p-save2').addEventListener('click', save);
  }

  /* =========================================================
     INIT
     ========================================================= */
  async function init(){
    applyTheme();

    firebase.auth().onAuthStateChanged(async (user) => {
      await authLock;
      if (user) {
        if (user.isAnonymous) {
          // гостевой профиль создаём один раз и дальше переиспользуем (раньше имя менялось при каждой загрузке)
          let profile = null;
          try { const r = await fbFetch(`/users/${user.uid}.json`); if (r.ok) profile = await r.json(); } catch {}
          if (!profile || !profile.name) {
            profile = { name: 'Гость #' + Math.floor(1000 + Math.random() * 9000), avatar: EMOJIS[Math.floor(Math.random() * EMOJIS.length)] };
            await fbFetch(`/users/${user.uid}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profile) }).catch(()=>{});
          }
          state.user = { id: user.uid, name: String(profile.name), avatar: profile.avatar || EMOJIS[0], isGuest: true };
        } else {
          let profile = null;
          try { const r = await fbFetch(`/users/${user.uid}.json`); if (r.ok) profile = await r.json(); } catch {}
          // возраст аккаунта считается по registeredAt; у старых аккаунтов он проставляется при первом входе
          let registeredAt = Number(profile && profile.registeredAt) || 0;
          if (!registeredAt && profile) {
            try {
              const r = await fbFetch(`/users/${user.uid}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ registeredAt: { '.sv': 'timestamp' } }) });
              if (r.ok) { const j = await r.json(); registeredAt = Number(j && j.registeredAt) || Date.now(); }
            } catch {}
          }
          state.user = {
            id: user.uid,
            login: (user.email||'').split('@')[0],
            isGuest: false,
            name: profile?.name || (user.email||'').split('@')[0],
            avatar: profile?.avatar || EMOJIS[0],
            registeredAt
          };
        }
      } else {
        firebase.auth().signInAnonymously().catch(e => console.error(e));
        return;
      }

      await dbLoad();

      // стартовые тесты больше не создаются автоматически: запись теперь только для зарегистрированных

      const loader = document.getElementById('loading');
      if(loader) loader.style.display = 'none';

      setupPresence();

      if(!$('#theme-toggle')._bound) {
        $('#theme-toggle').addEventListener('click',toggleTheme);
        $('#theme-toggle')._bound = true;
      }

      window.removeEventListener('hashchange', render);
      window.addEventListener('hashchange', render);

      render();
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
