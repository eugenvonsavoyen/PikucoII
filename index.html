<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Пикуко 2</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"></script>

<style>
*{box-sizing:border-box}
:root{--bg:#0d0a16;--panel:#171225;--panel2:#1f1833;--border:#2c2444;--text:#ece9f5;--muted:#9b93b8;--accent:#a855f7;--accent2:#ec4899;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme="light"]{--bg:#f6f4fb;--panel:#fff;--panel2:#f0ecfa;--border:#e3ddf0;--text:#1a1625;--muted:#6b6584;--shadow:0 10px 30px rgba(80,50,150,.12)}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(168,85,247,.18),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(236,72,153,.12),transparent 60%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.wrap.narrow{max-width:760px}
.wrap.wide{max-width:1100px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.site-header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.site-header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;gap:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:.15s}
.nav-link:hover{background:var(--panel);color:var(--text)}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 6px 20px -6px var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.big{padding:12px 24px;font-size:16px}
.btn.active-vote{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.22)}
textarea.input{resize:vertical;min-height:44px}
.label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.big{padding:32px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:16px 0}
.test-card{display:flex;flex-direction:column;gap:8px;transition:.18s;cursor:pointer;padding:0;overflow:hidden}
.test-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.test-img{width:100%;height:140px;object-fit:cover;border-bottom:1px solid var(--border)}
.test-card-content{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.test-card h3{margin:0;font-size:18px}
.test-card p{margin:0;font-size:14px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-go{margin-top:8px;color:var(--accent);font-weight:600;font-size:14px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.badge.good{color:var(--good);border-color:rgba(34,197,94,.4)}
.badge.wrong{color:var(--bad);border-color:rgba(239,68,68,.4)}
.badge.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}
.badge.quality{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.badge.new{color:var(--accent);border-color:rgba(168,85,247,.5)}
.hero{padding:56px 20px 8px;text-align:center;max-width:820px;margin:0 auto}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-actions{display:flex;gap:12px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.stats{display:flex;gap:32px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-size:24px;font-weight:800}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.play-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 20px;border:1px solid var(--border)}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.answers{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.answer{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;transition:.15s}
.answer:hover{border-color:var(--accent)}
.answer.selected{border-color:var(--accent);background:rgba(168,85,247,.18);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.score-circle{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0)}
.score-circle::before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.score-circle span{position:relative;font-size:34px;font-weight:800}
.review{margin-top:12px;padding:16px}
.review.ok{border-left:4px solid var(--good)}
.review.bad{border-left:4px solid var(--bad)}
.review p{margin:6px 0}
.qlist{display:flex;flex-direction:column;gap:16px;margin:16px 0}
.q-card{padding:18px}
.q-card textarea{margin-top:10px}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mark{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:800;font-size:14px;transition:.15s}
.mark.on{background:var(--good);border-color:var(--good);color:#fff}
.arow .input{flex:1;min-width:150px}
.avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:28px;background:var(--panel2);border:1px solid var(--border);flex:none}
.attempt{padding:8px 0;border-bottom:1px solid var(--border)}
.attempt:last-child{border:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--border);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.28s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:10000;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.good{border-color:var(--good);color:var(--good)}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.confetti{position:fixed;top:-16px;width:8px;height:14px;z-index:9999;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.q-img{max-width:100%;max-height:300px;border-radius:12px;margin:12px 0;display:block;border:1px solid var(--border)}
.comment{background:var(--panel2);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border);position:relative}
.comment b{color:var(--accent)}
.comment-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px;opacity:0.5;transition:.15s}
.comment-del:hover{opacity:1}
.comment-edit{position:absolute;top:8px;right:30px;background:none;border:none;color:var(--accent);cursor:pointer;font-size:15px;opacity:.6;transition:.15s}
.comment-edit:hover{opacity:1}
#online-widget{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--panel);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;transition:.3s}
#online-widget:hover{border-color:var(--accent);color:var(--text)}
.online-dot{width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 8px var(--good)}
.result-layout{display:grid;grid-template-columns:1fr;gap:24px;margin-top:24px}
@media(min-width:900px){.result-layout{grid-template-columns:1fr 340px;align-items:start}.sidebar-sticky{position:sticky;top:84px}}
.sidebar-comments{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow-y:auto}
.sidebar-comments h3{margin-top:0;font-size:18px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.auth-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.auth-tab{padding:10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.auth-tab.active{border-color:var(--accent);color:var(--text)}
.ending-card{background:var(--panel2);padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid var(--border);position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.emoji-btn { font-size: 24px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; transition: .15s; display: grid; place-items: center; }
.emoji-btn:hover { border-color: var(--accent); transform: scale(1.1); }
.tournament-container { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
@media(min-width: 768px) { .tournament-container { grid-template-columns: 1fr 1fr; } }
.tournament-item { background: var(--panel2); border: 2px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: .2s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tournament-item:hover { border-color: var(--accent); transform: scale(1.02); }
.tournament-item img { max-width: 100%; max-height: 200px; border-radius: 12px; object-fit: cover; }
.tournament-item h3 { margin: 0; font-size: 20px; }

/* --- Apps gallery --- */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:24px}
.app-card{display:flex;flex-direction:column;padding:24px;border-radius:20px;color:#fff;text-decoration:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;min-height:200px}
.app-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -12px rgba(0,0,0,.6)}
.app-card::after{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
.app-card-emoji{font-size:52px;margin-bottom:12px;line-height:1;position:relative;z-index:1}
.app-card h3{margin:0 0 8px;font-size:22px;color:#fff;position:relative;z-index:1}
.app-card p{margin:0 0 16px;opacity:.92;font-size:14px;color:#fff;line-height:1.4;position:relative;z-index:1}
.app-card-go{margin-top:auto;font-weight:600;font-size:14px;position:relative;z-index:1}
.app-card-badge{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:11px;font-weight:600;align-self:flex-start;margin-bottom:12px;position:relative;z-index:1}
.app-viewer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#141418}
.app-viewer iframe{width:100%;height:100%;border:0;display:block}

@media(max-width:640px){
  .site-header .wrap{padding:0 10px;gap:6px}
  .logo{font-size:17px;white-space:nowrap}
  nav{gap:0;flex-wrap:nowrap}
  .nav-link{padding:8px 6px;font-size:13px}
  .icon-btn{width:34px;height:34px}
}
/* --- Comments: votes, threads, mentions --- */
.c-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.c-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.c-btn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.c-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(168,85,247,.12)}
.c-btn:disabled{opacity:.55;cursor:default}
.thread{margin:8px 0 12px 10px;padding-left:12px;border-left:2px solid var(--border)}
.comment.reply{background:var(--panel);margin-bottom:6px}
.comment.mentioned{border-color:var(--accent2)}
.mention{color:var(--accent2);font-weight:600}
.mention.me{background:rgba(236,72,153,.18);border-radius:5px;padding:0 3px}
.mention-box{position:relative}
.mention-list{position:absolute;left:0;right:0;bottom:100%;margin-bottom:4px;z-index:20;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:170px;overflow:auto}
.mention-list button{display:block;width:100%;text-align:left;padding:7px 10px;background:none;border:none;color:var(--text);cursor:pointer;font-family:inherit;font-size:13px}
.mention-list button:hover{background:var(--panel2)}

/* --- Question type: matching --- */
.match{position:relative;margin-top:14px;user-select:none;-webkit-user-select:none}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;position:relative;z-index:1}
@media(max-width:560px){.match-cols{gap:38px}}
.match-col{display:flex;flex-direction:column;gap:10px}
.match-item{padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--panel2);cursor:pointer;touch-action:none;font-size:14px;word-break:break-word;transition:border-color .15s,background .15s}
.match-item:hover,.match-item.hv{border-color:var(--accent)}
.match-item.sel{border-color:var(--accent);background:rgba(168,85,247,.2)}
.match-item.linked{border-color:var(--good)}
.match-svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.match-svg .ml{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.match-svg .tmp{stroke:var(--accent2);stroke-dasharray:6 5}
.match-svg .hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
.match.dragging .hit{pointer-events:none}

/* --- Question type: assemble from blocks --- */
.asm-line{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding:10px;border:2px dashed var(--border);border-radius:12px;background:var(--panel2);margin-top:14px}
.asm-ph{color:var(--muted);font-size:13px;align-self:center}
.asm-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.asm-blk{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;max-width:100%;text-align:left;word-break:break-word;transition:.15s}
.asm-blk:hover{border-color:var(--accent)}
.asm-blk.placed{border-color:var(--accent);background:rgba(168,85,247,.16)}
.asm-blk.used{opacity:.25;pointer-events:none}
.badge.num{min-width:26px;text-align:center}

/* --- Leaders --- */
.lb-row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--panel);margin-bottom:8px}
.lb-row.me{border-color:var(--accent);box-shadow:0 0 0 2px rgba(168,85,247,.2)}
.lb-rank{font-weight:800;font-size:18px;text-align:center}
.lb-xp{font-weight:800;color:var(--accent);white-space:nowrap}
.lb-name{display:flex;align-items:center;gap:8px;font-weight:600;word-break:break-word}
.ach-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ach{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);font-size:12px;font-weight:600}
.ach.done{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.12)}
.ach.locked{opacity:.45;filter:grayscale(1)}

/* --- Comments v2 --- */
.comment{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative;transition:border-color .15s}
.comment.reply{background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.comment.mentioned{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(236,72,153,.12)}
.c-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.c-ava{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;background:linear-gradient(135deg,rgba(168,85,247,.28),rgba(236,72,153,.28));border:1px solid var(--border)}
.comment.reply .c-ava{width:28px;height:28px;font-size:15px}
.c-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.c-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-author{font-weight:700;font-size:14px;color:var(--text)}
a.c-author:hover{color:var(--accent)}
.c-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:999px;background:rgba(168,85,247,.16);color:var(--accent)}
.c-date{font-size:11px;color:var(--muted)}
.c-tools{display:flex;gap:4px}
.c-tool{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;transition:.15s}
.c-tool:hover{background:var(--panel);border-color:var(--border);color:var(--accent)}
.c-tool.del:hover{color:var(--bad)}
.c-body{margin:0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.c-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.comment-editbox textarea{margin-top:2px}

/* --- Achievements, XP, leaders v2 --- */
.xp-card{margin:16px 0}
.xp-big{font-size:34px;font-weight:800;line-height:1.1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.xp-big span{font-size:16px;font-weight:700}
.xp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.xp-stats div{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center}
.xp-stats b{display:block;font-size:18px}
.xp-stats span{font-size:11px;color:var(--muted)}
.lb-place{text-align:right;font-size:12px;color:var(--muted)}
.lb-place b{display:block;font-size:26px;color:var(--text)}
.ach-group{margin-top:16px}
.ach-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}

.ach-bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border)}

.ach-card.done .ach-bar span{background:linear-gradient(90deg,#fbbf24,#f59e0b)}

.lb-row{grid-template-columns:44px 1fr auto}

<script>
(() => {

    try {
      const user = firebase.auth().currentUser;

        const token = await user.getIdToken();

  const CENSOR_RE = /(^|[^а-яёa-z0-9])(ху[йяе]|пизд|бля|[её]ба|[её]бал|[её]буч|сука|мразь|гандон|долбо[её]б|мудак|пидор|шлюх)[а-яё]*/gi;
  function cleanText(t) {

  const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;

  const safeImg = s => (typeof s === 'string' && SAFE_IMG.test(s)) ? s : null;

  const EMOJIS = ['🦊','🐱','🐶','🐼','🐸','🐵','🐯','🦁','🐮','🐷','🐙','🦄','🦖','🐺','🦉','🦇','🐲','🐢','🐍','🦎','🐊','🐳','🐬','🦈','🐟','🦅','🦆','🦢','🐔','🐧','🦌','🦍','🐘','🐪','🦒','🦘','🐄','🐖','🐏','🐑','🐐','🦙'];

  const APPS = [
    { id: 'pixelpro', name: 'PixelPro', description: 'Растровый графический редактор: слои, кисти, выделение, фильтры, экспорт PNG и сохранение проектов.', emoji: '🎨', category: 'Графика', color: 'linear-gradient(135deg,#3b5bdb,#5c7cfa)', url: 'pixelpro.html' },
    { id: 'snake', name: 'Змейка', description: 'Прикольная змейка', emoji: '🐍', category: 'Игра', color: 'linear-gradient(135deg, #4a9c62, #3f8b54, #357a49)', url: 'snake.html' },
    { id: 'polski', name: 'Польский язык', description: 'Polski — полный тренажёр: 14 уроков, тексты, ~1050 слов, карточки, тесты, письмо, творческие задания, польская клавиатура и озвучка.', emoji: '🇵🇱', category: 'Языки', color: 'linear-gradient(135deg,#dc143c,#a01030)', url: 'polski.html', aiGenerated: true },
    { id: 'srpski', name: 'Сербский язык', description: 'Srpski — полный тренажёр: 14 уроков, кириллица и латиница, ~900 слов, аудирование, карточки, тесты, озвучка.', emoji: '🇷🇸', category: 'Языки', color: 'linear-gradient(135deg,#0c4076,#082d52)', url: 'srpski.html', aiGenerated: true },
    { id: 'mowa', name: 'Украинский язык', description: 'Українська мова — полный тренажёр: 15 уроков, тексты, ~1100 слов, творческие задания, украинская клавиатура и озвучка.', emoji: '🇺🇦', category: 'Языки', color: 'linear-gradient(135deg,#ffd500,#ffb300)', url: 'mowa.html', aiGenerated: true },
    { id: 'italiano', name: 'Итальянский язык', description: 'Italiano — полный тренажёр: 50 уроков, тексты, 1000 слов, творческие задания, мысли о Римской империи.', emoji: '🇮🇹', category: 'Языки', color: 'linear-gradient(135deg,#009246,#24ad84)', url: 'italiano.html', aiGenerated: true },
    { id: 'historyege', name: 'История ЕГЭ', description: 'Тренажёр второй части ЕГЭ: 120 заданий, источники, методика, изображения.', emoji: '📜', category: 'Экзамены', color: 'linear-gradient(135deg, #183653, #8e6c34)', url: 'historyege.html', aiGenerated: true }
  ];

  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime=ms=>{ms=Math.max(0,Number(ms)||0);const s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')};
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  function toast(msg,type=''){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=msg;el.className='toast show '+type;clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3000)}

  const KEY='pikuco2';
  const store={
    get(k,d){try{const v=localStorage.getItem(KEY+'.'+k);if(!v)return d;return JSON.parse(v)}catch{return d}},
    set(k,v){try{localStorage.setItem(KEY+'.'+k,JSON.stringify(v))}catch{}},
    del(k){try{localStorage.removeItem(KEY+'.'+k)}catch{}}
  };

  const state={tests:[],votes:{},user:null,theme:store.get('theme','dark')};
  let dbOk=false;

  // Антиспам: клиентские кулдауны (на сервере те же лимиты, чуть мягче — в правилах Firebase)
  // На сервере (rules) лимиты 15 с и 600 с; на клиенте +1 с запаса на задержку сети/часы
  const COMMENT_COOLDOWN = 16000;
  // у гостей лимит строже: 30 мин на аккаунт (+ общий лимит 1 гостевой тест/мин на сервере)
  const testCooldown = () => state.user.isGuest ? 1801000 : 601000;
  function cooldownLeft(kind, ms){
    const last = Number(store.get('cd.' + state.user.id + '.' + kind, 0)) || 0;
    return Math.max(0, last + ms - Date.now());
  }
  function markCooldown(kind){ store.set('cd.' + state.user.id + '.' + kind, Date.now()); }

  function newAnswer(){return{id:uid(),text:'',correct:false,nextId:null,points:{}}}
  function newQuestion(){return{id:uid(),text:'',type:'single',image:null,answers:[newAnswer(),newAnswer()]}}
  function getTest(id){return state.tests.find(t=>t.id===id)}

  function toArr(v) {
    return Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === 'object' ? Object.values(v) : []);
  }

  const MODES=['standard','time','survival','tournament','tree','diagram','scale','swipe','sort'];
  const MODE_TYPES=['scale','swipe','sort'];
  const TAGS=[['games','🎮 Игры'],['cinema','🎬 Кинематограф'],['music','🎵 Музыка'],['science','🔬 Наука'],['society','👥 Общество'],['animation','🖍 Анимация'],['art','🎨 Искусство'],['nature','🌿 Природа'],['tech','⚙️ Техника'],['other','📌 Другое']];
  const TAG_IDS=TAGS.map(x=>x[0]);
  const tagLabel=id=>(TAGS.find(x=>x[0]===id)||['',''])[1];
  const cleanTagList=a=>[...new Set(toArr(a).map(String).filter(x=>TAG_IDS.includes(x)))].slice(0,2);
  const cleanCustomTags=a=>{const out=[];toArr(a).forEach(x=>{const v=String(x).replace(/[\u0000-\u001f<>]/g,' ').replace(/\s+/g,' ').trim().slice(0,50);if(v&&!out.some(o=>o.toLowerCase()===v.toLowerCase()))out.push(v)});return out.slice(0,3)};
  const isTimed=t=>t.mode==='time'||(MODE_TYPES.includes(t.mode)&&!!t.useTimer);
  const safeId=v=>SAFE_ID.test(String(v))?String(v):uid();

  function sanitizeTests(tests){
    return tests.filter(t => t && t.questions && SAFE_ID.test(String(t.id))).map(t=>{
      t.title=String(t.title||'Без названия');
      t.description=String(t.description||'');
      t.author=String(t.author||'');

      t.mode=MODES.includes(t.mode)?t.mode:'standard';
      t.createdAt=Number(t.createdAt)||0; // старые тесты без даты НЕ считаем новыми
      t.timeLimit=Math.max(2,Number(t.timeLimit)||60);
      t.useTimer=!!t.useTimer;
      t.tags=cleanTagList(t.tags);
      t.customTags=cleanCustomTags(t.customTags);
      t.shuffleQuestions=!!t.shuffleQuestions;
      t.shuffleAnswers=!!t.shuffleAnswers;
      t.endings=toArr(t.endings).map(e=>({...e,id:safeId(e.id),title:String(e.title||''),desc:String(e.desc||''),image:safeImg(e.image)}));
      t.questions=toArr(t.questions).map(q=>{
        q.id=safeId(q.id);
        q.text=String(q.text||'');
        q.image=safeImg(q.image);
        q.type=['multi','text','match','assemble','sort','scale','swipe'].includes(q.type)?q.type:'single';
        if(q.type!=='single'&&q.type!=='multi'&&['tree','diagram','tournament'].includes(t.mode))q.type='single';
        if(MODE_TYPES.includes(t.mode))q.type=t.mode; else if(q.type==='scale'||q.type==='swipe')q.type='single';
        q.answers=toArr(q.answers).map(a=>({...a,id:safeId(a.id),text:String(a.text||''),right:q.type==='match'?String(a.right||''):undefined,cat:q.type==='sort'?String(a.cat||''):undefined,correct:!!a.correct,nextId:/^[QE]_[A-Za-z0-9_-]{1,64}$/.test(String(a.nextId||''))?String(a.nextId):null,points:(a.points&&typeof a.points==='object')?a.points:{}}));
        q.categories=q.type==='sort'?toArr(q.categories).map(c=>({id:safeId(c.id),text:String(c.text||'')})):undefined;
        if(q.type==='scale'){
          const sc=q.scale&&typeof q.scale==='object'?q.scale:{};
          const num=(v,d)=>(v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v)))?Number(v):d;
          const mn=num(sc.min,0);let mx=num(sc.max,100);if(mx<=mn)mx=mn+1;
          const st=num(sc.step,1);
          q.scale={min:mn,max:mx,correct:Math.min(mx,Math.max(mn,num(sc.correct,(mn+mx)/2))),tolerance:Math.min(50,Math.max(0,num(sc.tolerance,5))),step:st>0?st:1};
        } else q.scale=undefined;
        q.truth=q.type==='swipe'?q.truth!==false:undefined;
        return q;
      });
      return t;
    }).filter(t => t.questions.length > 0);
  }

  async function dbLoad(){
    // тесты и оценки грузим независимо: сбой оценок не должен убивать список тестов

    if (testsData === null) {

      const cached = store.get('testsCache', null);
      dbOk = false;
      if (cached && typeof cached === 'object') {

  async function persistTest(test){
    test.title = cleanText(test.title).slice(0, 150);
    test.description = cleanText(test.description).slice(0, 400);
    test.previewImage = safeImg(test.previewImage);
    test.tags = cleanTagList(test.tags);
    test.customTags = cleanCustomTags(test.customTags);
    if (!test.tags.length) delete test.tags;
    if (!test.customTags.length) delete test.customTags;
    if (test.mode !== 'scale' && test.mode !== 'swipe') delete test.useTimer; else test.useTimer = !!test.useTimer;
    test.questions.forEach(q => {
      q.text = cleanText(q.text).slice(0, 500);
      q.image = safeImg(q.image);
      if (q.answers) q.answers.forEach(a => {
        a.text = cleanText(a.text).slice(0, q.type === 'assemble' ? 150 : 200);
        if (q.type === 'match') a.right = cleanText(a.right).slice(0, 200); else delete a.right;
        if (q.type !== 'sort') delete a.cat;
      });
      if (q.type === 'sort') q.categories = (q.categories || []).map(c => ({ id: c.id, text: cleanText(c.text).slice(0, 60) })); else delete q.categories;
      if (q.type !== 'scale') delete q.scale;
      if (q.type !== 'swipe') delete q.truth;
    });
    (test.endings||[]).forEach(e => {
      e.title = cleanText(e.title).slice(0, 150);
      e.desc = cleanText(e.desc).slice(0, 1000);
      e.image = safeImg(e.image);
    });
    test.authorId = state.user.id;
    test.author = state.user.name;

    // Всегда сверяемся с сервером: существует ли тест, чей он и какая у него настоящая дата создания.
    // (Раньше дата бралась из локальной копии — после создания теста она могла не совпасть с серверной,
    // и правка падала на проверке правил.)
    let remoteAuthor = null, remoteCreated = 0, checked = false;
    try {
      const [ra, rc] = await Promise.all([
        fbFetch(`/tests/${test.id}/authorId.json`).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))),
        fbFetch(`/tests/${test.id}/createdAt.json`).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      ]);
      remoteAuthor = typeof ra === 'string' ? ra : null;
      remoteCreated = (typeof rc === 'number' && rc > 0) ? rc : 0;
      checked = true;
    } catch {}
    let isNew = checked ? !remoteAuthor : !state.tests.some(t => t.id === test.id);
    if (!isNew && checked && remoteAuthor !== state.user.id) {
      toast('Этот тест принадлежит другому аккаунту — редактировать его нельзя', 'warn');
      return false;
    }
    if (isNew) {
      const left = cooldownLeft('test', testCooldown());
      if (left > 0) { toast(`Новый тест можно создать через ${Math.ceil(left/60000)} мин.`, 'warn'); return false; }
    }
    // время создания ставит сервер — подделать «новизну» нельзя
    const stamp = { '.sv': 'timestamp' };
    const keepCreated = remoteCreated || (checked ? 0 : (Number(test.createdAt) || 0));
    const body = { ...test, createdAt: (isNew || !(keepCreated > 0)) ? stamp : keepCreated };
    const payload = JSON.stringify(body);
    if (payload.length > 5000000) {
      toast('Тест слишком огромный (больше 5МБ). Попробуйте меньше картинок.', 'warn');
      return false;
    }

    try{
      let res;
      if (isNew) {
        res = await fbFetch('/.json', {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(Object.assign(
            { ['tests/' + test.id]: body, ['rateLimit/' + state.user.id + '/test']: stamp },
            state.user.isGuest ? { guestLimit: stamp } : {}
          ))
        });
      } else {
        res = await fbFetch(`/tests/${test.id}.json`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: payload
        });
      }
      if(!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error(isNew
          ? 'сервер отклонил создание (возможно, тесты создаются слишком часто — подождите)'
          : 'сервер отклонил изменение. Обновите страницу; если не поможет — выйдите и войдите в аккаунт заново');
        const err = await res.text();
        throw new Error(`HTTP ${res.status}: ${err}`);
      }
      // настоящую дату создания читаем с сервера (ответ на запись может содержать неразрешённый серверный штамп)
      let ts = keepCreated;
      if (!ts) {
        try { const r = await fbFetch(`/tests/${test.id}/createdAt.json`); const v = r.ok ? await r.json() : null; if (typeof v === 'number' && v > 0) ts = v; } catch {}
      }
      if (!ts) ts = Date.now();
      test.createdAt = ts;
      if (isNew) markCooldown('test');
      const clean = sanitizeTests([JSON.parse(JSON.stringify({ ...test, createdAt: ts }))])[0];
      if (clean) {
        const idx=state.tests.findIndex(t=>t.id===test.id);
        if(idx>=0) state.tests[idx]=clean; else state.tests.unshift(clean);
      }
      return true;
    }catch(e){
      toast('Ошибка сохранения: ' + e.message, 'warn');
      console.error(e);
      return false;
    }
  }

  /* =========================================================
     PRESENCE (онлайн) — отдельный узел /presence, без загрузки всех профилей
     ========================================================= */
  let presenceCleanup = null;
  function setupPresence() {
    if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
    if (!state.user || !state.user.id) return;

    const db = firebase.database();
    const myRef = db.ref('/presence/' + state.user.id);
    const connRef = db.ref('.info/connected');
    const allRef = db.ref('/presence');
    const countEl = document.getElementById('online-count');

    const beat = () => { myRef.set({ lastSeen: Date.now() }).catch(()=>{}); };
    const onConn = (snap) => {
      if (snap.val() === false) return;
      myRef.onDisconnect().remove().then(beat).catch(()=>{});
    };
    const onAll = (snap) => {
      const users = snap.val() || {};
      const now = Date.now();
      let count = 0;
      for (const k in users) {
        const u = users[k];
        if (u && u.lastSeen && (now - u.lastSeen < 120000)) count++;
      }
      if (countEl) countEl.textContent = Math.max(count, 1);
    };

    connRef.on('value', onConn);
    allRef.on('value', onAll, () => {});
    const iv = setInterval(beat, 45000);
    presenceCleanup = () => {
      connRef.off('value', onConn);
      allRef.off('value', onAll);
      clearInterval(iv);
      myRef.remove().catch(()=>{});
    };
  }

  /* =========================================================
     ПРОВЕРКА ОТВЕТОВ
     ========================================================= */
  const normText = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();

  // resp: массив id выбранных ответов; строка (текстовый ответ); объект {idЛевого: idПравого} (соединение);
  // упорядоченный массив id блоков (сборка)
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  function gradeQuestion(q, resp){
    if(q.type==='text'){
      const v = normText(resp);
      return !!v && q.answers.some(a => normText(a.text) === v);
    }
    if(q.type==='match'){
      const m = isObj(resp) ? resp : {};
      return q.answers.length > 0 && q.answers.every(a => m[a.id] === a.id);
    }
    if(q.type==='assemble'){
      const ids = Array.isArray(resp) ? resp : [];
      const exp = q.answers.filter(a => a.correct).map(a => a.text.trim());
      const got = ids.map(id => { const a = q.answers.find(x => x.id === id); return a ? a.text.trim() : null; });
      return exp.length > 0 && got.length === exp.length && got.every((t, i) => t === exp[i]);
    }
    if(q.type==='sort'){
      const m = isObj(resp) ? resp : {};
      return q.answers.length > 0 && q.answers.every(a => m[a.id] === a.cat);
    }
    if(q.type==='scale'){
      const sc = q.scale;
      if(!sc || typeof resp !== 'number' || !Number.isFinite(resp)) return false;
      return Math.abs(resp - sc.correct) <= (sc.max - sc.min) * sc.tolerance / 100 + 1e-9;
    }
    if(q.type==='swipe'){
      return typeof resp === 'boolean' && resp === (q.truth !== false);
    }
    const sel=(Array.isArray(resp)?resp:[]).slice().sort();
    const right=q.answers.filter(a=>a.correct).map(a=>a.id).sort();
    return sel.length===right.length&&sel.every((v,i)=>v===right[i]);
  }

  /* =========================================================
     SHARE LINK (компактная, без UUID; результат пересчитывается по тесту)
     ========================================================= */
  function b64uEnc(str){
    const bytes = new TextEncoder().encode(str);
    let s=''; bytes.forEach(b => s += String.fromCharCode(b));
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64uDec(str){
    let s = String(str).replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    const bin = atob(s);
    const u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(u);
  }

  function makeShareUrl(r){
    const base = location.origin + location.pathname;
    if(r.share){
      return `${base}#/result?id=${encodeURIComponent(r.testId)}&n=${encodeURIComponent(r.player||'')}&tm=${Math.round((r.time||0)/1000)}&d=${b64uEnc(JSON.stringify(r.share))}`;
    }
    const who = `&n=${encodeURIComponent(r.player||'')}`;
    const endId = r.mode === 'tree' ? (r.ending && r.ending.id) : r.mode === 'diagram' ? (r.winner && r.winner.id) : null;
    if (endId) return `${base}#/result?id=${encodeURIComponent(r.testId)}${who}&e=${encodeURIComponent(endId)}`;
    if (r.mode === 'tournament' && r.winner && r.winner.id) return `${base}#/result?id=${encodeURIComponent(r.testId)}${who}&w=${encodeURIComponent(r.winner.id)}`;
    return `${base}#/test/${encodeURIComponent(r.testId)}`;
  }

  /* =========================================================
     AUTH
     ========================================================= */
  function validateLogin(login) {
    if (!login || login.length < 3) return 'Логин — не короче 3 символов';
    if (login.length > 20) return 'Логин — не длиннее 20 символов';
    if (!/^[a-z0-9._-]+$/.test(login)) return 'Логин: только латиница (a-z), цифры, точка, дефис, _';
    return null;
  }
  function validatePassword(password) {
    if (!password || password.length < 6) return 'Пароль — минимум 6 символов';
    return null;
  }
  function fbErrorToRu(code) {
    const map = {
      'auth/email-already-in-use': 'Этот логин уже занят — попробуй другой',
      'auth/credential-already-in-use': 'Этот логин уже занят — попробуй другой',
      'auth/invalid-email': 'Недопустимые символы в логине. Используй только латиницу (a-z)',
      'auth/weak-password': 'Пароль слишком простой — нужно минимум 6 символов',
      'auth/operation-not-allowed': 'Регистрация отключена в настройках Firebase',
      'auth/network-request-failed': 'Нет связи с сервером. Проверь интернет',
      'auth/too-many-requests': 'Слишком много попыток. Подожди пару минут',
      'auth/user-not-found': 'Аккаунт не найден',
      'auth/wrong-password': 'Неверный пароль',
      'auth/invalid-credential': 'Неверный логин или пароль'
    };
    return map[code] || ('Ошибка: ' + code);
  }

  async function doRegister(login, password, displayName){
    login = (login || '').trim().toLowerCase();
    displayName = (displayName || '').trim();
    const loginErr = validateLogin(login);
    if (loginErr) { toast(loginErr, 'warn'); return false; }
    const passErr = validatePassword(password);
    if (passErr) { toast(passErr, 'warn'); return false; }

    try {
      const email = login + '@pikuko.local';
      const currentUser = firebase.auth().currentUser;
      let user;
      if (currentUser && currentUser.isAnonymous) {
        const credential = firebase.auth.EmailAuthProvider.credential(email, password);
        const res = await currentUser.linkWithCredential(credential);
        user = res.user;
      } else {
        const res = await firebase.auth().createUserWithEmailAndPassword(email, password);
        user = res.user;
      }
      const uid = user.uid;
      // после привязки логина токен ещё «анонимный» — обновляем, иначе правила базы
      // считают пользователя гостем (оценки, комментарии, редактирование)
      try { await user.getIdToken(true); } catch (e) { console.warn('token refresh', e); }
      const cleanName = cleanText(displayName || login).slice(0, 40) || login;
      const profile = { name: cleanName, avatar: (state.user && state.user.avatar) || EMOJIS[Math.floor(Math.random()*EMOJIS.length)] };
      await fbFetch(`/users/${uid}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...profile, registeredAt: { '.sv': 'timestamp' } }) });
      state.user = { id: uid, login: login, isGuest: false, ...profile, registeredAt: Date.now() };
      toast('Успешно!', 'good');
      return true;
    } catch (error) {
      console.error('Регистрация:', error);
      toast(fbErrorToRu(error.code), 'warn');
      return false;
    }
  }

  // Гостевые тесты принадлежат гостевому uid. При входе в существующий аккаунт uid меняется,
  // и тесты «терялись» (редактировать их было нельзя). Переносим их в аккаунт.
  async function migrateGuestTests(fromUid, ids, toUid, toName) {
    let moved = 0;
    for (const id of ids) {
      const t = getTest(id);
      const patch = { authorId: toUid, author: toName };
      if (t && !(t.createdAt > 0)) patch.createdAt = { '.sv': 'timestamp' };
      try {
        const r = await fbFetch(`/tests/${id}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
        if (r.ok) { moved++; if (t) { t.authorId = toUid; t.author = toName; } }
      } catch {}
    }
    await fbFetch(`/transfers/${fromUid}.json`, { method: 'DELETE' }).catch(() => {});
    return moved;
  }

  // слушатель onAuthStateChanged ждёт окончания входа (иначе он перезагрузит тесты посреди переноса гостевых тестов)
  let authLock = Promise.resolve();
  async function doLogin(login, password){
    let release;
    authLock = new Promise(r => { release = r; });
    try {
      login = (login || '').trim().toLowerCase();
      const email = login + '@pikuko.local';

      // если у гостя есть свои тесты — заранее разрешаем аккаунту их забрать
      const prev = firebase.auth().currentUser;
      const prevUid = prev && prev.isAnonymous ? prev.uid : null;
      const guestTests = prevUid ? state.tests.filter(t => t.authorId === prevUid).map(t => t.id) : [];
      let targetUid = null;
      if (guestTests.length) {
        // узнаём uid аккаунта через временное второе приложение, не выходя из гостя
        const probe = firebase.initializeApp(firebaseConfig, 'probe-' + Date.now());
        try {
          const c = await probe.auth().signInWithEmailAndPassword(email, password);
          targetUid = c.user.uid;
          await probe.auth().signOut();
        } finally { try { await probe.delete(); } catch {} }
        if (targetUid) {
          await fbFetch(`/transfers/${prevUid}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(targetUid) }).catch(() => {});
        }
      }

      const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
      const uid = userCredential.user.uid;
      const profileRes = await fbFetch(`/users/${uid}.json`);
      const profile = await profileRes.json();
      if (!profile) throw new Error("Профиль не найден");
      state.user = { id: uid, login: login, isGuest: false, ...profile };

      if (guestTests.length && targetUid === uid) {
        try {
          const n = await migrateGuestTests(prevUid, guestTests, uid, String(profile.name || login));
          if (n) toast(`Вы вошли! Гостевые тесты перенесены в аккаунт: ${n}`, 'good');
          else toast('Вы вошли!', 'good');
        } catch (e) { console.warn('migrate', e); toast('Вы вошли, но гостевые тесты перенести не удалось', 'warn'); }
      } else {
        toast('Вы вошли!', 'good');
      }
      return true;
    } catch (error) {
      console.error(error);
      toast('Неверный логин или пароль', 'warn');
      return false;
    } finally {
      release();
    }
  }

  function doLogout(){
    if (presenceCleanup) { presenceCleanup(); presenceCleanup = null; }
    firebase.auth().signOut().then(() => { location.reload(); });
  }

  /* =========================================================
     VOTES & COMMENTS
     ========================================================= */
  function voteCounts(id) {
    let likes = 0, dislikes = 0;
    Object.values(state.votes[id] || {}).forEach(v => {
      if (v === 'like') likes++;
      else if (v === 'dislike') dislikes++;
    });
    return { likes, dislikes };
  }
  function myVote(id) { return (state.votes[id] || {})[state.user.id] || null; }

  async function castVote(testId, voteType) {
    if (state.user.isGuest) { toast('Оценивать могут только зарегистрированные пользователи', 'warn'); return false; }
    const tt = getTest(testId);
    if (tt && tt.authorId === state.user.id) { toast('Нельзя оценивать свой тест', 'warn'); return false; }
    const path = `/votes/${testId}/${state.user.id}.json`;
    try {
      let res;
      if (voteType) {
        res = await fbFetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(voteType) });
      } else {
        res = await fbFetch(path, { method: 'DELETE' });
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!state.votes[testId]) state.votes[testId] = {};
      if (voteType) state.votes[testId][state.user.id] = voteType;
      else delete state.votes[testId][state.user.id];
      return true;
    } catch (e) {
      toast('Не удалось сохранить оценку: ' + e.message, 'warn');
      return false;
    }
  }

  async function loadComments(testId) {
    const [res, vres] = await Promise.all([
      fbFetch(`/comments/${testId}.json`),
      fbFetch(`/commentVotes/${testId}.json`).catch(() => null)
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json() || {};
    let votes = {};
    try { if (vres && vres.ok) votes = await vres.json() || {}; } catch {}
    const list = Object.entries(data)
      .filter(([,c]) => c && typeof c === 'object' && typeof c.text === 'string')
      .map(([id, c]) => ({ id, ...c }));
    // аватары авторов (для красивого отображения); при ошибке показываем первую букву имени
    const users = {};
    const ids = [...new Set(list.map(c => c.authorId).filter(id => id && SAFE_ID.test(String(id))))].slice(0, 60);
    await Promise.all(ids.map(id => fbFetch(`/users/${id}.json`).then(r => r.ok ? r.json() : null).then(u => {
      if (u && typeof u === 'object') users[id] = { avatar: typeof u.avatar === 'string' ? u.avatar : '' };
    }).catch(() => {})));
    return { list, votes, users };
  }

  async function castCommentVote(testId, cid, type) {
    if (state.user.isGuest) { toast('Оценивать комментарии могут только зарегистрированные пользователи', 'warn'); return false; }
    const path = `/commentVotes/${testId}/${cid}/${state.user.id}.json`;
    try {
      const res = type
        ? await fbFetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(type) })
        : await fbFetch(path, { method: 'DELETE' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const v = cmState.votes;
      v[cid] = v[cid] || {};
      if (type) v[cid][state.user.id] = type; else delete v[cid][state.user.id];
      return true;
    } catch (e) {
      toast('Не удалось сохранить оценку: ' + e.message, 'warn');
      return false;
    }
  }

  async function postComment(testId, text, parentId) {
    if (state.user.isGuest) { toast('Комментировать могут только зарегистрированные пользователи', 'warn'); return false; }
    const left = cooldownLeft('comment', COMMENT_COOLDOWN);
    if (left > 0) { toast(`Подождите ${Math.ceil(left/1000)} сек. перед следующим комментарием`, 'warn'); return false; }
    const cid = uid();
    const stamp = { '.sv': 'timestamp' };
    const payload = {
      authorId: state.user.id,
      author: String(state.user.name || '').slice(0, 40),
      text: cleanText(text).slice(0, 500),
      date: stamp
    };
    if (parentId && SAFE_ID.test(String(parentId))) payload.parentId = String(parentId);
    if (!payload.text) return false;
    try {
      // комментарий и отметка времени для лимита пишутся одной атомарной операцией
      const res = await fbFetch('/.json', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [`comments/${testId}/${cid}`]: payload, [`rateLimit/${state.user.id}/comment`]: stamp })
      });
      if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'слишком часто или нет прав' : 'HTTP ' + res.status);
      markCooldown('comment');
      return true;
    } catch (e) {
      toast('Ошибка отправки: ' + e.message, 'warn');
      return false;
    }
  }

  async function editComment(testId, commentId, text) {
    const clean = cleanText(text).slice(0, 500);
    if (!clean) { toast('Введите текст', 'warn'); return false; }
    try {
      // ВАЖНО: в payload нельзя класть date/authorId — правила требуют, чтобы они остались прежними
      const res = await fbFetch(`/comments/${testId}/${commentId}.json`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: clean, edited: { '.sv': 'timestamp' } })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    } catch (e) {
      toast('Не удалось изменить: ' + e.message, 'warn');

    }
  }

  /* =========================================================
     СОРТИРОВКА ГЛАВНОЙ
     новые (5 дней) сверху → дальше по рейтингу: хорошие → без оценок → плохие
     ========================================================= */
  const NEW_MS = 5 * 24 * 3600 * 1000;
  const isNewTest = t => (Date.now() - (t.createdAt || 0)) < NEW_MS;
  function ratingScore(id){
    const { likes, dislikes } = voteCounts(id);
    return (likes + 1) / (likes + dislikes + 2); // 0.5 = нет оценок, >0.5 хороший, <0.5 плохой
  }
  function sortedTests(list){
    const fresh = [], rest = [];
    list.forEach(t => (isNewTest(t) ? fresh : rest).push(t));
    fresh.sort((a,b) => b.createdAt - a.createdAt);
    rest.sort((a,b) => {
      const d = ratingScore(b.id) - ratingScore(a.id);
      if (Math.abs(d) > 1e-9) return d;
      const va = voteCounts(a.id), vb = voteCounts(b.id);
      const tv = (vb.likes + vb.dislikes) - (va.likes + va.dislikes);
      if (tv) return tv;
      return b.createdAt - a.createdAt;
    });
    return fresh.concat(rest);
  }

      s1('len([1,2,3])?',['3','2','6','Ошибка'],0),

  ]}

          ${(own || (ownTest && !readonly)) ? `<button class="c-tool del" data-cact="del" title="Удалить">✕</button>` : ''}
        </div>
      </div>
      <p class="comment-text c-body">${renderCommentText(c.text)}</p>
      <div class="c-actions">
        <button class="c-btn ${tl.mine === 'like' ? 'on' : ''}" data-cact="like" ${canVote ? '' : 'disabled'}>👍 ${tl.likes}</button>
        <button class="c-btn ${tl.mine === 'dislike' ? 'on' : ''}" data-cact="dislike" ${canVote ? '' : 'disabled'}>👎 ${tl.dislikes}</button>
        ${threadBtn}
      </div>
    </div>`;
  }

  function renderComments() {
    const box = $('#comments-box');
    if (!box || !cmState) return;
    const { readonly, list } = cmState;
    const guest = !!state.user.isGuest;
    const canPost = !readonly && !guest;

    const roots = list.filter(c => !c.parentId).sort((a, b) => (b.date || 0) - (a.date || 0));
    const replies = {};
    list.forEach(c => { if (c.parentId) (replies[c.parentId] = replies[c.parentId] || []).push(c); });
    Object.values(replies).forEach(a => a.sort((x, y) => (x.date || 0) - (y.date || 0)));
    // ответы без существующего корневого комментария не показываем
    const total = roots.reduce((s, r) => s + 1 + (replies[r.id] || []).length, 0);

    box.innerHTML = `<h3>Комментарии (${total})</h3>
      ${readonly ? '' : (guest
        ? `<p class="muted small" style="margin-bottom:16px">Чтобы оставить отзыв, <a href="#/profile" style="color:var(--accent)">войдите или зарегистрируйтесь</a>.</p>`
        : `<div style="margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border)">
            <div class="mention-box"><textarea class="input mention-ta" id="test-comment" rows="2" maxlength="500" placeholder="Оставить отзыв..."></textarea></div>
            <button class="btn ghost sm" id="submit-test-comment" style="margin-top:8px">Отправить</button>
          </div>`)}
      ${roots.length ? roots.map(r => {
        const rs = replies[r.id] || [];
        return `<div class="c-node" data-root="${esc(r.id)}">
          ${commentHtml(r, false, rs.length)}
          <div class="thread" ${openThreads.has(r.id) ? '' : 'hidden'}>
            ${rs.map(x => commentHtml(x, true, 0)).join('')}
            ${canPost ? `<div class="mention-box"><textarea class="input reply-ta" rows="2" maxlength="500" placeholder="Ваш ответ..."></textarea></div>
            <button class="btn ghost sm" data-cact="send-reply" style="margin-top:6px">Отправить ответ</button>` : ''}
          </div>
        </div>`;
      }).join('') : '<p class="muted small">Пока нет комментариев.</p>'}`;
    bindComments(box);
  }

  function refreshTally(cEl, cid) {
    const tl = tally(cmState.votes, cid);
    const l = cEl.querySelector('[data-cact="like"]'), d = cEl.querySelector('[data-cact="dislike"]');
    if (l) { l.textContent = '👍 ' + tl.likes; l.classList.toggle('on', tl.mine === 'like'); }
    if (d) { d.textContent = '👎 ' + tl.dislikes; d.classList.toggle('on', tl.mine === 'dislike'); }
  }

  function bindComments(box) {
    const { testId, readonly, list } = cmState;
    const find = id => list.find(c => c.id === id);

    const sb = $('#submit-test-comment', box);
    if (sb) sb.addEventListener('click', async () => {
      const txt = $('#test-comment', box).value.trim();
      if (!txt) { toast('Введите текст', 'warn'); return; }
      sb.disabled = true;
      if (await postComment(testId, txt)) { toast('Добавлено ✓', 'good'); mountComments(testId, readonly); }
      else sb.disabled = false;
    });

    box.querySelectorAll('textarea.mention-ta, textarea.reply-ta').forEach(attachMentions);

    // onclick (а не addEventListener): контейнер переживает перерисовки, обработчики не должны копиться
    box.onclick = async (e) => {
      const btn = e.target.closest('[data-cact]');
      if (!btn || btn.disabled) return;
      const act = btn.dataset.cact;
      const cEl = btn.closest('.comment');
      const cid = cEl && cEl.dataset.cid;
      const node = btn.closest('.c-node');

      if (act === 'like' || act === 'dislike') {
        const cur = (cmState.votes[cid] || {})[state.user.id] || null;
        if (await castCommentVote(testId, cid, cur === act ? null : act)) refreshTally(cEl, cid);
      }
      else if (act === 'thread') {
        const th = node.querySelector('.thread');
        th.hidden = !th.hidden;
        if (th.hidden) openThreads.delete(node.dataset.root); else openThreads.add(node.dataset.root);
        btn.classList.toggle('on', !th.hidden);
        if (!th.hidden) { const ta = th.querySelector('.reply-ta'); if (ta && !th.querySelector('.comment')) ta.focus(); }
      }
      else if (act === 'reply') {
        const ta = node.querySelector('.reply-ta');
        const c = find(cid);
        if (!ta || !c) return;
        const tag = '@@' + mentionKey(c.author) + ' ';
        if (!ta.value.includes(tag)) ta.value = tag + ta.value;
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
      else if (act === 'send-reply') {
        const ta = node.querySelector('.reply-ta');
        const txt = ta.value.trim();
        if (!txt) { toast('Введите текст', 'warn'); return; }
        const rid = node.dataset.root;
        btn.disabled = true;
        if (await postComment(testId, txt, rid)) {
          openThreads.add(rid);
          toast('Ответ добавлен ✓', 'good');
          mountComments(testId, readonly);
        } else btn.disabled = false;
      }
      else if (act === 'edit') {
        const c = find(cid);
        const p = cEl.querySelector('.comment-text');
        if (!c || !p) return;
        btn.style.display = 'none';
        p.outerHTML = `<div class="comment-editbox"><textarea class="input" rows="3" maxlength="500">${esc(c.text)}</textarea><div class="row" style="margin-top:6px"><button class="btn primary sm" data-save>Сохранить</button><button class="btn ghost sm" data-cancel>Отмена</button></div></div>`;
        const eb = cEl.querySelector('.comment-editbox');
        eb.querySelector('textarea').focus();
        eb.querySelector('[data-cancel]').addEventListener('click', () => renderComments());
        eb.querySelector('[data-save]').addEventListener('click', async () => {
          if (await editComment(testId, c.id, eb.querySelector('textarea').value)) {
            toast('Комментарий изменён ✓', 'good');
            mountComments(testId, readonly);
          }
        });
      }
      else if (act === 'del') {
        const c = find(cid);
        if (!c) return;
        const isRoot = !c.parentId;
        const ids = [c.id];
        if (isRoot) list.forEach(x => { if (x.parentId === c.id) ids.push(x.id); });
        if (!confirm(isRoot && ids.length > 1 ? 'Удалить комментарий вместе со всеми ответами?' : 'Удалить комментарий?')) return;
        if (await deleteCommentWithReplies(testId, ids)) { openThreads.delete(c.id); mountComments(testId, readonly); }
      }
    };
  }

  // подсказки по @@: имена участников обсуждения и автор теста
  function attachMentions(ta) {
    const wrap = ta.parentElement;
    if (!wrap || !wrap.classList.contains('mention-box')) return;
    let menu = null;
    const close = () => { if (menu) { menu.remove(); menu = null; } };
    const candidates = () => {
      const me = mentionKey(state.user.name).toLowerCase();
      const seen = new Map();
      const add = n => { const k = mentionKey(n); if (k && k.toLowerCase() !== me && !seen.has(k.toLowerCase())) seen.set(k.toLowerCase(), k); };
      cmState.list.forEach(c => add(c.author));
      const t = cmOwner(cmState.testId);
      if (t) add(t.author);
      return [...seen.values()];
    };
    ta.addEventListener('input', () => {
      const pos = ta.selectionStart;
      const m = /@@([^\s@]*)$/.exec(ta.value.slice(0, pos));
      if (!m) { close(); return; }
      const q = m[1].toLowerCase();
      const items = candidates().filter(k => k.toLowerCase().startsWith(q)).slice(0, 6);
      close();
      // имя уже набрано целиком — подсказка не нужна
      if (!items.length || (items.length === 1 && items[0].toLowerCase() === q)) return;
      menu = document.createElement('div');
      menu.className = 'mention-list';
      menu.innerHTML = items.map(k => `<button type="button" data-k="${esc(k)}">@@${esc(k)}</button>`).join('');
      wrap.appendChild(menu);
      menu.addEventListener('mousedown', ev => {
        const b = ev.target.closest('button');
        if (!b) return;
        ev.preventDefault();
        const start = pos - m[0].length;
        ta.value = ta.value.slice(0, start) + '@@' + b.dataset.k + ' ' + ta.value.slice(pos);
        const np = start + 2 + b.dataset.k.length + 1;
        ta.setSelectionRange(np, np);
        close();
        ta.focus();
      });
    });
    ta.addEventListener('blur', () => setTimeout(close, 150));
  }

  /* =========================================================
     ЛИДЕРЫ, ПРОФИЛИ И АЧИВКИ
     XP считается из публичных данных (тесты, лайки, пройденные тесты) — хранить его отдельно не нужно
     +20 XP за каждый созданный тест, +5 XP за каждый лайк под тестом, бонусы за ачивки
     ========================================================= */
  const XP_PER_TEST = 20, XP_PER_LIKE = 5;
  const ACHIEVEMENTS = [
    { id: 'c10',  kind: 'created', n: 10,  xp: 20,  icon: '✍️', title: 'Создано 10 тестов' },
    { id: 'c50',  kind: 'created', n: 50,  xp: 80,  icon: '🧱', title: 'Создано 50 тестов' },
    { id: 'c100', kind: 'created', n: 100, xp: 120, icon: '🏛️', title: 'Создано 100 тестов' },
    { id: 'p10',  kind: 'played',  n: 10,  xp: 20,  icon: '🎯', title: 'Пройдено 10 тестов' },
    { id: 'p50',  kind: 'played',  n: 50,  xp: 80,  icon: '🚀', title: 'Пройдено 50 тестов' },
    { id: 'p100', kind: 'played',  n: 100, xp: 120, icon: '👑', title: 'Пройдено 100 тестов' }
  ];
  const GUEST_NAME_RE = /^Гость #\d{4}$/;
  const achValue = (a, st) => a.kind === 'created' ? st.tests : st.played;

  function calcXp(st) {
    const ach = ACHIEVEMENTS.filter(a => achValue(a, st) >= a.n);
    return { xp: st.tests * XP_PER_TEST + st.likes * XP_PER_LIKE + ach.reduce((s, a) => s + a.xp, 0), ach };
  }
  // played: { uid: количество пройденных чужих тестов }
  function authorStats(played) {
    const m = {};
    const get = id => m[id] || (m[id] = { tests: 0, likes: 0, played: 0 });
    state.tests.forEach(t => {
      if (!t.authorId) return;
      const s = get(t.authorId);
      s.tests++;
      s.likes += voteCounts(t.id).likes;
    });
    Object.entries(played || {}).forEach(([id, n]) => { get(id).played = n; });
    return m;
  }
  async function loadPlayCounts() {
    try {
      const r = await fbFetch('/playDone.json');
      if (!r.ok) return {};
      const d = await r.json() || {};
      const out = {};
      Object.entries(d).forEach(([uid, o]) => { out[uid] = o && typeof o === 'object' ? Object.keys(o).length : 0; });
      return out;
    } catch { return {}; }
  }
  async function loadPlayedOf(uid) {
    try {
      const r = await fbFetch(`/playDone/${encodeURIComponent(uid)}.json`);
      if (r.ok) { const d = await r.json(); return d && typeof d === 'object' ? Object.keys(d).length : 0; }
    } catch {}
    return 0;
  }

  function achCardsHtml(st) {
    const group = (kind, title) => `<div class="ach-group"><div class="ach-title">${title}</div><div class="ach-grid">
      ${ACHIEVEMENTS.filter(a => a.kind === kind).map(a => {
        const v = achValue(a, st), done = v >= a.n, pct = Math.min(100, Math.round(v / a.n * 100));
        return `<div class="ach-card ${done ? 'done' : ''}" title="${esc(a.title)} · +${a.xp} XP">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-name">${esc(a.title)}</div>
          <div class="ach-xp">+${a.xp} XP</div>
          <div class="ach-bar"><span style="width:${pct}%"></span></div>
          <div class="ach-state">${done ? 'Получено ✓' : Math.min(v, a.n) + ' / ' + a.n}</div>
        </div>`;
      }).join('')}</div></div>`;
    return group('created', '🛠 Создатель') + group('played', '🎮 Игрок');
  }
  function xpBoxHtml(st, extra, achMode) {
    const x = calcXp(st);
    return `<div class="card xp-card">
      <div class="row between"><div><div class="muted small">Опыт</div><div class="xp-big">${x.xp} <span>XP</span></div></div>${extra || ''}</div>
      <div class="xp-stats">
        <div><b>${st.tests}</b><span>создано</span></div>
        <div><b>${st.likes}</b><span>лайков</span></div>
        <div><b>${st.played}</b><span>пройдено</span></div>
        <div><b>${x.ach.length}/${ACHIEVEMENTS.length}</b><span>ачивок</span></div>
      </div>
      ${achMode === 'toggle' ? `<button class="btn ghost" id="ach-toggle" type="button" style="margin-top:12px" onclick="var b=document.getElementById('ach-box');b.hidden=!b.hidden;this.textContent=b.hidden?'Показать достижения':'Скрыть достижения'">Показать достижения</button><div id="ach-box" hidden>${achCardsHtml(st)}</div>` : ''}
    </div>`;
  }
  // карточка опыта пользователя (подгружает число пройденных тестов)
  async function fillXpBox(uid, el, achMode) {
    if (!el) return;
    const base = authorStats()[uid] || { tests: 0, likes: 0, played: 0 };
    const played = await loadPlayedOf(uid);
    if (document.body.contains(el)) el.innerHTML = xpBoxHtml({ ...base, played }, '', achMode);
  }
  // отмечаем пройденный тест (только зарегистрированные и только чужие тесты)
  async function markPlayed(testId) {
    if (!state.user || state.user.isGuest) return;
    const t = getTest(testId);
    if (!t || t.authorId === state.user.id) return;
    try { await fbFetch(`/playDone/${state.user.id}/${testId}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: 'true' }); } catch {}
  }

      ${state.user.isGuest ? '<p class="muted small">🔒 Гости видят таблицу, но не могут открывать профили игроков. <a href="#/profile">Войти или зарегистрироваться</a></p>' : ''}

  async function bindLeaders() {

        <div class="muted small">Тестов: ${r.tests} · 👍 ${r.likes} · пройдено: ${r.played}</div>
