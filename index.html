  /* =========================================================
     PLAY
     ========================================================= */
  function startPlay(id){
    const t=getTest(id);if(!t){location.hash='#/';return}
    play={testId:id,index:0,maxIndex:0,answers:{},start:Date.now(),scores:{}};
    if(isTimed(t)) play.timeLeft=t.timeLimit||60; // до первого renderPlay, иначе таймер показывает 00:00

    // копии вопросов (с возможным перемешиванием)
    let qs = t.questions.map(q => ({...q, answers: q.answers.slice()}));
    const canShuffle = t.mode !== 'tree' && t.mode !== 'tournament';
    if (canShuffle && t.shuffleAnswers) qs.forEach(q => { if (q.type !== 'text' && q.type !== 'assemble') q.answers = shuffle(q.answers); });
    if (canShuffle && t.shuffleQuestions) qs = shuffle(qs);
    play.questions = qs;

    if(t.mode==='diagram'){
      (t.endings||[]).forEach(e => play.scores[e.id] = 0);
    }
    if(t.mode==='tree'){
      play.currentNodeId=qs.length>0?qs[0].id:null;
      play.history=play.currentNodeId?[play.currentNodeId]:[];
    }
    if(t.mode==='tournament'){
      play.roundItems = shuffle(t.questions);
      play.winners = [];
      play.currentPair = [];
      play.bracketRound = 1;
      nextTournamentPair();
    } else {
      renderPlay();
    }

    if (isTimed(t)) {
      playTimer = setInterval(() => {
        if (!play) return;
        play.timeLeft--;
        const e = $('#timer');
        if (e) e.textContent = fmtTime(play.timeLeft * 1000);
        if (play.timeLeft <= 0) {
          toast('Время вышло!', 'warn');
          finishPlay();
        }
      }, 1000);
    } else if (t.mode !== 'tournament' && t.mode !== 'tree' && t.mode !== 'diagram') {
      playTimer=setInterval(()=>{const e=$('#timer');if(e&&play)e.textContent=fmtTime(Date.now()-play.start)},500);
    }
  }

  function nextTournamentPair() {
    if (!play.roundItems.length && !play.winners.length) { finishPlay(); return; } // пустой/битый тест
    if (play.roundItems.length < 2) {
      if (play.roundItems.length === 1) play.winners.push(play.roundItems.pop());
      if (play.winners.length === 1) {
        play.champion = play.winners[0];
        finishPlay();
        return;
      }
      play.roundItems = shuffle(play.winners);
      play.winners = [];
      play.bracketRound++;
    }
    const a = play.roundItems.pop();
    const b = play.roundItems.pop();
    play.currentPair = [a, b];
    renderTournamentPlay();
  }

  function renderTournamentPlay() {
    const t = getTest(play.testId);
    const [a, b] = play.currentPair;
    $('#app').innerHTML = `<div class="wrap narrow">
      <div class="play-head"><a href="#/test/${esc(t.id)}" class="muted small">← Выйти</a><span class="badge">Раунд ${play.bracketRound}</span></div>
      <p class="muted small center" style="margin-bottom:24px">Выберите лучший вариант. Остальные вылетают.</p>
      <div class="tournament-container">
        ${[a,b].map(x=>`<div class="tournament-item" data-aid="${esc(x.id)}">
          ${x.image ? `<img src="${esc(x.image)}" alt="">` : ''}
          <h3>${esc(x.text)}</h3>
        </div>`).join('')}
      </div>
    </div>`;
    $$('.tournament-item').forEach(el => {
      el.addEventListener('click', () => {
        const winner = play.currentPair.find(x => x.id === el.dataset.aid);
        play.winners.push(winner);
        nextTournamentPair();
      });
    });
  }

  function curQuestion(){
    const t=getTest(play.testId);
    return t.mode==='tree'?play.questions.find(x=>x.id===play.currentNodeId):play.questions[play.index];
  }

  /* =========================================================
     НОВЫЕ ТИПЫ ВОПРОСОВ: «соединение» и «сборка из блоков»
     ========================================================= */
  function matchRightOrder(q) {
    play.matchOrder = play.matchOrder || {};
    if (!play.matchOrder[q.id]) {
      const ids = q.answers.map(a => a.id);
      let arr, tries = 0;
      do { arr = shuffle(ids); tries++; } while (ids.length > 1 && arr.every((v, i) => v === ids[i]) && tries < 10);
      play.matchOrder[q.id] = arr;
    }
    return play.matchOrder[q.id].map(id => q.answers.find(a => a.id === id)).filter(Boolean);
  }

  function matchHtml(q) {
    const rights = matchRightOrder(q);
    return `<p class="muted small" style="margin:14px 0 0">Соедините пары стрелками: потяните от блока к блоку (слева направо или справа налево) либо нажмите на два блока по очереди. Нажмите на стрелку, чтобы убрать её.</p>
      <div class="match" id="match">
        <svg class="match-svg" id="match-svg"><defs><marker id="m-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker></defs></svg>
        <div class="match-cols">
          <div class="match-col">${q.answers.map(a => `<div class="match-item" data-side="L" data-id="${esc(a.id)}">${esc(a.text)}</div>`).join('')}</div>
          <div class="match-col">${rights.map(a => `<div class="match-item" data-side="R" data-id="${esc(a.id)}">${esc(a.right)}</div>`).join('')}</div>
        </div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="match-clear">Сбросить стрелки</button></div>`;
  }

  function bindMatch(q) {
    const box = $('#match'), svg = $('#match-svg');
    if (!box || !svg) return;
    const links = () => { if (!isObj(play.answers[q.id])) play.answers[q.id] = {}; return play.answers[q.id]; };
    const dirs = () => { play.dirs = play.dirs || {}; return play.dirs[q.id] || (play.dirs[q.id] = {}); };
    const items = () => Array.from(box.querySelectorAll('.match-item'));
    const el = (side, id) => items().find(i => i.dataset.side === side && i.dataset.id === id);
    let sel = null, drag = null;

    // левый блок — по правому краю, правый — по левому
    const anchor = it => {
      const br = box.getBoundingClientRect(), r = it.getBoundingClientRect();
      return [it.dataset.side === 'L' ? r.right - br.left : r.left - br.left, r.top + r.height / 2 - br.top];
    };
    const curve = (a, b, inset) => {
      const s = Math.sign(b[0] - a[0]) || 1;
      const x1 = a[0] + s * (inset || 0), x2 = b[0] - s * (inset || 0), mx = (x1 + x2) / 2;
      return `M${x1},${a[1]} C${mx},${a[1]} ${mx},${b[1]} ${x2},${b[1]}`;
    };

    function draw() {
      svg.querySelectorAll('.lk').forEach(n => n.remove());
      items().forEach(i => i.classList.remove('linked'));
      const m = links(), d = dirs();
      Object.keys(m).forEach(lid => {
        const L = el('L', lid), R = el('R', m[lid]);
        if (!L || !R) return;
        L.classList.add('linked'); R.classList.add('linked');
        const from = d[lid] === 'rl' ? R : L, to = d[lid] === 'rl' ? L : R;
        const a = anchor(from), b = anchor(to);
        svg.insertAdjacentHTML('beforeend',
          `<g class="lk" data-lid="${esc(lid)}"><path class="hit" d="${curve(a, b, 8)}"/><path class="ml" d="${curve(a, b, 0)}" marker-end="url(#m-arr)"/></g>`);
      });
    }
    const clearSel = () => { sel = null; items().forEach(i => i.classList.remove('sel')); };
    const itemAt = (x, y) => { const e = document.elementFromPoint(x, y); return e && e.closest ? e.closest('.match-item') : null; };

    function connect(a, b) {
      const L = a.dataset.side === 'L' ? a : b, R = a.dataset.side === 'R' ? a : b;
      const m = links(), d = dirs();
      Object.keys(m).forEach(k => { if (m[k] === R.dataset.id) { delete m[k]; delete d[k]; } });
      m[L.dataset.id] = R.dataset.id;
      d[L.dataset.id] = a.dataset.side === 'L' ? 'lr' : 'rl';
    }
    const dropTmp = () => {
      const t = svg.querySelector('.tmp'); if (t) t.remove();
      items().forEach(i => i.classList.remove('hv'));
      box.classList.remove('dragging');
    };

    box.addEventListener('pointerdown', e => {
      const it = e.target.closest('.match-item');
      if (!it) return;
      e.preventDefault();
      drag = { it, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
      try { it.setPointerCapture(e.pointerId); } catch {}
    });
    box.addEventListener('pointermove', e => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.moved = true;
      box.classList.add('dragging');
      const br = box.getBoundingClientRect();
      let tmp = svg.querySelector('.tmp');
      if (!tmp) { svg.insertAdjacentHTML('beforeend', '<path class="ml tmp" marker-end="url(#m-arr)"/>'); tmp = svg.querySelector('.tmp'); }
      tmp.setAttribute('d', curve(anchor(drag.it), [e.clientX - br.left, e.clientY - br.top], 0));
      items().forEach(i => i.classList.remove('hv'));
      const over = itemAt(e.clientX, e.clientY);
      if (over && over.dataset.side !== drag.it.dataset.side) over.classList.add('hv');
    });
    box.addEventListener('pointerup', e => {
      if (!drag) return;
      const d0 = drag; drag = null;
      try { d0.it.releasePointerCapture(d0.id); } catch {}
      const target = itemAt(e.clientX, e.clientY);
      dropTmp();
      if (d0.moved) {
        if (target && target.dataset.side !== d0.it.dataset.side) { connect(d0.it, target); clearSel(); draw(); }
        return;
      }
      // обычное нажатие: выбрать блок, затем блок с другой стороны
      if (sel && sel !== d0.it && sel.dataset.side !== d0.it.dataset.side) { connect(sel, d0.it); clearSel(); draw(); }
      else if (sel === d0.it) clearSel();
      else { clearSel(); sel = d0.it; sel.classList.add('sel'); }
    });
    box.addEventListener('pointercancel', () => { drag = null; dropTmp(); });
    svg.addEventListener('click', e => {
      const g = e.target.closest('.lk');
      if (!g) return;
      delete links()[g.dataset.lid]; delete dirs()[g.dataset.lid];
      draw();
    });
    $('#match-clear').addEventListener('click', () => { play.answers[q.id] = {}; play.dirs && (play.dirs[q.id] = {}); clearSel(); draw(); });

    draw();
    requestAnimationFrame(draw);
    if (window.ResizeObserver) new ResizeObserver(draw).observe(box);
    window.addEventListener('resize', draw);
  }

  function asmPoolOrder(q) {
    play.asmOrder = play.asmOrder || {};
    if (!play.asmOrder[q.id]) play.asmOrder[q.id] = shuffle(q.answers.map(a => a.id));
    return play.asmOrder[q.id].map(id => q.answers.find(a => a.id === id)).filter(Boolean);
  }
  function assembleHtml() {
    return `<p class="muted small" style="margin:14px 0 0">Соберите ответ: нажимайте на блоки по очереди. Нажмите на блок в ответе, чтобы вернуть его. Некоторые блоки могут оказаться лишними.</p>
      <div class="asm-line" id="asm-line"></div>
      <div class="asm-pool" id="asm-pool"></div>`;
  }
  function bindAssemble(q) {
    const line = $('#asm-line'), pool = $('#asm-pool');
    if (!line || !pool) return;
    const get = () => Array.isArray(play.answers[q.id]) ? play.answers[q.id] : (play.answers[q.id] = []);
    const paint = () => {
      const placed = get();
      line.innerHTML = placed.length
        ? placed.map((id, i) => { const a = q.answers.find(x => x.id === id); return a ? `<button class="asm-blk placed" data-i="${i}">${esc(a.text)}</button>` : ''; }).join('')
        : '<span class="asm-ph">Здесь будет ваш ответ</span>';
      pool.innerHTML = asmPoolOrder(q).map(a => `<button class="asm-blk${placed.includes(a.id) ? ' used' : ''}" data-id="${esc(a.id)}">${esc(a.text)}</button>`).join('');
    };
    pool.addEventListener('click', e => {
      const b = e.target.closest('.asm-blk');
      if (!b || b.classList.contains('used')) return;
      get().push(b.dataset.id); paint();
    });
    line.addEventListener('click', e => {
      const b = e.target.closest('.asm-blk');
      if (!b) return;
      get().splice(+b.dataset.i, 1); paint();
    });
    paint();
  }

  // текстовое представление ответа игрока / правильного ответа (для разбора)
  function mineText(q, resp) {
    if (q.type === 'text') return String(resp || '').trim();
    if (q.type === 'sort') {
      const m = isObj(resp) ? resp : {};
      const cats = q.categories || [];
      const parts = cats.map(c => { const it = q.answers.filter(a => m[a.id] === c.id).map(a => a.text); return it.length ? `${c.text}: ${it.join(', ')}` : null; }).filter(Boolean);
      const left = q.answers.filter(a => !cats.some(c => c.id === m[a.id])).map(a => a.text);
      if (left.length) parts.push('не распределено: ' + left.join(', '));
      return parts.join('; ');
    }
    if (q.type === 'scale') return typeof resp === 'number' ? fmtNum(resp) : '';
    if (q.type === 'swipe') return resp === true ? 'Верно' : resp === false ? 'Неверно' : '';
    if (q.type === 'match') {
      const m = isObj(resp) ? resp : {};
      return q.answers.map(a => { const r = q.answers.find(x => x.id === m[a.id]); return r ? `${a.text} → ${r.right}` : null; }).filter(Boolean).join('; ');
    }
    const texts = (Array.isArray(resp) ? resp : []).map(id => (q.answers.find(a => a.id === id) || {}).text || '').filter(Boolean);
    return q.type === 'assemble' ? texts.join(' | ') : texts.join(', ');
  }

  /* =========================================================
     ТИПЫ ВОПРОСОВ: «сортировка», «шкала», «свайп»
     ========================================================= */
  const fmtNum = v => String(Number((+v).toFixed(6)));
  const scaleTol = sc => (sc.max - sc.min) * sc.tolerance / 100; // погрешность — в процентах от диапазона шкалы

  /* ---------- Сортировка ---------- */
  function sortPoolOrder(q) {
    play.sortOrder = play.sortOrder || {};
    if (!play.sortOrder[q.id]) play.sortOrder[q.id] = shuffle(q.answers.map(a => a.id));
    return play.sortOrder[q.id].map(id => q.answers.find(a => a.id === id)).filter(Boolean);
  }
  function sortHtml(q) {
    return `<p class="muted small" style="margin:14px 0 0">Перетащите карточки из нижней части в нужные корзины. Можно и по нажатию: сначала карточка, затем корзина. Чтобы вернуть карточку вниз, перетащите её обратно.</p>
      <div class="sort" id="sort">
        <div class="sort-bins">${(q.categories || []).map(c => `<div class="sort-bin" data-cat="${esc(c.id)}"><div class="sort-bin-h">${esc(c.text)}</div><div class="sort-bin-body"></div></div>`).join('')}</div>
        <div class="sort-pool-wrap"><div class="sort-pool-h">Карточки</div><div class="sort-pool" data-cat=""></div></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="sort-clear">Вернуть все карточки вниз</button></div>`;
  }
  function bindSort(q) {
    const root = $('#sort');
    if (!root) return;
    const get = () => { if (!isObj(play.answers[q.id])) play.answers[q.id] = {}; return play.answers[q.id]; };
    const validCat = id => (q.categories || []).some(c => c.id === id);
    const zones = () => Array.from(root.querySelectorAll('.sort-bin, .sort-pool'));
    const bodyOf = z => z.classList.contains('sort-pool') ? z : z.querySelector('.sort-bin-body');
    const zoneAt = (x, y) => { const e = document.elementFromPoint(x, y); const z = e && e.closest ? e.closest('.sort-bin, .sort-pool') : null; return z && root.contains(z) ? z : null; };
    let sel = null, drag = null;

    function paint() {
      const m = get();
      zones().forEach(z => { bodyOf(z).innerHTML = ''; });
      sortPoolOrder(q).forEach(a => {
        const cat = validCat(m[a.id]) ? m[a.id] : '';
        const z = zones().find(x => x.dataset.cat === cat) || root.querySelector('.sort-pool');
        const d = document.createElement('div');
        d.className = 'sort-card' + (sel === a.id ? ' sel' : '');
        d.dataset.id = a.id;
        d.textContent = a.text;
        bodyOf(z).appendChild(d);
      });
    }
    function move(id, cat) {
      const m = get();
      if (cat) m[id] = cat; else delete m[id];
      sel = null;
      paint();
    }
    const dropGhost = () => {
      if (drag && drag.ghost) drag.ghost.remove();
      zones().forEach(z => z.classList.remove('over'));
    };

    root.addEventListener('pointerdown', e => {
      const card = e.target.closest('.sort-card');
      if (!card) return;
      e.preventDefault();
      drag = { id: card.dataset.id, card, x: e.clientX, y: e.clientY, moved: false, ghost: null };
    });
    root.addEventListener('pointermove', e => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      if (!drag.moved) {
        drag.moved = true;
        const g = drag.card.cloneNode(true);
        g.className = 'sort-card sort-ghost';
        g.style.width = drag.card.offsetWidth + 'px';
        document.body.appendChild(g);
        drag.ghost = g;
        drag.card.classList.add('dragging');
      }
      drag.ghost.style.left = (e.clientX - drag.ghost.offsetWidth / 2) + 'px';
      drag.ghost.style.top = (e.clientY - drag.ghost.offsetHeight / 2) + 'px';
      zones().forEach(z => z.classList.remove('over'));
      const z = zoneAt(e.clientX, e.clientY);
      if (z) z.classList.add('over');
    });
    const finish = e => {
      if (!drag) return;
      const d0 = drag;
      const z = d0.moved ? zoneAt(e.clientX, e.clientY) : null;
      dropGhost();
      drag = null;
      if (d0.moved) {
        if (z) move(d0.id, z.dataset.cat); else paint();
        return;
      }
      // обычное нажатие: выбрать карточку / снять выбор
      sel = sel === d0.id ? null : d0.id;
      paint();
    };
    root.addEventListener('pointerup', finish);
    root.addEventListener('pointercancel', () => { dropGhost(); drag = null; paint(); });
    // нажатие на корзину при выбранной карточке
    root.addEventListener('click', e => {
      if (!sel || e.target.closest('.sort-card')) return;
      const z = e.target.closest('.sort-bin, .sort-pool');
      if (z) move(sel, z.dataset.cat);
    });
    $('#sort-clear').addEventListener('click', () => { play.answers[q.id] = {}; sel = null; paint(); });
    paint();
  }

  /* ---------- Шкала ---------- */
  function scaleHtml(q) {
    const sc = q.scale;
    const cur = typeof play.answers[q.id] === 'number' ? play.answers[q.id] : null;
    return `<div class="scale">
      <div class="scale-val"><input type="number" id="scale-num" class="scale-num ${cur === null ? 'empty' : ''}" inputmode="decimal" min="${sc.min}" max="${sc.max}" step="any" value="${cur === null ? '' : fmtNum(cur).replace(/\s/g,'').replace(',', '.')}" aria-label="Ваш ответ"></div>
      <input type="range" id="scale-range" class="scale-range" min="${sc.min}" max="${sc.max}" step="${sc.step}" value="${cur === null ? (sc.min + sc.max) / 2 : cur}">
      <div class="scale-ends"><span>${fmtNum(sc.min)}</span><span>${fmtNum(sc.max)}</span></div>
      <p class="muted small" style="text-align:center;margin:8px 0 0">Двигайте ползунок или введите число от ${fmtNum(sc.min)} до ${fmtNum(sc.max)}</p>
    </div>`;
  }
  function bindScale(q) {
    const r = $('#scale-range'), v = $('#scale-num');
    if (!r || !v) return;
    const sc = q.scale;
    const fmtIn = n => String(Number(n.toFixed(6)));
    const recRange = () => { const n = Number(r.value); play.answers[q.id] = n; v.value = fmtIn(n); v.classList.remove('empty', 'bad'); };
    r.addEventListener('input', recRange);
    r.addEventListener('change', recRange);
    r.addEventListener('pointerup', recRange); // нажатие без сдвига тоже фиксирует значение
    v.addEventListener('input', () => {
      const n = parseFloat(String(v.value).replace(',', '.'));
      if (v.value === '') { delete play.answers[q.id]; v.classList.add('empty'); v.classList.remove('bad'); return; }
      v.classList.remove('empty');
      if (Number.isFinite(n) && n >= sc.min && n <= sc.max) { play.answers[q.id] = n; r.value = n; v.classList.remove('bad'); }
      else v.classList.add('bad'); // вне диапазона — пока не засчитываем
    });
    v.addEventListener('change', () => {
      const n = parseFloat(String(v.value).replace(',', '.'));
      if (!Number.isFinite(n)) { delete play.answers[q.id]; v.value = ''; v.classList.add('empty'); v.classList.remove('bad'); return; }
      const c = Math.min(sc.max, Math.max(sc.min, n));
      play.answers[q.id] = c; v.value = fmtIn(c); r.value = c; v.classList.remove('bad', 'empty');
    });
    v.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); v.blur(); } });
  }

  /* ---------- Свайп ---------- */
  function swipeHtml(q) {
    const cur = play.answers[q.id];
    return `<div class="swipe-wrap">
      <div class="swipe-card" id="swipe-card">
        <span class="swipe-tag yes">ВЕРНО</span><span class="swipe-tag no">НЕВЕРНО</span>
        ${q.image ? `<img src="${esc(q.image)}" class="q-img" alt="" draggable="false">` : ''}
        <div class="swipe-text">${esc(q.text)}</div>
        ${typeof cur === 'boolean' ? `<div class="badge">Ваш ответ: ${cur ? 'Верно' : 'Неверно'}</div>` : ''}
      </div>
      <p class="muted small" style="text-align:center;margin:12px 0">Смахните карточку вправо — «Верно», влево — «Неверно». Или нажмите кнопку / стрелку на клавиатуре.</p>
      <div class="row center">
        <button class="btn big swipe-btn no ${cur === false ? 'active-vote' : ''}" id="swipe-no">✗ Неверно</button>
        <button class="btn big swipe-btn yes ${cur === true ? 'active-vote' : ''}" id="swipe-yes">✓ Верно</button>
      </div>
    </div>`;
  }
  function bindSwipe(q) {
    const card = $('#swipe-card');
    if (!card) return;
    const TH = 90;
    let done = false, drag = null;
    const commit = val => {
      if (done || !play) return;
      done = true;
      play.answers[q.id] = val;
      card.style.transition = 'transform .28s ease, opacity .28s';
      card.style.transform = `translateX(${val ? 600 : -600}px) rotate(${val ? 25 : -25}deg)`;
      card.style.opacity = '0';
      // после ответа сразу идём дальше (те же проверки, что у кнопки «Далее» / «Завершить»)
      setTimeout(() => { const b = $('#next') || $('#finish'); if (b) b.click(); }, 260);
    };
    card.addEventListener('pointerdown', e => {
      if (done) return;
      drag = { x: e.clientX, dx: 0 };
      card.style.transition = 'none';
      try { card.setPointerCapture(e.pointerId); } catch {}
    });
    card.addEventListener('pointermove', e => {
      if (!drag) return;
      drag.dx = e.clientX - drag.x;
      card.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 18}deg)`;
      card.classList.toggle('lean-yes', drag.dx > 0);
      card.classList.toggle('lean-no', drag.dx < 0);
      card.style.setProperty('--k', Math.min(1, Math.abs(drag.dx) / TH));
    });
    const end = () => {
      if (!drag) return;
      const dx = drag.dx;
      drag = null;
      card.classList.remove('lean-yes', 'lean-no');
      if (Math.abs(dx) >= TH) commit(dx > 0);
      else { card.style.transition = 'transform .2s'; card.style.transform = ''; card.style.setProperty('--k', 0); }
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
    $('#swipe-yes').addEventListener('click', () => commit(true));
    $('#swipe-no').addEventListener('click', () => commit(false));
    if (play.keyFn) document.removeEventListener('keydown', play.keyFn);
    play.keyFn = e => {
      if (!$('#swipe-card') || (e.target && e.target.matches && e.target.matches('input,textarea,select'))) return;
      if (e.key === 'ArrowRight') commit(true); else if (e.key === 'ArrowLeft') commit(false);
    };
    document.addEventListener('keydown', play.keyFn);
  }

  function renderPlay(){
    if(play&&play.keyFn){document.removeEventListener('keydown',play.keyFn);play.keyFn=null}
    const t=getTest(play.testId);if(!t){play=null;location.hash='#/';return}
    let q,total,pct,displayIndex;
    if(t.mode==='tree'){
      q=curQuestion();
      if(!q){finishPlay();return;}
      total=play.history.length;displayIndex=total;pct=100;
    } else {
      q=curQuestion();
      if(!q){finishPlay();return}
      total=play.questions.length;displayIndex=play.index+1;pct=Math.round((play.index/total)*100);
      play.maxIndex=Math.max(play.maxIndex,play.index);
    }

    let nextBtn = '';
    if (t.mode === 'tree') {
      nextBtn = `<button class="btn primary" id="next-step">Следующий шаг →</button>`;
    } else {
      nextBtn = play.index === total - 1
        ? `<button class="btn primary" id="finish">Завершить</button>`
        : `<button class="btn primary" id="next">Далее →</button>`;
    }
    // назад можно вернуться максимум на 2 вопроса от самого дальнего
    const prevDisabled = play.index === 0 || (play.index - 1) < (play.maxIndex - 2);

    const body = q.type==='text'
      ? `<input class="input" id="text-answer" maxlength="200" autocomplete="off" placeholder="Введите ответ" style="margin-top:16px" value="${esc(play.answers[q.id]||'')}">`
      : q.type==='match' ? matchHtml(q)
      : q.type==='assemble' ? assembleHtml()
      : q.type==='sort' ? sortHtml(q)
      : q.type==='scale' ? scaleHtml(q)
      : q.type==='swipe' ? swipeHtml(q)
      : `<div class="answers" id="answers">${q.answers.map(a=>`<button class="answer" data-aid="${esc(a.id)}">${esc(a.text)}</button>`).join('')}</div>`;

    $('#app').innerHTML=`<div class="wrap narrow">
      <div class="play-head"><a href="#/test/${esc(t.id)}" class="muted small">← Выйти</a><span id="timer">${isTimed(t) ? fmtTime(play.timeLeft * 1000) : t.mode === 'diagram' ? '' : fmtTime(Date.now() - play.start)}</span></div>
      <div class="progress"><div class="bar" style="width:${t.mode==='tree' ? 100 : pct}%"></div></div>
      <p class="muted small">${t.mode==='tree' ? 'Шаг ' + displayIndex : 'Вопрос ' + displayIndex + ' из ' + total}</p>
      <div class="card">
        ${q.type==='swipe'?'':`<h2>${esc(q.text)}</h2>
        ${q.image?`<img src="${esc(q.image)}" class="q-img" alt="">`:''}`}
        ${body}
      </div>
      <div class="row between" style="margin-top:16px">
        ${t.mode!=='tree' ? `<button class="btn ghost" id="prev" ${prevDisabled?'disabled':''}>← Назад</button>` : `<div></div>`}
        ${nextBtn}
      </div>
    </div>`;
    updateAnswerUI();bindPlay();
    if(q.type==='match')bindMatch(q);else if(q.type==='assemble')bindAssemble(q);
    else if(q.type==='sort')bindSort(q);else if(q.type==='scale')bindScale(q);else if(q.type==='swipe')bindSwipe(q);
  }

  function updateAnswerUI(){
    const q=curQuestion();
    if(!q||['text','match','assemble','sort','scale','swipe'].includes(q.type))return;
    const sel=play.answers[q.id]||[];
    $$('#answers .answer').forEach(b=>b.classList.toggle('selected',sel.includes(b.dataset.aid)))
  }

  function bindPlay(){
    const t=getTest(play.testId);
    const q=curQuestion();
    if(!q)return;

    const answersEl = $('#answers');
    if(answersEl) {
      answersEl.addEventListener('click',e=>{
        const btn=e.target.closest('.answer');if(!btn)return;
        const aid=btn.dataset.aid;
        if(q.type==='single' || t.mode==='tree'){
          play.answers[q.id]=[aid];
        } else {
          const arr=(play.answers[q.id]||[]).slice();
          const i=arr.indexOf(aid);
          if(i>=0)arr.splice(i,1);else arr.push(aid);
          play.answers[q.id]=arr;
        }
        updateAnswerUI();
      });
    }

    const ti=$('#text-answer');
    if(ti){
      ti.addEventListener('input',()=>{play.answers[q.id]=ti.value});
      ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=$('#next')||$('#finish');if(b)b.click()}});
      setTimeout(()=>ti.focus(),0);
    }

    const n=$('#next'),p=$('#prev'),f=$('#finish'),ns=$('#next-step');

    // «Выживание»: неверный ответ завершает игру — и на «Далее», и на «Завершить» (и по Enter, он жмёт эти же кнопки)
    const survivalOk = () => {
      if (t.mode === 'survival' && !gradeQuestion(q, play.answers[q.id])) {
        toast('Ошибка! Выживание окончено.', 'warn');
        finishPlay();
        return false;
      }
      return true;
    };

    if(n) n.addEventListener('click', () => {
      if (!survivalOk()) return;
      play.index++; renderPlay();
    });

    if(p)p.addEventListener('click',()=>{
      if(play.index===0||(play.index-1)<(play.maxIndex-2))return;
      play.index--;renderPlay();
    });
    if(f)f.addEventListener('click',()=>{ if (!survivalOk()) return; finishPlay(); });

    if (ns) {
      ns.addEventListener('click', () => {
        const selectedId = (play.answers[q.id] || [])[0];
        if (!selectedId) { toast('Выберите вариант ответа', 'warn'); return; }
        const ans = q.answers.find(a => a.id === selectedId);

        if (ans && ans.nextId) {
          if (ans.nextId.startsWith('E_')) {
            const endingId = ans.nextId.slice(2);
            const ending = (t.endings || []).find(e => e.id === endingId);
            endGame({ testId: t.id, title: t.title, mode: t.mode, ending: ending || { title: 'Конец', desc: '' }, time: Date.now() - play.start });
            return;
          } else if (ans.nextId.startsWith('Q_')) {
            play.currentNodeId = ans.nextId.slice(2);
            play.history.push(play.currentNodeId);
            renderPlay(); return;
          }
        }

        const currentIndex = play.questions.findIndex(x => x.id === q.id);
        if (currentIndex >= 0 && currentIndex < play.questions.length - 1) {
          play.currentNodeId = play.questions[currentIndex + 1].id;
          play.history.push(play.currentNodeId);
          renderPlay();
        } else {
          const fallbackEnding = (t.endings && t.endings.length > 0) ? t.endings[0] : { title: 'Конец', desc: '' };
          endGame({ testId: t.id, title: t.title, mode: t.mode, ending: fallbackEnding, time: Date.now() - play.start });
        }
      });
    }
  }

  function finishPlay(){
    if (!play) return;
    const t=getTest(play.testId);
    if (!t) { location.hash = '#/'; return; }
    const time = Date.now() - play.start;

    if(t.mode==='tournament'){
      const winner = play.champion || play.currentPair[0];
      endGame({ testId: t.id, title: t.title, mode: t.mode, winner, time });
      return;
    }

    if(t.mode==='tree'){
      const fallbackEnding = (t.endings && t.endings.length > 0) ? t.endings[0] : { title: 'Конец', desc: 'Вы завершили прохождение.' };
      endGame({ testId: t.id, title: t.title, mode: t.mode, ending: fallbackEnding, time });
      return;
    }

    if(t.mode==='diagram'){
      play.questions.forEach(q=>{
        (play.answers[q.id]||[]).forEach(aid=>{
          const ans=q.answers.find(a=>a.id===aid);
          if(ans && ans.points){
            Object.entries(ans.points).forEach(([endId, val])=>{
              play.scores[endId] = (play.scores[endId] || 0) + Number(val);
            });
          }
        });
      });
      let maxId = Object.keys(play.scores)[0];
      let maxVal = -1;
      Object.entries(play.scores).forEach(([id, val]) => { if(val > maxVal) { maxVal = val; maxId = id; } });
      const winnerEnding = (t.endings || []).find(e => e.id === maxId) || (t.endings && t.endings.length > 0 ? t.endings[0] : { title: 'Нет данных', desc: '' });
      endGame({testId:t.id,title:t.title,mode:t.mode,scores:play.scores,winner:winnerEnding,time});
      return;
    }

    let correct=0;
    const review=play.questions.map(q=>{
      const resp=play.answers[q.id];
      const ok=gradeQuestion(q,resp);
      if(ok)correct++;
      const sel=q.type==='text'?String(resp||''):(q.type==='match'||q.type==='sort')?{...(isObj(resp)?resp:{})}:q.type==='scale'?(typeof resp==='number'?resp:null):q.type==='swipe'?(typeof resp==='boolean'?resp:null):(Array.isArray(resp)?resp.slice():[]);
      const right=q.answers.filter(a=>a.correct).map(a=>a.id);
      return{q,sel,right,ok};
    });
    // компактные данные для ссылки: по порядку оригинальных вопросов
    const share=t.questions.map(oq=>{
      const it=review.find(x=>x.q.id===oq.id);
      if(oq.type==='text')return it?String(it.sel).slice(0,120):'';
      if(oq.type==='sort'){const m=it&&isObj(it.sel)?it.sel:{};return oq.answers.map(a=>(oq.categories||[]).findIndex(c=>c.id===m[a.id]))}
      if(oq.type==='scale')return [it&&typeof it.sel==='number'?it.sel:null];
      if(oq.type==='swipe')return [it&&it.sel===true?1:it&&it.sel===false?0:-1];
      if(oq.type==='match'){const m=it&&isObj(it.sel)?it.sel:{};return oq.answers.map(a=>oq.answers.findIndex(x=>x.id===m[a.id]))}
      if(!it)return [];
      return it.sel.map(id=>oq.answers.findIndex(a=>a.id===id)).filter(i=>i>=0);
    });
    const total=t.questions.length,percent=total>0?Math.round((correct/total)*100):0;
    endGame({testId:t.id,title:t.title,mode:t.mode,correct,total,percent,review,share,time});
  }

  /* =========================================================
     FEEDBACK (после теста: оценка + необязательный комментарий)
     ========================================================= */
  // Оценивать могут только зарегистрированные и не авторы теста; комментировать — зарегистрированные
  function fbPerms(testId){
    const t=getTest(testId);
    return { t, canVote: !!t && !state.user.isGuest && t.authorId!==state.user.id, canComment: !!t && !state.user.isGuest };
  }

  function viewFeedback(){
    const r=getLastResult();
    if(!r) return `<div class="wrap"><p class="muted">Результат не найден.</p><a class="btn" href="#/">На главную</a></div>`;
    const voted = myVote(r.testId);
    const { canVote, canComment } = fbPerms(r.testId);
    return `<div class="wrap narrow">
      <div class="card big center">
        <div style="font-size:48px">🎉</div>
        <h1>Тест пройден!</h1>
        <p class="muted">${esc(r.title)}</p>
        ${canVote ? `<h3 style="margin-top:24px">Оцените тест</h3>
        <div class="row center">
          <button class="btn ghost big ${voted==='like'?'active-vote':''}" data-vote="like">👍 Нравится</button>
          <button class="btn ghost big ${voted==='dislike'?'active-vote':''}" data-vote="dislike">👎 Не нравится</button>
        </div>` : `<p class="muted small" style="margin-top:24px">${state.user.isGuest
          ? 'Оценивать и комментировать тесты могут только зарегистрированные пользователи. <a href="#/profile" style="color:var(--accent)">Войти / Регистрация</a>'
          : 'Свой тест оценивать нельзя.'}</p>`}
        ${canComment ? `<div style="margin-top:20px;text-align:left">
          <label class="label">Комментарий (по желанию)</label>
          <textarea class="input" id="fb-comment" rows="3" maxlength="500" placeholder="Что думаете о тесте?"></textarea>
        </div>` : ''}
        <button class="btn primary big" id="show-result" style="margin-top:20px;width:100%">Показать результат</button>
      </div>
    </div>`;
  }

  function bindFeedback(){
    const r=getLastResult();if(!r)return;
    $$('[data-vote]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const type=btn.dataset.vote;
        const t=getTest(r.testId);
        if(!t){toast('Тест уже удалён','warn');return}
        const next = myVote(t.id) === type ? null : type;
        if (await castVote(t.id, next)) {
          $$('[data-vote]').forEach(b => b.classList.toggle('active-vote', b.dataset.vote === next));
          toast(next ? 'Оценка сохранена' : 'Оценка снята', 'good');
        }
      });
    });
    const sb=$('#show-result');
    sb.addEventListener('click',async()=>{
      const { t, canVote, canComment } = fbPerms(r.testId);
      if(canVote && !myVote(t.id)){toast('Сначала оцените тест','warn');return}
      const txt=(($('#fb-comment')||{}).value||'').trim();
      sb.disabled=true;
      if(t && txt && canComment){
        if(!(await postComment(r.testId, txt))){ sb.disabled=false; return; }
      }
      location.hash='#/result';
    });
  }

  /* =========================================================
     RESULT
     ========================================================= */
  function reviewItemHtml(q, i, ok, mine, right){
    return `<div class="card review ${ok?'ok':'bad'}">
      <div class="row between"><b>${i+1}. ${esc(q.text)}</b><span class="badge ${ok?'good':'wrong'}">${ok?'✓':'✗'}</span></div>
      <p class="small"><span class="muted">Ответ:</span> ${mine?esc(mine):'<i>нет ответа</i>'}</p>
      ${ok?'':`<p class="small"><span class="muted">Правильный ответ:</span> ${esc(right)}</p>`}
    </div>`;
  }
  const answerTexts=(q,ids)=>ids.map(id=>q.answers.find(a=>a.id===id)?.text||'').filter(Boolean).join(', ');
  const rightText=q=>{
    if(q.type==='text')return q.answers.map(a=>a.text).join(' / ');
    if(q.type==='match')return q.answers.map(a=>`${a.text} → ${a.right}`).join('; ');
    if(q.type==='assemble')return q.answers.filter(a=>a.correct).map(a=>a.text).join(' | ');
    if(q.type==='sort')return (q.categories||[]).map(c=>`${c.text}: ${q.answers.filter(a=>a.cat===c.id).map(a=>a.text).join(', ')}`).join('; ');
    if(q.type==='scale'){const sc=q.scale,t=scaleTol(sc);return t>0?`${fmtNum(sc.correct)} (допустимо ${fmtNum(Math.max(sc.min,sc.correct-t))}–${fmtNum(Math.min(sc.max,sc.correct+t))})`:fmtNum(sc.correct)}
    if(q.type==='swipe')return q.truth!==false?'Верно':'Неверно';
    return q.answers.filter(a=>a.correct).map(a=>a.text).join(', ');
  };

  const isSharedParams = p => !!p.get('id') && !!(p.get('d') || p.get('e') || p.get('w'));

  function viewSharedResult(params){
    const test = getTest(params.get('id'));
    if (!test) return `<div class="wrap"><h1>Тест не найден</h1><p class="muted">Возможно, автор удалил его.</p><a class="btn" href="#/">На главную</a></div>`;

    // режимы «Древо», «Диаграмма» (e = id концовки) и «Турнир» (w = id победителя)
    if (params.get('e') || params.get('w')) {
      const nm = (params.get('n')||'').slice(0,40);
      const who = nm ? `Игрок <b>${esc(nm)}</b>` : 'Игрок';
      const isWinner = !!params.get('w');
      const item = isWinner
        ? test.questions.find(x => x.id === params.get('w'))
        : (test.endings||[]).find(x => x.id === params.get('e'));
      if (!item) return `<div class="wrap"><h1>Результат не найден</h1><p class="muted">Тест мог быть изменён автором.</p><a class="btn" href="#/test/${esc(test.id)}">Открыть тест</a></div>`;
      const title = isWinner ? item.text : item.title;
      const desc = isWinner ? '' : item.desc;
      const img = safeImg(item.image) ? `<img src="${esc(item.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : '';
      const lead = isWinner ? `${who} выбрал победителем турнира «${esc(test.title)}»` : `${who} прошёл «${esc(test.title)}» и получил результат`;
      return `<div class="wrap narrow"><div class="card center">
        <p class="muted">${lead}</p>
        ${img}
        <h1 style="color:var(--accent)">${esc(title)}</h1>
        ${desc ? `<p style="margin:16px auto;max-width:600px;white-space:pre-wrap">${esc(desc)}</p>` : ''}
        <div class="row center" style="margin-top:24px">
          <a class="btn primary" href="#/test/${esc(test.id)}">Пройти тест</a>
          <a class="btn ghost" href="#/">Все тесты</a>
        </div>
      </div></div>`;
    }

    let details=null;
    try{details=JSON.parse(b64uDec(params.get('d')||''))}catch{}
    if(!Array.isArray(details)) return `<div class="wrap"><h1>Ссылка повреждена</h1><a class="btn" href="#/test/${esc(test.id)}">Открыть тест</a></div>`;

    let correct=0;
    const items=test.questions.map((q,i)=>{
      const raw=details[i];
      let resp;
      if(q.type==='text'){resp=typeof raw==='string'?raw:''}
      else if(q.type==='match'){resp={};(Array.isArray(raw)?raw:[]).forEach((ri,i)=>{if(Number.isInteger(ri)&&q.answers[i]&&q.answers[ri])resp[q.answers[i].id]=q.answers[ri].id})}
      else if(q.type==='sort'){resp={};(Array.isArray(raw)?raw:[]).forEach((ci,i)=>{if(Number.isInteger(ci)&&q.answers[i]&&(q.categories||[])[ci])resp[q.answers[i].id]=q.categories[ci].id})}
      else if(q.type==='scale'){resp=Array.isArray(raw)&&typeof raw[0]==='number'?raw[0]:null}
      else if(q.type==='swipe'){resp=Array.isArray(raw)?(raw[0]===1?true:raw[0]===0?false:null):null}
      else{resp=(Array.isArray(raw)?raw:[]).map(ix=>q.answers[ix]?.id).filter(Boolean)}
      const mine=mineText(q,resp);
      const ok=gradeQuestion(q,resp);if(ok)correct++;
      return reviewItemHtml(q,i,ok,mine,rightText(q));
    });
    const total=test.questions.length;
    const p=total?Math.round(correct/total*100):0;
    const name=(params.get('n')||'').slice(0,40);
    const tm=parseInt(params.get('tm'))||0;
    return `<div class="wrap narrow">
      <div class="card center">
        <p class="muted">${name?`Результат игрока <b>${esc(name)}</b>`:'Результат прохождения'}</p>
        <h1>${esc(test.title)}</h1>
        <div class="score-circle" style="--p:${p}"><span>${p}%</span></div>
        <h2>Правильно ${correct} из ${total}</h2>
        <p class="muted">Время: ${fmtTime(tm*1000)}</p>
        <div class="row center" style="margin-top:16px">
          <a class="btn primary" href="#/test/${esc(test.id)}">Пройти тест</a>
          <a class="btn ghost" href="#/">Все тесты</a>
        </div>
      </div>
      <h3 style="margin-top:24px">Разбор ответов</h3>
      ${items.join('')}
    </div>`;
  }

  function viewResult(params){
    if (isSharedParams(params)) return viewSharedResult(params);

    const r=getLastResult();
    if(!r) return `<div class="wrap"><p class="muted">Результат не найден.</p><a class="btn" href="#/">На главную</a></div>`;

    let main='';
    const buttons = `<div class="row center" style="margin-top:24px">
        <button class="btn primary" id="share-result-link">🔗 Скопировать ссылку</button>
        <a class="btn ghost" href="#/">К тестам</a>
      </div>`;

    if(r.mode === 'tree') {
      const ending = r.ending || { title: 'Конец', desc: '' };
      main = `<div class="card center">
        <p class="muted" style="margin-bottom:24px">Финал истории</p>
        ${safeImg(ending.image) ? `<img src="${esc(ending.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : ''}
        <h1 style="color:var(--accent)">${esc(ending.title)}</h1>
        <p style="font-size:16px;margin:24px auto;line-height:1.6;max-width:600px;white-space:pre-wrap">${esc(ending.desc)}</p>
        ${buttons}
      </div>`;
    } else if (r.mode === 'tournament') {
      const winner = r.winner || { text: 'Нет данных', image: '' };
      main = `<div class="card center">
        <h1>Победитель турнира</h1>
        ${safeImg(winner.image) ? `<img src="${esc(winner.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : ''}
        <h2 style="color:var(--accent);margin-top:20px">${esc(winner.text)}</h2>
        ${buttons}
      </div>`;
    } else if(r.mode==='diagram'){
      const winner = r.winner || { title: 'Нет данных', desc: '' };
      main=`<div class="card center">
        <h1>Твой результат</h1>
        <p class="muted">${esc(r.title)}</p>
        ${safeImg(winner.image) ? `<img src="${esc(winner.image)}" alt="" style="max-width:100%;max-height:300px;border-radius:12px;margin:16px auto;display:block">` : ''}
        <h2 style="color:var(--accent)">Ты — <span class="grad">${esc(winner.title)}</span>!</h2>
        ${winner.desc ? `<p style="margin:16px auto;max-width:600px;white-space:pre-wrap">${esc(winner.desc)}</p>` : ''}
        ${buttons}
      </div>`;
    } else {
      const msg=r.percent>=90?'Блестяще! 🏆':r.percent>=70?'Отлично! 🎉':r.percent>=50?'Неплохо 💪':'Повтори 📚';
      main=`<div class="card center">
        <p class="muted">${esc(r.title)}</p>
        <div class="score-circle" style="--p:${r.percent}"><span>${r.percent}%</span></div>
        <h2>${msg}</h2>
        <p class="muted">Правильно ${r.correct} из ${r.total}</p>
        <p class="muted small">Время: ${fmtTime(r.time)}</p>
        ${buttons}
      </div>
      <h3>Разбор</h3>
      ${(r.review||[]).map((it,i)=>{
        const q=it.q;
        const mine=mineText(q,it.sel);
        return reviewItemHtml(q,i,it.ok,mine,rightText(q));
      }).join('')}`;
    }
    return `<div class="wrap wide"><div class="result-layout"><div class="result-main">${main}</div><div class="result-sidebar sidebar-sticky"><div class="sidebar-comments" id="comments-box"><h3>Загрузка...</h3></div></div></div></div>`;
  }

  function bindResult(params){
    if (isSharedParams(params)) return;
    const r=getLastResult();if(!r)return;

    const shareLink=$('#share-result-link');
    if(shareLink)shareLink.addEventListener('click',async ()=>{
      const url = makeShareUrl(r);
      if(navigator.share) {
        try { await navigator.share({title:'Мой результат',text:`Я прошёл «${r.title}»!`,url}); return; } catch(e) { if(e && e.name==='AbortError') return; }
      }
      toast((await copyText(url)) ? 'Ссылка скопирована ✓' : 'Не удалось скопировать', 'good');
    });

    mountComments(r.testId, true);
    if(r.percent>=70&&['standard','scale','swipe','sort'].includes(r.mode))confetti();
  }

  function confetti(){const c=['#a855f7','#ec4899','#22c55e','#f59e0b','#3b82f6'];for(let i=0;i<80;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.animationDelay=(Math.random()*0.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}

  /* =========================================================
     EDITOR
     ========================================================= */
  function blankDraft(){return { id:null, title:'', description:'', mode:'standard', categories:[], endings:[], questions:[newQuestion()], previewImage:null, timeLimit:60, tags:[], customTags:[], useTimer:false, shuffleQuestions:false, shuffleAnswers:false };}

  function startEditor(id){
    if (id) {
      const t = getTest(id);
      if (t && t.authorId !== state.user.id) { toast('Редактировать можно только свои тесты','warn'); location.hash = '#/test/' + encodeURIComponent(id); return; }
      draft = t ? JSON.parse(JSON.stringify(t)) : null;
    } else {
      let saved = null;
      try { saved = localStorage.getItem('pikuco2.draft'); } catch {}
      if (saved) {
        if (confirm('У вас есть незаконченный тест. Восстановить его?')) {
          try { draft = JSON.parse(saved); } catch { draft = blankDraft(); }
        } else {
          try { localStorage.removeItem('pikuco2.draft'); } catch {}
          draft = blankDraft();
        }
      } else {
        draft = blankDraft();
      }
    }
    if(!draft) { location.hash = '#/'; return; }
    if(!draft.mode) draft.mode='standard';
    if(draft.mode==='diagram' && (!draft.endings||!draft.endings.length)) draft.endings=[{id:uid(),title:'Результат 1',desc:''}];
    if(!draft.endings) draft.endings=[];
    if(!draft.timeLimit) draft.timeLimit = 60;
    if(!Array.isArray(draft.tags)) draft.tags=[];
    if(!Array.isArray(draft.customTags)) draft.customTags=[];
    renderEditor();
  }

  function saveDraftState() {
    if (draft && !draft.id) {
      try { localStorage.setItem('pikuco2.draft', JSON.stringify(draft)); } catch {}
    }
  }

  function renderEditor(){
    const isDiagram=draft.mode==='diagram';
    const isTree=draft.mode==='tree';
    const isTournament=draft.mode==='tournament';
    const isTime=draft.mode==='time';
    const isScaleMode=MODE_TYPES.includes(draft.mode);

    $('#app').innerHTML=`<div class="wrap narrow">
      <a href="#/" class="muted small" id="cancel-editor">← Отмена</a>
      <div class="row between" style="margin-top:8px"><h1 style="margin:0">${draft.id?'Редактирование':'Новый тест'}</h1><button class="btn primary" id="save">Сохранить</button></div>

      <label class="label">Название (макс. 150 символов)</label>
      <input class="input" id="e-title" maxlength="150" value="${esc(draft.title)}">

      <label class="label">Описание (макс. 400 символов)</label>
      <textarea class="input" id="e-desc" rows="3" maxlength="400">${esc(draft.description)}</textarea>

      <label class="label">Превью (обложка теста) — обязательна</label>
      <div class="row">
        <input type="file" accept="image/*" id="e-preview" style="display:none">
        <button class="btn ghost sm" id="pick-preview">📷 Загрузить обложку</button>
        ${draft.previewImage ? `<button class="btn danger sm" id="del-preview">Удалить обложку</button>` : ''}
      </div>
      ${draft.previewImage ? `<img src="${esc(draft.previewImage)}" alt="" style="max-height:150px;border-radius:12px;margin-top:12px;border:1px solid var(--border)">` : ''}

      <div class="row" style="margin-top:16px">
        <div style="flex:1">
          <label class="label">Режим</label>
          <select class="input" id="e-mode">
            <option value="standard" ${draft.mode==='standard'?'selected':''}>📝 Обычный</option>
            <option value="time" ${draft.mode==='time'?'selected':''}>⏱ На время</option>
            <option value="survival" ${draft.mode==='survival'?'selected':''}>💀 Выживание</option>
            <option value="tournament" ${draft.mode==='tournament'?'selected':''}>🏆 Турнир</option>
            <option value="tree" ${draft.mode==='tree'?'selected':''}>🌳 Древо</option>
            <option value="diagram" ${draft.mode==='diagram'?'selected':''}>📊 Диаграмма</option>
            <option value="scale" ${draft.mode==='scale'?'selected':''}>🎚 Шкала</option>
            <option value="swipe" ${draft.mode==='swipe'?'selected':''}>👆 Свайп</option>
            <option value="sort" ${draft.mode==='sort'?'selected':''}>🗂 Сортировка по корзинам</option>
          </select>
        </div>
        ${(isTime || isScaleMode) ? `
        <div style="flex:1">
          ${isScaleMode ? `<label class="check" style="margin-top:30px"><input type="checkbox" id="e-usetimer" ${draft.useTimer?'checked':''}> Таймер на весь тест</label>` : ''}
          ${(isTime || draft.useTimer) ? `<label class="label">Время на тест (сек)</label>
          <input class="input" type="number" id="e-time" value="${esc(draft.timeLimit)}" min="2">` : ''}
        </div>` : ''}
      </div>
      ${draft.mode==='scale' ? '<p class="muted small" style="margin:8px 0 0">В каждом вопросе игрок выбирает число на шкале ползунком или вводит его с клавиатуры. Для каждого вопроса задайте минимум, максимум, правильное значение и погрешность.</p>' : ''}
      ${draft.mode==='sort' ? '<p class="muted small" style="margin:8px 0 0">В каждом вопросе создайте категории (корзины) и привяжите к ним карточки. Игрок должен перетащить все карточки в правильные корзины.</p>' : ''}
      ${draft.mode==='swipe' ? '<p class="muted small" style="margin:8px 0 0">В каждом вопросе — утверждение на карточке. Игрок смахивает её вправо («Верно») или влево («Неверно»).</p>' : ''}

      ${(!isTree && !isTournament) ? `
      <div class="row" style="margin-top:16px;gap:24px">
        <label class="check"><input type="checkbox" id="e-shufq" ${draft.shuffleQuestions?'checked':''}> Перемешать вопросы</label>
        ${isScaleMode ? '' : `<label class="check"><input type="checkbox" id="e-shufa" ${draft.shuffleAnswers?'checked':''}> Перемешать варианты ответа</label>`}
      </div>` : ''}

      <div id="e-tags">
        <label class="label">Темы (необязательно, до 2)</label>
        <div class="tag-row" id="e-presets"></div>
        <label class="label">Свои теги (необязательно, до 3, до 50 символов) — по ним тест можно найти через строку поиска</label>
        <div class="row"><input class="input" id="e-ctag" maxlength="50" placeholder="Например: наполеон" style="flex:1"><button class="btn ghost sm" id="e-ctag-add" type="button">Добавить</button></div>
        <div class="tag-row" id="e-ctags"></div>
      </div>

      ${(isDiagram || isTree) ? `
        <div style="margin-top:24px">
          <label class="label">Концовки / Результаты</label>
          <div id="endings-list">${renderEndingsHTML()}</div>
          <button class="btn ghost sm" id="add-ending" style="margin-top:8px">+ Добавить результат</button>
        </div>
      ` : ''}

      <div id="qlist" class="qlist" style="margin-top:24px"></div>
      <button class="btn ghost" id="add-q">+ Добавить ${isTournament?'вариант':'вопрос'}</button>

      <div class="row center" style="margin-top:32px;margin-bottom:64px">
        <button class="btn primary" id="save-bottom" style="min-width:200px">Сохранить</button>
      </div>
    </div>`;
    renderQuestions();

    $('#cancel-editor').addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('Выйти из редактора? Несохранённый новый тест останется в черновике.')) {
        saveDraftState();
        location.hash = '#/';
      }
    });

    $('#e-title').addEventListener('input',e=>{draft.title=e.target.value.slice(0,150);saveDraftState()});
    $('#e-desc').addEventListener('input',e=>{draft.description=e.target.value.slice(0,400);saveDraftState()});

    $('#pick-preview').addEventListener('click',()=>$('#e-preview').click());
    $('#e-preview').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      toast('Сжимаем обложку...', 'warn');
      new Compressor(file, {
        quality: 0.5, maxWidth: 400, maxHeight: 400,
        success(res) {
          const reader = new FileReader();
          reader.onload = ev => {
            const img = safeImg(ev.target.result);
            if (!img) { toast('Этот формат картинки не поддерживается','warn'); return; }
            draft.previewImage = img;
            saveDraftState();
            renderEditor();
            toast('Обложка добавлена ✓', 'good');
          };
          reader.readAsDataURL(res);
        },
        error() { toast('Не удалось обработать картинку','warn'); }
      });
    });

    if($('#del-preview')) $('#del-preview').addEventListener('click', () => {
      draft.previewImage = null;
      saveDraftState();
      renderEditor();
    });

    $('#e-mode').addEventListener('change',e=>{
      draft.mode=e.target.value;
      if(draft.mode==='diagram'&&(!draft.endings||!draft.endings.length))draft.endings=[{id:uid(),title:'Результат 1',desc:''}];
      if(!draft.endings)draft.endings=[];
      if(MODE_TYPES.includes(draft.mode)){
        draft.questions.forEach(q=>{q.type=draft.mode;initType(q)});
      } else {
        draft.questions.forEach(q=>{if(MODE_TYPES.includes(q.type)){q.type='single';q.answers=[newAnswer(),newAnswer()];delete q.scale;delete q.truth;delete q.categories}});
      }
      // текстовые вопросы не поддерживаются в этих режимах
      if(['diagram','tree','tournament'].includes(draft.mode)){
        draft.questions.forEach(q=>{
          if(['text','match','assemble','sort','scale','swipe'].includes(q.type)){q.type='single';q.answers.forEach(a=>{a.correct=false;delete a.right});while(q.answers.length<2)q.answers.push(newAnswer())}
        });
      }
      saveDraftState();
      renderEditor();
    });

    // теги
    const drawTags=()=>{
      $('#e-presets').innerHTML=TAGS.map(([id,l])=>`<button type="button" class="tag-chip ${draft.tags.includes(id)?'on':''}" data-ptag="${id}">${l}</button>`).join('');
      $('#e-ctags').innerHTML=draft.customTags.map((c,i)=>`<span class="tag-chip custom on">#${esc(c)} <button type="button" class="tag-x" data-ctag-del="${i}" aria-label="Убрать">✕</button></span>`).join('');
    };
    draft.tags=cleanTagList(draft.tags);draft.customTags=cleanCustomTags(draft.customTags);
    drawTags();
    $('#e-presets').addEventListener('click',e=>{
      const b=e.target.closest('[data-ptag]');if(!b)return;
      const id=b.dataset.ptag,i=draft.tags.indexOf(id);
      if(i>=0)draft.tags.splice(i,1);
      else if(draft.tags.length>=2){toast('Можно выбрать не больше 2 тем','warn');return}
      else draft.tags.push(id);
      saveDraftState();drawTags();
    });
    const addCustom=()=>{
      const inp=$('#e-ctag');
      const v=inp.value.replace(/\s+/g,' ').trim().slice(0,50);
      if(!v)return;
      if(draft.customTags.some(c=>c.toLowerCase()===v.toLowerCase())){inp.value='';return}
      if(draft.customTags.length>=3){toast('Можно добавить не больше 3 своих тегов','warn');return}
      draft.customTags.push(v);inp.value='';saveDraftState();drawTags();inp.focus();
    };
    $('#e-ctag-add').addEventListener('click',addCustom);
    $('#e-ctag').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCustom()}});
    $('#e-ctags').addEventListener('click',e=>{
      const b=e.target.closest('[data-ctag-del]');if(!b)return;
      draft.customTags.splice(+b.dataset.ctagDel,1);saveDraftState();drawTags();
    });
    if($('#e-usetimer')) $('#e-usetimer').addEventListener('change',e=>{draft.useTimer=e.target.checked;saveDraftState();renderEditor()});
    if($('#e-time')) $('#e-time').addEventListener('input',e=>{draft.timeLimit = Math.max(2,+e.target.value || 60);saveDraftState()});
    if($('#e-shufq')) $('#e-shufq').addEventListener('change',e=>{draft.shuffleQuestions=e.target.checked;saveDraftState()});
    if($('#e-shufa')) $('#e-shufa').addEventListener('change',e=>{draft.shuffleAnswers=e.target.checked;saveDraftState()});

    if ($('#add-ending')) {
      $('#add-ending').addEventListener('click', () => {
        draft.endings.push({ id: uid(), title: 'Новый финал', desc: '' });
        saveDraftState();
        renderEditor();
      });
      bindEndings();
    }

    $('#add-q').addEventListener('click',()=>{const nq=newQuestion();if(MODE_TYPES.includes(draft.mode)){nq.type=draft.mode;initType(nq)}draft.questions.push(nq);saveDraftState();renderQuestions()});
    $('#save').addEventListener('click',saveDraft);
    $('#save-bottom').addEventListener('click',saveDraft);
    bindQuestions();
  }

  function renderEndingsHTML() {
    if (!draft.endings || draft.endings.length === 0) return '<p class="muted small">Нет добавленных результатов.</p>';
    return draft.endings.map((e, i) => `
      <div class="ending-card" data-ei="${i}">
        <div class="row between" style="margin-bottom:8px">
          <b>Результат ${i + 1}</b>
          <button class="btn danger sm" data-act="del-ending">Удалить</button>
        </div>
        <input class="input" placeholder="Заголовок (например: Победа)" value="${esc(e.title)}" maxlength="150" data-etitle style="margin-bottom:8px">
        <textarea class="input" placeholder="Текст концовки" maxlength="1000" data-edesc rows="2">${esc(e.desc)}</textarea>
        <div class="row" style="margin-top:8px">
          <input type="file" accept="image/*" data-eimage style="display:none">
          <button class="btn ghost sm" data-act="pick-eimg">📷 Прикрепить картинку</button>
          ${e.image ? `<button class="btn danger sm" data-act="del-eimg">Удалить картинку</button>` : ''}
        </div>
        ${e.image ? `<img src="${esc(e.image)}" alt="" class="q-img" style="max-height:150px">` : ''}
      </div>
    `).join('');
  }

  function bindEndings() {
    const list = $('#endings-list');
    list.addEventListener('input', e => {
      const ei = e.target.closest('[data-ei]')?.dataset.ei;
      if (ei == null) return;
      const ending = draft.endings[ei];
      if (e.target.matches('[data-etitle]')) ending.title = e.target.value.slice(0, 150);
      if (e.target.matches('[data-edesc]')) ending.desc = e.target.value.slice(0, 1000);
      saveDraftState();
    });
    list.addEventListener('change', e => {
      if (e.target.matches('[data-etitle]')) refreshEndingSelects();
      if (e.target.matches('[data-eimage]')) {
        const ei = e.target.closest('[data-ei]').dataset.ei;
        const file = e.target.files[0];
        if (!file) return;
        toast('Сжимаем картинку...', 'warn');
        new Compressor(file, {
          quality: 0.5, maxWidth: 400, maxHeight: 400,
          success(res) {
            const reader = new FileReader();
            reader.onload = ev => {
              const img = safeImg(ev.target.result);
              if (!img) { toast('Этот формат картинки не поддерживается','warn'); return; }
              draft.endings[ei].image = img;
              saveDraftState();
              renderEditor();
              toast('Картинка добавлена ✓', 'good');
            };
            reader.readAsDataURL(res);
          },
          error() { toast('Не удалось обработать картинку','warn'); }
        });
      }
    });
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const card = btn.closest('[data-ei]');
      const ei = +card.dataset.ei;
      if (btn.dataset.act === 'pick-eimg') {
        card.querySelector('[data-eimage]').click();
      } else if (btn.dataset.act === 'del-ending') {
        if (!confirm('Удалить результат?')) return;
        draft.endings.splice(ei, 1);
        saveDraftState();
        renderEditor();
      } else if (btn.dataset.act === 'del-eimg') {
        draft.endings[ei].image = null;
        saveDraftState();
        renderEditor();
      }
    });
  }

  function renderQuestions(){$('#qlist').innerHTML=draft.questions.map((q,i)=>questionCard(q,i)).join('')}

  // обновляет только списки концовок в вопросах, не пересобирая карточки (иначе теряется фокус)
  function refreshEndingSelects(){
    $$('#qlist [data-acat]').forEach(sel=>{
      const q=draft.questions[+sel.closest('[data-qi]').dataset.qi];
      const a=q&&q.answers[+sel.closest('[data-ai]').dataset.ai];
      if(!a)return;
      sel.innerHTML='<option value="">Без балла</option>'+(draft.endings||[]).map(e=>`<option value="${esc(e.id)}" ${a.points&&a.points[e.id]?'selected':''}>${esc(e.title)}</option>`).join('');
    });
    $$('#qlist [data-anext]').forEach(sel=>{
      const q=draft.questions[+sel.closest('[data-qi]').dataset.qi];
      const a=q&&q.answers[+sel.closest('[data-ai]').dataset.ai];
      if(!a)return;
      sel.innerHTML=buildTreeOptions(q);
      sel.value=a.nextId||'';
    });
  }

  function buildTreeOptions(q){
    let html=`<option value="">Следующий по порядку</option>`;
    draft.questions.forEach((optQ,idx)=>{
      if(optQ.id!==q.id)html+=`<option value="Q_${esc(optQ.id)}">Вопрос ${idx+1}: ${esc((optQ.text||'').substring(0,15))}...</option>`;
    });
    (draft.endings||[]).forEach(e=>{ html+=`<option value="E_${esc(e.id)}">Результат: ${esc(e.title)}</option>`; });
    return html;
  }

  function scalePreviewText(sc){
    const mn=+sc.min,mx=+sc.max,cv=+sc.correct,tl=(mx-mn)*(+sc.tolerance)/100;
    if(![mn,mx,cv,tl].every(Number.isFinite)||mx<=mn)return 'Проверьте значения шкалы';
    return `Принимаются ответы от ${fmtNum(Math.max(mn,cv-tl))} до ${fmtNum(Math.min(mx,cv+tl))} (±${fmtNum(tl)})`;
  }
  // подготовка данных вопроса под выбранный тип
  function initType(q){
    if(q.type==='sort'){
      if(!Array.isArray(q.categories)||q.categories.length<2)q.categories=[{id:uid(),text:''},{id:uid(),text:''}];
      q.answers.forEach(a=>{a.correct=false;delete a.right;if(a.cat==null)a.cat=''});
      while(q.answers.length<2){const a=newAnswer();a.cat='';q.answers.push(a)}
    } else if(q.type==='scale'){
      q.answers=[];
      if(!q.scale)q.scale={min:0,max:100,correct:50,tolerance:5,step:1};
    } else if(q.type==='swipe'){
      q.answers=[];
      if(typeof q.truth!=='boolean')q.truth=true;
    }
  }

  function questionCard(q,qi){
    const isTree=draft.mode==='tree';
    const isDiagram=draft.mode==='diagram';
    const isTournament=draft.mode==='tournament';
    const isText=q.type==='text';
    const isMatch=q.type==='match';
    const isAsm=q.type==='assemble';
    const isSort=q.type==='sort', isScale=q.type==='scale', isSwipe=q.type==='swipe';
    const displayNum = Number(qi) + 1;

    const treeOptions = isTree ? buildTreeOptions(q) : '';

    if (isTournament) {
      return `<div class="card q-card" data-qi="${qi}">
        <div class="row between"><b>Вариант ${displayNum}</b><button class="btn danger sm" data-act="del-q">Удалить</button></div>
        <input class="input" style="margin-top:8px" data-qtext maxlength="500" value="${esc(q.text)}" placeholder="Название предмета (например: Красноярск)">
        <div class="row" style="margin-top:8px">
          <input type="file" accept="image/*" data-qimage style="display:none">
          <button class="btn ghost sm" data-act="pick-img">📷 Картинка</button>
          ${q.image?`<button class="btn danger sm" data-act="del-img">Удалить</button>`:''}
        </div>
        ${q.image?`<img src="${esc(q.image)}" alt="" class="q-img" style="max-height:150px">`:''}
      </div>`;
    }

    const typeSelect = (!isDiagram && !isTree && !MODE_TYPES.includes(draft.mode)) ? `<div class="row" style="margin-top:8px"><select class="input" data-qtype style="max-width:260px">
        <option value="single" ${q.type==='single'?'selected':''}>Один вариант</option>
        <option value="multi" ${q.type==='multi'?'selected':''}>Несколько вариантов</option>
        <option value="text" ${isText?'selected':''}>Текстовый ответ</option>
        <option value="match" ${isMatch?'selected':''}>Соединение (стрелки)</option>
        <option value="assemble" ${isAsm?'selected':''}>Сборка из блоков</option>
      </select></div>` : '';

    let inner;
    if (isMatch) {
      inner = `<p class="muted small" style="margin:10px 0 0">Слева — вопрос или термин, справа — подходящий ответ. Игрок соединяет их стрелками (справа блоки перемешиваются).</p>
        <div class="alist">
          ${q.answers.map((a,ai)=>`<div class="arow" data-ai="${ai}">
            <input class="input" data-atext value="${esc(a.text)}" maxlength="200" placeholder="Слева">
            <span class="muted">→</span>
            <input class="input" data-aright value="${esc(a.right||'')}" maxlength="200" placeholder="Справа">
            <button class="btn danger sm" data-act="del-a">✕</button>
          </div>`).join('')}
        </div>
        <button class="btn ghost sm" data-act="add-a" style="margin-top:10px">+ Пара</button>`;
    } else if (isAsm) {
      const correct = q.answers.map((a,i)=>[a,i]).filter(([a])=>a.correct);
      const decoys = q.answers.map((a,i)=>[a,i]).filter(([a])=>!a.correct);
      inner = `<p class="muted small" style="margin:10px 0 0">Блоки ответа расположите в том порядке, в каком их нужно собрать (до 150 символов в блоке). Лишние блоки в ответ вставлять не нужно: если игрок их поставит, ответ будет неверным.</p>
        <label class="label">Правильная последовательность</label>
        <div class="alist">
          ${correct.map(([a,ai],k)=>`<div class="arow" data-ai="${ai}">
            <span class="badge num">${k+1}</span>

        <label class="label">Категории (корзины)</label>
        <div class="alist">${cats.map((c,ci)=>`<div class="arow" data-ci="${ci}">
          <input class="input" data-ctext value="${esc(c.text)}" maxlength="60" placeholder="Например: Млекопитающие">
          <button class="btn danger sm" data-act="del-cat">✕</button>
        </div>`).join('')}</div>
        <button class="btn ghost sm" data-act="add-cat" style="margin-top:10px">+ Категория</button>
        <label class="label">Карточки</label>
        <div class="alist">${q.answers.map((a,ai)=>`<div class="arow" data-ai="${ai}">
          <input class="input" data-atext value="${esc(a.text)}" maxlength="150" placeholder="Например: Кит">
          <select class="input" data-icat style="max-width:210px">${catOpts(a)}</select>
          <button class="btn danger sm" data-act="del-a">✕</button>
        </div>`).join('')}</div>
        <button class="btn ghost sm" data-act="add-a" style="margin-top:10px">+ Карточка</button>`;
    } else if (isScale) {
      const sc = q.scale || {min:0,max:100,correct:50,tolerance:5,step:1};
      inner = `<p class="muted small" style="margin:10px 0 0">Ответ — число. Игрок двигает ползунок от минимума до максимума. Погрешность задаётся в процентах от всего диапазона шкалы.</p>
        <div class="grid2" style="margin-top:10px">
          <div><label class="label">Минимум</label><input class="input" type="number" data-sc="min" value="${esc(sc.min)}"></div>
          <div><label class="label">Максимум</label><input class="input" type="number" data-sc="max" value="${esc(sc.max)}"></div>
          <div><label class="label">Правильное значение</label><input class="input" type="number" data-sc="correct" value="${esc(sc.correct)}"></div>
          <div><label class="label">Погрешность ± (%)</label><input class="input" type="number" min="0" max="50" data-sc="tolerance" value="${esc(sc.tolerance)}"></div>
          <div><label class="label">Шаг ползунка</label><input class="input" type="number" min="0" data-sc="step" value="${esc(sc.step)}"></div>
        </div>
        <p class="muted small sc-prev" style="margin:10px 0 0">${scalePreviewText(sc)}</p>`;
    } else if (isSwipe) {
      inner = `<p class="muted small" style="margin:10px 0 0">Текст вопроса выше — утверждение на карточке. Игрок смахивает карточку вправо («Верно») или влево («Неверно»). Таймер на весь тест включается режимом «На время».</p>
        <label class="label">Это утверждение…</label>
        <select class="input" data-truth style="max-width:240px"><option value="1" ${q.truth!==false?'selected':''}>Верное</option><option value="0" ${q.truth===false?'selected':''}>Неверное</option></select>`;
    } else {
      inner = `${isText ? `<p class="muted small" style="margin:10px 0 0">Игрок вводит ответ сам. Впишите допустимые варианты написания (регистр, пробелы и «ё/е» не учитываются).</p>` : ''}
      <div class="alist">
        ${q.answers.map((a,ai)=>`<div class="arow" data-ai="${ai}">
          ${!isDiagram && !isTree && !isText ? `<button class="mark ${a.correct?'on':''}" data-act="correct">${a.correct?'✓':''}</button>`:''}
          <input class="input" data-atext value="${esc(a.text)}" maxlength="200" ${isText?'placeholder="Правильный ответ"':''}>
          ${isTree?`<select class="input" data-anext style="max-width:200px;font-size:12px">
            ${treeOptions.replace(`value="${esc(a.nextId||'')}"`,`value="${esc(a.nextId||'')}" selected`)}
          </select>`:''}
          ${isDiagram?`<select class="input" data-acat style="max-width:200px;font-size:12px">
            <option value="">Без балла</option>
            ${(draft.endings || []).map(e => {
              const isSel = a.points && a.points[e.id];
              return `<option value="${esc(e.id)}" ${isSel ? 'selected' : ''}>${esc(e.title)}</option>`;
            }).join('')}

      <button class="btn ghost sm" data-act="add-a" style="margin-top:10px">${isText?'+ Вариант написания':'+ Ответ'}</button>`;

    return `<div class="card q-card" data-qi="${qi}">
      <div class="row between"><b>Вопрос ${displayNum}</b><button class="btn danger sm" data-act="del-q">Удалить</button></div>

      ${q.image?`<img src="${esc(q.image)}" alt="" class="q-img" style="max-height:150px">`:''}
