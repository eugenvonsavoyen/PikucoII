<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Пикуко 2</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"></script>

<style>
*{box-sizing:border-box}
:root{--bg:#0d0a16;--panel:#171225;--panel2:#1f1833;--border:#2c2444;--text:#ece9f5;--muted:#9b93b8;--accent:#a855f7;--accent2:#ec4899;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme="light"]{--bg:#f6f4fb;--panel:#fff;--panel2:#f0ecfa;--border:#e3ddf0;--text:#1a1625;--muted:#6b6584;--shadow:0 10px 30px rgba(80,50,150,.12)}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(168,85,247,.18),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(236,72,153,.12),transparent 60%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.wrap.narrow{max-width:760px}
.wrap.wide{max-width:1100px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.site-header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.site-header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;gap:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:.15s}
.nav-link:hover{background:var(--panel);color:var(--text)}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 6px 20px -6px var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.active-vote{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.22)}
textarea.input{resize:vertical;min-height:44px}
.label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.big{padding:32px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:16px 0}
.test-card{display:flex;flex-direction:column;gap:8px;transition:.18s;cursor:pointer;padding:0;overflow:hidden}
.test-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.test-img{width:100%;height:140px;object-fit:cover;border-bottom:1px solid var(--border)}
.test-card-content{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.test-card h3{margin:0;font-size:18px}
.test-card p{margin:0;font-size:14px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-go{margin-top:8px;color:var(--accent);font-weight:600;font-size:14px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.badge.good{color:var(--good);border-color:rgba(34,197,94,.4)}
.badge.wrong{color:var(--bad);border-color:rgba(239,68,68,.4)}
.badge.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}
.badge.quality{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.hero{padding:56px 20px 8px;text-align:center;max-width:820px;margin:0 auto}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-actions{display:flex;gap:12px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.stats{display:flex;gap:32px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-size:24px;font-weight:800}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.play-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 20px;border:1px solid var(--border)}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.answers{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.answer{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer;transition:.15s}
.answer:hover{border-color:var(--accent)}
.answer.selected{border-color:var(--accent);background:rgba(168,85,247,.18);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.score-circle{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0)}
.score-circle::before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.score-circle span{position:relative;font-size:34px;font-weight:800}
.review{margin-top:12px;padding:16px}
.review.ok{border-left:4px solid var(--good)}
.review.bad{border-left:4px solid var(--bad)}
.review p{margin:6px 0}
.qlist{display:flex;flex-direction:column;gap:16px;margin:16px 0}
.q-card{padding:18px}
.q-card textarea{margin-top:10px}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mark{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:800;font-size:14px;transition:.15s}
.mark.on{background:var(--good);border-color:var(--good);color:#fff}
.arow .input{flex:1;min-width:150px}
.avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:28px;background:var(--panel2);border:1px solid var(--border);flex:none}
.attempt{padding:8px 0;border-bottom:1px solid var(--border)}
.attempt:last-child{border:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--border);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.28s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:10000;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.good{border-color:var(--good);color:var(--good)}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.confetti{position:fixed;top:-16px;width:8px;height:14px;z-index:9999;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.q-img{max-width:100%;max-height:300px;border-radius:12px;margin:12px 0;display:block;border:1px solid var(--border)}
.chart-container{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.chart-row{display:flex;align-items:center;gap:12px}
.chart-label{width:100px;font-weight:600;font-size:14px;text-align:right}
.chart-bar-wrap{flex:1;background:var(--panel2);border-radius:8px;height:24px;overflow:hidden;position:relative}
.chart-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:bold;color:#fff;min-width:30px}
.comment{background:var(--panel2);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border);position:relative}
.comment b{color:var(--accent)}
.comment-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px;opacity:0.5;transition:.15s}
.comment-del:hover{opacity:1}
#online-widget{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--panel);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;transition:.3s}
#online-widget:hover{border-color:var(--accent);color:var(--text)}
.online-dot{width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 8px var(--good)}
.result-layout{display:grid;grid-template-columns:1fr;gap:24px;margin-top:24px}
@media(min-width:900px){.result-layout{grid-template-columns:1fr 340px;align-items:start}.sidebar-sticky{position:sticky;top:84px}}
.sidebar-comments{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow-y:auto}
.sidebar-comments h3{margin-top:0;font-size:18px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.auth-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.auth-tab{padding:10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.auth-tab.active{border-color:var(--accent);color:var(--text)}
.ending-card{background:var(--panel2);padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid var(--border);position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.emoji-btn { font-size: 24px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; transition: .15s; display: grid; place-items: center; }
.emoji-btn:hover { border-color: var(--accent); transform: scale(1.1); }
.tournament-container { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
@media(min-width: 768px) { .tournament-container { grid-template-columns: 1fr 1fr; } }
.tournament-item { background: var(--panel2); border: 2px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: .2s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tournament-item:hover { border-color: var(--accent); transform: scale(1.02); }
.tournament-item img { max-width: 100%; max-height: 200px; border-radius: 12px; object-fit: cover; }
.tournament-item h3 { margin: 0; font-size: 20px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="#/" class="logo">Пикуко <span>2</span></a>
    <nav>
      <a href="#/" class="nav-link">Тесты</a>
      <a href="#/create" class="nav-link">Создать</a>
      <a href="#/profile" class="nav-link" id="nav-profile">Профиль</a>
      <button id="theme-toggle" class="icon-btn" title="Сменить тему">◐</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<div id="online-widget">
  <div class="online-dot"></div>
  <span id="online-count">...</span> онлайн
</div>

<div id="loading" style="position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99999">
  <div style="text-align:center">
    <div style="width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div>
    <p class="muted">Загрузка Пикуко...</p>
  </div>
</div>

<script>
(() => {
  const firebaseConfig = {
    apiKey: "AIzaSyCfcm6SlBlkv9QGyXHWUEab5-BsSjav2Cs",
    authDomain: "pikuco1-fc72f.firebaseapp.com",
    databaseURL: "https://pikuco1-fc72f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "pikuco1-fc72f",
    storageBucket: "pikuco1-fc72f.firebasestorage.app",
    messagingSenderId: "451713743393",
    appId: "1:451713743393:web:6d48e45f795a4a72528160",
    measurementId: "G-B2BQ1KSSQY"
  };

  const RECAPTCHA_SITE_KEY = '6Lf1wf4tAAAAABZNzERckMqsV4Ssz_pd9F99MpP8';
  const FB_URL = firebaseConfig.databaseURL;

  let appCheck = null;
  try {
    firebase.initializeApp(firebaseConfig);
    appCheck = firebase.appCheck();
    appCheck.activate(RECAPTCHA_SITE_KEY, true);
  } catch (e) {
    console.error("Ошибка инициализации App Check:", e);
  }

  async function fbFetch(path, options = {}) {
    try {
      if (!appCheck) throw new Error("App Check не инициализирован");
      const token = await appCheck.getToken();
      const headers = {
        ...(options.headers || {}),
        'X-Firebase-AppCheck': token.token
      };
      return fetch(`${FB_URL}${path}`, { ...options, headers });
    } catch (error) {
      console.warn("Ошибка получения токена App Check. Запрос без токена.", error);
      return fetch(`${FB_URL}${path}`, options);
    }
  }

  function cleanText(t) {
    if (!t) return t;
    let r = t;
    r = r.replace(/<[^>]*>?/gm, '');
    const CENSOR = [/хуй/gi, /хуя/gi, /хуе/gi, /пизд/gi, /бля/gi, /еба/gi, /ёба/gi, /ебал/gi, /ебуч/gi, /сука/gi, /мразь/gi, /гандон/gi, /долбо[её]б/gi, /мудак/gi, /пидор/gi, /шлюх/gi];
    CENSOR.forEach(re => { r = r.replace(re, '***'); });
    return r;
  }

  const EMOJIS = ['🦊','🐱','🐶','🐼','🐸','🐵','🐯','🦁','🐮','🐷','🐙','🦄','🦖','🐺','🦉','🦇','🐲','🐢','🐍','🦎','🐊','🐳','🐬','🦈','🐟','🦅','🦆','🦢','🐔','🐧','🦌','🦍','🐘','🐪','🦒','🦘','🐄','🐖','🐏','🐑','🐐','🦙'];

  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')};

  function toast(msg,type=''){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=msg;el.className='toast show '+type;clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3000)}

  const KEY='pikuco2';
  const store={
    get(k,d){try{const v=localStorage.getItem(KEY+'.'+k);if(!v)return d;return JSON.parse(v)}catch{return d}},
    set(k,v){try{localStorage.setItem(KEY+'.'+k,JSON.stringify(v))}catch{}},
    del(k){try{localStorage.removeItem(KEY+'.'+k)}catch{}}
  };

  const state={tests:[],user:store.get('user',null),theme:store.get('theme','dark')};

  if(!state.user){
    state.user={
      id:uid(),
      name:'Гость #'+Math.floor(1000+Math.random()*9000),
      avatar: EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
      isGuest:true,
      voted:{}
    };
    store.set('user',state.user);
  }
  if(!state.user.voted) state.user.voted = {};
  if(!state.user.avatar || !EMOJIS.includes(state.user.avatar)) state.user.avatar = EMOJIS[0];

  function saveUser(){store.set('user',state.user)}
  function newAnswer(){return{id:uid(),text:'',correct:false,nextId:null,points:{}}}
  function newQuestion(){return{id:uid(),text:'',type:'single',image:null,answers:[newAnswer(),newAnswer()]}}
  function getTest(id){return state.tests.find(t=>t.id===id)}

  async function dbLoad(){
    try{
      const testsRes = await fbFetch('/tests.json');
      const testsData = await testsRes.json() || {};
      state.tests = sanitizeTests(Object.entries(testsData).map(([id, t]) => ({ ...t, id })));
    }catch(e){
      console.warn('DB Load failed',e);
      state.tests=sanitizeTests(store.get('tests',null)||seed());
    }
  }

  async function persistTest(test){
    test.title = cleanText(test.title);
    test.description = cleanText(test.description);
    test.questions.forEach(q => {
      q.text = cleanText(q.text);
      if (q.answers) q.answers.forEach(a => { a.text = cleanText(a.text); });
    });

    const idx=state.tests.findIndex(t=>t.id===test.id);
    if(idx>=0)state.tests[idx]=test;else state.tests.unshift(test);
    store.set('tests',state.tests);
    
    const payload = JSON.stringify(test);
    if (payload.length > 900000) {
      toast('Слишком большой размер (картинка). Удалите её.', 'warn');
      return;
    }

    try{
      const res = await fbFetch(`/tests/${test.id}.json`,{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:payload
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
    }catch(e){
      toast('Ошибка сохранения', 'warn');
      console.error(e);
    }
  }

  async function persistDelete(id){
    state.tests=state.tests.filter(t=>t.id!==id);
    store.set('tests',state.tests);
    try{ await fbFetch(`/tests/${id}.json`,{method:'DELETE'}); }
    catch(e){ toast('Ошибка удаления','warn') }
  }

  function sanitizeTests(tests){
    return tests.map(t=>{
      t.title=t.title||'Без названия';t.description=t.description||'';
      t.questions=Array.isArray(t.questions)?t.questions:[];
      t.likes=Array.isArray(t.likes)?t.likes:[];
      t.dislikes=Array.isArray(t.dislikes)?t.dislikes:[];
      t.comments=Array.isArray(t.comments)?t.comments:[];
      t.createdAt=t.createdAt||Date.now();t.mode=t.mode||'standard';
      if(t.mode==='tree' && !Array.isArray(t.endings)) t.endings=[];
      if(t.mode==='diagram' && !Array.isArray(t.endings)) t.endings=[];
      t.questions.forEach(q=>{
        q.answers=Array.isArray(q.answers)?q.answers:[];
      });
      return t;
    });
  }

  async function updatePresence(){
    const countEl=$('#online-count');
    if(!countEl)return;
    try{countEl.textContent=Math.floor(Math.random()*3)+1;}catch(e){}
  }

  async function doRegister(email,password,displayName){
    try {
      const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
      const user = userCredential.user;

      const cleanName = cleanText(displayName || email.split('@')[0]);
      const profile = {
        id: user.uid,
        login: email,
        name: cleanName,
        avatar: state.user.avatar,
        isGuest: false,
        voted: {}
      };
      
      await fbFetch(`/users/${user.uid}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(profile)
      });

      const guestId = state.user.id;
      state.tests.forEach(async t => {
        if(t.authorId === guestId){
          t.authorId = user.uid;
          t.author = cleanName;
          await persistTest(t);
        }
      });

      state.user = profile;
      saveUser();

  function startPlay(id){
    const t=getTest(id);if(!t){location.hash='#/';return}
    play={testId:id,index:0,answers:{},start:Date.now(),scores:{},stageCorrect:0};
    
    if(t.mode==='diagram'){
      play.scores={};
      (t.endings||[]).forEach(e => play.scores[e.id] = 0);
    }

    if(t.mode==='tree'){
      play.currentNodeId=t.questions.length>0?t.questions[0].id:null;
      play.history=play.currentNodeId?[play.currentNodeId]:[];
    }

    if(t.mode==='tournament'){
      play.roundItems = [...t.questions].sort(() => Math.random() - 0.5);
      play.winners = [];
      play.currentPair = [];
      play.bracketRound = 1;
      nextTournamentPair();
    } else {
      renderPlay();
    }

    if (t.mode !== 'tournament' && t.mode !== 'tree') {
      playTimer=setInterval(()=>{const e=$('#timer');if(e&&play&&t.mode!=='time')e.textContent=fmtTime(Date.now()-play.start)},500);
    }
  }

  function nextTournamentPair() {
    if (play.roundItems.length < 2) {
      if (play.roundItems.length === 1) play.winners.push(play.roundItems[0]);
      if (play.winners.length === 1) {
        finishPlay();
        return;
      }
      play.roundItems = [...play.winners];
      play.winners = [];
      play.bracketRound++;
    }
    
    const a = play.roundItems.pop();
    const b = play.roundItems.pop();
    play.currentPair = [a, b];
    renderTournamentPlay();
  }

  function renderTournamentPlay() {
    const t = getTest(play.testId);
    const [a, b] = play.currentPair;
    
    $('#app').innerHTML = `<div class="wrap narrow">
      <div class="play-head"><a href="#/test/${t.id}" class="muted small">← Выйти</a><span class="badge">Раунд ${play.bracketRound}</span></div>
      <p class="muted small center" style="margin-bottom:24px">Выберите лучший вариант. Остальные вылетают.</p>
      
      <div class="tournament-container">
        <div class="tournament-item" data-aid="${a.id}">
          ${a.image ? `<img src="${esc(a.image)}">` : ''}
          <h3>${esc(a.text)}</h3>
        </div>
        <div class="tournament-item" data-aid="${b.id}">
          ${b.image ? `<img src="${esc(b.image)}">` : ''}
          <h3>${esc(b.text)}</h3>
        </div>
      </div>
    </div>`;

    $$('.tournament-item').forEach(el => {
      el.addEventListener('click', () => {
        const aid = el.dataset.aid;
        const winner = play.currentPair.find(x => x.id === aid);
        play.winners.push(winner);
        nextTournamentPair();
      });
    });
  }

  function renderPlay(){
    const t=getTest(play.testId);if(!t){play=null;location.hash='#/';return}
    let q,total,pct,displayIndex;
    if(t.mode==='tree'){
      q=t.questions.find(x=>x.id===play.currentNodeId);
      if(!q){finishPlay();return;}
      total=play.history.length;displayIndex=total;pct=100;
    } else {
      q=t.questions[play.index];
      if(!q){finishPlay();return}
      total=t.questions.length;displayIndex=play.index+1;pct=Math.round((play.index/total)*100)
    }

    let nextBtn = '';
    if (t.mode === 'tree') {
      nextBtn = `<button class="btn primary" id="next-step">Следующий шаг →</button>`;
    } else {
      nextBtn = play.index === total - 1 
        ? `<button class="btn primary" id="finish">Завершить</button>`
        : `<button class="btn primary" id="next">Далее →</button>`;
    }

    $('#app').innerHTML=`<div class="wrap narrow">
      <div class="play-head"><a href="#/test/${t.id}" class="muted small">← Выйти</a><span id="timer">00:00</span></div>
      <div class="progress"><div class="bar" style="width:${t.mode==='tree' ? 100 : pct}%"></div></div>
      <p class="muted small">${t.mode==='tree' ? 'Шаг ' + displayIndex : 'Вопрос ' + displayIndex + ' из ' + total}</p>
      <div class="card">
        <h2>${esc(q.text)}</h2>
        ${q.image?`<img src="${esc(q.image)}" class="q-img">`:''}
        <div class="answers" id="answers">${q.answers.map(a=>`<button class="answer" data-aid="${a.id}">${esc(a.text)}</button>`).join('')}</div>
      </div>
      <div class="row between" style="margin-top:16px">
        ${t.mode!=='tree' ? `<button class="btn ghost" id="prev" ${play.index===0?'disabled':''}>← Назад</button>` : `<div></div>`}
        ${nextBtn}
      </div>
    </div>`;
    updateAnswerUI();bindPlay();
  }

  function updateAnswerUI(){
    const t=getTest(play.testId);
    const q=t.mode==='tree'?t.questions.find(x=>x.id===play.currentNodeId):t.questions[play.index];
    if(!q)return;
    const sel=play.answers[q.id]||[];
    $$('#answers .answer').forEach(b=>b.classList.toggle('selected',sel.includes(b.dataset.aid)))
  }

  function bindPlay(){
    const t=getTest(play.testId);
    const q=t.mode==='tree'?t.questions.find(x=>x.id===play.currentNodeId):t.questions[play.index];
    if(!q)return;

    const answersEl = $('#answers');
    if(answersEl) {
      answersEl.addEventListener('click',e=>{
        const btn=e.target.closest('.answer');if(!btn)return;
        const aid=btn.dataset.aid;
        
        if(q.type==='single' || t.mode==='tree'){
          play.answers[q.id]=[aid];
        } else {
          const arr=(play.answers[q.id]||[]).slice();
          const i=arr.indexOf(aid);
          if(i>=0)arr.splice(i,1);else arr.push(aid);
          play.answers[q.id]=arr;
        }
        updateAnswerUI();
      });
    }

    const n=$('#next'),p=$('#prev'),f=$('#finish'),ns=$('#next-step');
    
    if(n)n.addEventListener('click',()=>{play.index++;renderPlay()});
    if(p)p.addEventListener('click',()=>{play.index--;renderPlay()});
    if(f)f.addEventListener('click',()=>finishPlay());

    if (ns) {
      ns.addEventListener('click', () => {
        const selectedId = (play.answers[q.id] || [])[0];
        if (!selectedId) { toast('Выберите вариант ответа', 'warn'); return; }
        const ans = q.answers.find(a => a.id === selectedId);
        
        if (ans && ans.nextId) {
          if (ans.nextId.startsWith('E_')) {
            const endingId = ans.nextId.replace('E_', '');
            const ending = (t.endings || []).find(e => e.id === endingId);
            lastResult = { testId: t.id, title: t.title, mode: t.mode, ending: ending || { title: 'Конец', desc: '' }, time: Date.now() - play.start };
            sessionStorage.setItem(KEY+'.result', JSON.stringify(lastResult));
            play=null; location.hash='#/result'; return;
          } else if (ans.nextId.startsWith('Q_')) {
            play.currentNodeId = ans.nextId.replace('Q_', '');
            play.history.push(play.currentNodeId);
            renderPlay(); return;
          }
        }
        
        const currentIndex = t.questions.findIndex(x => x.id === q.id);
        if (currentIndex >= 0 && currentIndex < t.questions.length - 1) {
          play.currentNodeId = t.questions[currentIndex + 1].id;
          play.history.push(play.currentNodeId);
          renderPlay();
        } else {
          lastResult = { testId: t.id, title: t.title, mode: t.mode, ending: { title: 'Конец', desc: '' }, time: Date.now() - play.start };
          sessionStorage.setItem(KEY+'.result', JSON.stringify(lastResult));
          play=null; location.hash='#/result';
        }
      });
    }
  }

  function finishPlay(){
    const t=getTest(play.testId);
    
    if(t.mode==='tournament'){
      const winner = play.roundItems[0] || play.currentPair[0];
      lastResult = { testId: t.id, title: t.title, mode: t.mode, winner, time: Date.now() - play.start };
      sessionStorage.setItem(KEY+'.result', JSON.stringify(lastResult));
      play=null; location.hash='#/result'; return;
    }

    if(t.mode==='tree'){
      lastResult = { testId: t.id, title: t.title, mode: t.mode, ending: { title: 'Конец', desc: 'Вы завершили прохождение.' }, time: Date.now() - play.start };
      sessionStorage.setItem(KEY+'.result', JSON.stringify(lastResult));
      play=null; location.hash='#/result'; return;
    }

    if(t.mode==='diagram'){
      t.questions.forEach(q=>{
        const sel=(play.answers[q.id]||[]);
        sel.forEach(aid=>{
          const ans=q.answers.find(a=>a.id===aid);
          if(ans && ans.points){
            Object.entries(ans.points).forEach(([endId, val])=>{
              play.scores[endId] = (play.scores[endId] || 0) + Number(val);
            });
          }
        })
      });
      
      let maxId = Object.keys(play.scores)[0];
      let maxVal = -1;
      Object.entries(play.scores).forEach(([id, val]) => {
        if(val > maxVal) { maxVal = val; maxId = id; }
      });
      
      const winnerEnding = (t.endings || []).find(e => e.id === maxId) || { title: 'Нет данных', desc: '' };
      
      lastResult={testId:t.id,title:t.title,mode:t.mode,scores:play.scores,winner:winnerEnding,time:Date.now()-play.start};
      sessionStorage.setItem(KEY+'.result',JSON.stringify(lastResult));
      play=null;location.hash='#/result';return
    }

    let correct=0;
    const review=t.questions.map(q=>{
      const sel=(play.answers[q.id]||[]).slice().sort();
      const right=q.answers.filter(a=>a.correct).map(a=>a.id).sort();
      const ok=sel.length===right.length&&sel.every((v,i)=>v===right[i]);
      if(ok)correct++;
      return{q,sel,right,ok}
    });
    let total=t.questions.length,percent=total>0?Math.round((correct/total)*100):0,timeTaken=Date.now()-play.start;
    lastResult={testId:t.id,title:t.title,mode:t.mode,correct,total,percent,review,time:timeTaken};
    sessionStorage.setItem(KEY+'.result',JSON.stringify(lastResult));
    play=null;location.hash='#/result';
  }

    } else if(r.mode==='diagram'){

        <div class="row center" style="margin-top:24px">

        <div class="row center" style="margin-top:24px">

          <button class="btn ghost" id="share-result-img">🖼 Картинка</button>

        ${it.ok?'':`<p class="small"><span class="muted">Правильный ответ:</span> ${it.right.map(id=>esc(it.q.answers.find(a=>a.id===id)?.text||'')).join(', ')}</p>`}

  }

  function renderFeedbackForm(testId){
    const voted = state.user.voted ? state.user.voted[testId] : null;
    return `<div style="background:var(--panel2); padding:16px; border-radius:12px; border:1px solid var(--border)">

      </div>

        <textarea class="input" id="fb-comment" rows="2" placeholder="Комментарий..."></textarea>
        <button class="btn ghost sm" id="fb-submit" style="margin-top:8px">Отправить</button>
      </div>
    </div>`;
  }

  function bindResult(){
    const r=lastResult;if(!r)return;
    
    const shareLink=$('#share-result-link');if(shareLink)shareLink.addEventListener('click',()=>{
      let url=r.mode==='diagram'||r.mode==='tournament'||r.mode==='tree'?location.origin+location.pathname+`#/result?id=${r.testId}`:location.origin+location.pathname+`#/result?id=${r.testId}&c=${r.correct}&t=${r.total}&time=${r.time}&p=${r.percent}`;
      if(navigator.share)navigator.share({title:'Мой результат',text:`Я прошёл «${r.title}»!`,url}).catch(()=>{});else navigator.clipboard.writeText(url).then(()=>toast('Скопировано ✓','good'));
    });
    const shareImg=$('#share-result-img');if(shareImg)shareImg.addEventListener('click',()=>generateSharePoster(r));
    
    $$('[data-vote]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const type=btn.dataset.vote;
        const t=getTest(r.testId);
        if(!t)return;
        if(!t.likes)t.likes=[];
        if(!t.dislikes)t.dislikes=[];
        const myId=state.user.id;
        t.likes=t.likes.filter(x=>x!==myId);
        t.dislikes=t.dislikes.filter(x=>x!==myId);
        if(!state.user.voted)state.user.voted={};
        if(state.user.voted[t.id]===type){
          delete state.user.voted[t.id]
        } else {
          state.user.voted[t.id]=type;
          if(type==='like')t.likes.push(myId);
          if(type==='dislike')t.dislikes.push(myId)
        }
        saveUser();
        await persistTest(t);
        
        $$('[data-vote]').forEach(b => b.classList.remove('active-vote'));
        if (state.user.voted[t.id] === type) {
          btn.classList.add('active-vote');
        }
        toast('Оценка сохранена', 'good');
      })
    });

    const submitBtn=$('#fb-submit');
    if(submitBtn){
      submitBtn.addEventListener('click',async()=>{
        const txt=cleanText($('#fb-comment').value.trim());
        if(!txt){toast('Введите текст','warn');return}
        const t=getTest(r.testId);
        if(!t.comments)t.comments=[];
        t.comments.push({id:uid(),authorId:state.user.id,author:state.user.name,text:txt,date:Date.now()});
        await persistTest(t);
        toast('Добавлено ✓','good');
        $('#fb-comment').value='';
        render();
      })
    }
    
    if(r.percent>=70&&r.mode==='standard')confetti();
  }

  function confetti(){const c=['#a855f7','#ec4899','#22c55e','#f59e0b','#3b82f6'];for(let i=0;i<80;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.animationDelay=(Math.random()*0.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
  async function generateSharePoster(r){const canvas=document.createElement('canvas');canvas.width=600;canvas.height=800;const ctx=canvas.getContext('2d');const grd=ctx.createLinearGradient(0,0,600,800);grd.addColorStop(0,'#171225');grd.addColorStop(1,'#2c2444');ctx.fillStyle=grd;ctx.fillRect(0,0,600,800);ctx.strokeStyle='#a855f7';ctx.lineWidth=4;ctx.strokeRect(20,20,560,760);ctx.fillStyle='#ece9f5';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.fillText('Пикуко 2',300,100);ctx.fillStyle='#9b93b8';ctx.font='24px sans-serif';ctx.fillText(r.title.substring(0,30),300,160);if(r.mode==='diagram'||r.mode==='tournament'){ctx.fillStyle='#22c55e';ctx.font='bold 60px sans-serif';ctx.fillText('Мой выбор:',300,300);ctx.fillStyle='#ffffff';ctx.font='bold 80px sans-serif';ctx.fillText(r.winner.title||r.winner.text,300,400)}else{const cx=300,cy=380,radius=140;ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.strokeStyle='#3b2a5c';ctx.lineWidth=20;ctx.stroke();const endAngle=(Math.PI*2)*(r.percent/100)-Math.PI/2;ctx.beginPath();ctx.arc(cx,cy,radius,-Math.PI/2,endAngle);ctx.strokeStyle='#a855f7';ctx.lineWidth=20;ctx.stroke();ctx.fillStyle='#ffffff';ctx.font='bold 80px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r.percent+'%',cx,cy);ctx.fillStyle='#22c55e';ctx.font='bold 36px sans-serif';ctx.textBaseline='alphabetic';ctx.fillText(`${r.correct} из ${r.total}`,300,620)}ctx.fillStyle='#9b93b8';ctx.font='20px sans-serif';ctx.fillText(`Время: ${fmtTime(r.time)}`,300,670);ctx.fillStyle='#a855f7';ctx.font='18px sans-serif';ctx.fillText('Попробуй и ты!',300,730);canvas.toBlob(async(blob)=>{const file=new File([blob],'pikuko-result.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Мой результат',text:`Мой результат в «${r.title}»!`})}catch(e){}}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pikuko-result.png';a.click();URL.revokeObjectURL(url);toast('Сохранено ✓','good')}},'image/png')}

  function startEditor(id){
    if (id) {
      const t = getTest(id);
      draft = t ? JSON.parse(JSON.stringify(t)) : null;
    } else {
      const saved = localStorage.getItem('pikuco2.draft');
      if (saved) {
        if (confirm('У вас есть незаконченный тест. Восстановить его?')) {
          draft = JSON.parse(saved);
        } else {
          localStorage.removeItem('pikuco2.draft');
          draft = { id:null, title:'', description:'', mode:'standard', categories:[], endings:[], questions:[newQuestion()], previewImage:null };
        }
      } else {
        draft = { id:null, title:'', description:'', mode:'standard', categories:[], endings:[], questions:[newQuestion()], previewImage:null };
      }
    }

    if(!draft) return location.hash = '#/';
    if(!draft.mode) draft.mode='standard';
    if(draft.mode==='diagram' && !draft.endings) draft.endings=[{id:uid(),title:'Результат 1',desc:''}];
    if(draft.mode==='tree' && !draft.endings) draft.endings=[];
    if(draft.mode==='tournament' && !draft.stageSize) draft.stageSize=3;
    
    renderEditor();
  }

  function saveDraftState() {
    if (draft && !draft.id) {
      localStorage.setItem('pikuco2.draft', JSON.stringify(draft));
    }
  }

  function renderEditor(){
    const isDiagram=draft.mode==='diagram';
    const isTree=draft.mode==='tree';
    const isTournament=draft.mode==='tournament';
    
    $('#app').innerHTML=`<div class="wrap narrow">
      <a href="#/" class="muted small" id="cancel-editor">← Отмена</a>
      <div class="row between" style="margin-top:8px"><h1 style="margin:0">${draft.id?'Редактирование':'Новый тест'}</h1><button class="btn primary" id="save">Сохранить</button></div>
      
      <label class="label">Название (макс. 150 символов)</label>
      <input class="input" id="e-title" maxlength="150" value="${esc(draft.title)}">
      
      <label class="label">Описание (макс. 400 символов)</label>
      <textarea class="input" id="e-desc" rows="3" maxlength="400">${esc(draft.description)}</textarea>

      <label class="label">Превью (обложка теста)</label>
      <div class="row">
        <input type="file" accept="image/*" id="e-preview" style="display:none">
        <button class="btn ghost sm" onclick="document.getElementById('e-preview').click()">📷 Загрузить обложку</button>
        ${draft.previewImage ? `<button class="btn danger sm" id="del-preview">Удалить обложку</button>` : ''}
      </div>
      ${draft.previewImage ? `<img src="${esc(draft.previewImage)}" style="max-height:150px;border-radius:12px;margin-top:12px;border:1px solid var(--border)">` : ''}
      
      <div class="row" style="margin-top:16px"><div style="flex:1"><label class="label">Режим</label><select class="input" id="e-mode"><option value="standard" ${draft.mode==='standard'?'selected':''}>📝 Обычный</option><option value="time" ${draft.mode==='time'?'selected':''}>⏱ На время</option><option value="survival" ${draft.mode==='survival'?'selected':''}>💀 Выживание</option><option value="tournament" ${draft.mode==='tournament'?'selected':''}>🏆 Турнир</option><option value="tree" ${draft.mode==='tree'?'selected':''}>🌳 Древо</option><option value="diagram" ${draft.mode==='diagram'?'selected':''}>📊 Диаграмма</option></select></div></div>
      
      ${(isDiagram || isTree) ? `
        <div style="margin-top:24px">
          <label class="label">Концовки / Результаты</label>
          <div id="endings-list">${renderEndingsHTML()}</div>
          <button class="btn ghost sm" id="add-ending" style="margin-top:8px">+ Добавить результат</button>
        </div>
      ` : ''}

      <div id="qlist" class="qlist" style="margin-top:24px"></div>
      <button class="btn ghost" id="add-q">+ Добавить ${isTournament?'вариант':'вопрос'}</button>

      <div class="row center" style="margin-top:32px;margin-bottom:64px">
        <button class="btn primary" id="save-bottom" style="min-width:200px">Сохранить</button>
      </div>
    </div>`;
    renderQuestions();
    
    $('#cancel-editor').addEventListener('click', (e) => {
      if (confirm('Выйти без сохранения? Черновик сохранится.')) {
        saveDraftState();
      } else {
        store.del('draft');
      }
    });

    $('#e-title').addEventListener('input',e=>{draft.title=e.target.value.slice(0,150);saveDraftState()});
    $('#e-desc').addEventListener('input',e=>{draft.description=e.target.value.slice(0,400);saveDraftState()});
    
    $('#e-preview').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      toast('Сжимаем обложку...', 'warn');
      new Compressor(file, {
        quality: 0.6, maxWidth: 400, maxHeight: 400,
        success(res) {
          const reader = new FileReader();
          reader.onload = ev => {
            draft.previewImage = ev.target.result;
            saveDraftState();
            renderEditor();
            toast('Обложка добавлена ✓', 'good');
          };
          reader.readAsDataURL(res);
        }
      });
    });

    if($('#del-preview')) $('#del-preview').addEventListener('click', () => {
      draft.previewImage = null;
      saveDraftState();
      renderEditor();
    });

    $('#e-mode').addEventListener('change',e=>{
      draft.mode=e.target.value;
      if(draft.mode==='tree'&&!draft.endings)draft.endings=[];
      if(draft.mode==='diagram'&&!draft.endings)draft.endings=[{id:uid(),title:'Результат 1',desc:''}];
      saveDraftState();
      renderEditor()
    });
    
    if ($('#add-ending')) {
      $('#add-ending').addEventListener('click', () => {
        draft.endings.push({ id: uid(), title: 'Новый финал', desc: '' });
        saveDraftState();
        renderEditor();
      });
      bindEndings();
    }

    $('#add-q').addEventListener('click',()=>{draft.questions.push(newQuestion());saveDraftState();renderQuestions()});
    $('#save').addEventListener('click',saveDraft);
    $('#save-bottom').addEventListener('click',saveDraft);
    bindQuestions();
  }

  function renderEndingsHTML() {
    if (!draft.endings || draft.endings.length === 0) return '<p class="muted small">Нет добавленных результатов.</p>';
    return draft.endings.map((e, i) => `
      <div class="ending-card" data-ei="${i}">
        <div class="row between" style="margin-bottom:8px">
          <b>Результат ${i+1}</b>
          <button class="btn danger sm" data-act="del-ending">Удалить</button>
        </div>
        <input class="input" placeholder="Заголовок (например: Победа)" value="${esc(e.title)}" data-etitle style="margin-bottom:8px">
        <textarea class="input" placeholder="Текст концовки" data-edesc rows="2">${esc(e.desc)}</textarea>
        <div class="row" style="margin-top:8px">
          <input type="file" accept="image/*" data-eimage style="display:none" id="eimg-${i}">
          <button class="btn ghost sm" onclick="document.getElementById('eimg-${i}').click()">📷 Прикрепить картинку</button>
          ${e.image ? `<button class="btn danger sm" data-act="del-eimg">Удалить картинку</button>` : ''}
        </div>
        ${e.image ? `<img src="${esc(e.image)}" class="q-img" style="max-height:150px">` : ''}
      </div>
    `).join('');
  }

  function bindEndings() {
    const list = $('#endings-list');
    list.addEventListener('input', e => {
      const ei = e.target.closest('[data-ei]')?.dataset.ei;
      if (ei == null) return;
      const ending = draft.endings[ei];
      if (e.target.matches('[data-etitle]')) ending.title = e.target.value;
      if (e.target.matches('[data-edesc]')) ending.desc = e.target.value;
      saveDraftState();
    });
    list.addEventListener('change', e => {
      if (e.target.matches('[data-eimage]')) {
        const ei = e.target.closest('[data-ei]').dataset.ei;
        const file = e.target.files[0];
        if (!file) return;
        toast('Сжимаем картинку...', 'warn');
        new Compressor(file, {
          quality: 0.6, maxWidth: 400, maxHeight: 400,
          success(res) {
            const reader = new FileReader();
            reader.onload = ev => {
              draft.endings[ei].image = ev.target.result;
              saveDraftState();
              renderEditor();
              toast('Картинка добавлена ✓', 'good');
            };
            reader.readAsDataURL(res);
          }
        });
      }
    });
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const ei = +btn.closest('[data-ei]').dataset.ei;
      if (btn.dataset.act === 'del-ending') {
        if (!confirm('Удалить результат?')) return;
        draft.endings.splice(ei, 1);
        saveDraftState();
        renderEditor();
      } else if (btn.dataset.act === 'del-eimg') {
        draft.endings[ei].image = null;
        saveDraftState();
        renderEditor();
      }
    });
  }

  function renderQuestions(){$('#qlist').innerHTML=draft.questions.map((q,i)=>questionCard(q,i)).join('')}
  function questionCard(q,qi){
    const isTree=draft.mode==='tree';
    const isDiagram=draft.mode==='diagram';
    const isTournament=draft.mode==='tournament';
    
    let treeOptions=`<option value="">Следующий по порядку</option>`;
    if(isTree){
      draft.questions.forEach((optQ,idx)=>{
        if(optQ.id!==q.id)treeOptions+=`<option value="Q_${optQ.id}">Вопрос ${idx+1}: ${esc(optQ.text.substring(0,15))}...</option>`
      });
      if(draft.endings){
        draft.endings.forEach(e => {
          treeOptions += `<option value="E_${e.id}">Результат: ${esc(e.title)}</option>`;
        });
      }
    }

    let diagramOptions = '';
    if(isDiagram && draft.endings){
      diagramOptions = draft.endings.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('');
    }

    if (isTournament) {
      return `<div class="card q-card" data-qi="${qi}">
        <div class="row between"><b>Вариант ${qi+1}</b><button class="btn danger sm" data-act="del-q">Удалить</button></div>
        <input class="input" style="margin-top:8px" data-qtext value="${esc(q.text)}" placeholder="Название предмета (например: Красноярск)">
        <div class="row" style="margin-top:8px">
          <input type="file" accept="image/*" data-qimage style="display:none" id="img-${qi}">
          <button class="btn ghost sm" onclick="document.getElementById('img-${qi}').click()">📷 Картинка</button>
          ${q.image?`<button class="btn danger sm" data-act="del-img">Удалить</button>`:''}
        </div>
        ${q.image?`<img src="${esc(q.image)}" class="q-img" style="max-height:150px">`:''}
      </div>`;
    }

    return `<div class="card q-card" data-qi="${qi}">
      <div class="row between"><b>Вопрос ${qi+1}</b><button class="btn danger sm" data-act="del-q">Удалить</button></div>
      <textarea class="input" data-qtext rows="2">${esc(q.text)}</textarea>
      <div class="row" style="margin-top:8px"><input type="file" accept="image/*" data-qimage style="display:none" id="img-${qi}"><button class="btn ghost sm" onclick="document.getElementById('img-${qi}').click()">📷 Картинка</button>${q.image?`<button class="btn danger sm" data-act="del-img">Удалить</button>`:''}</div>
      ${q.image?`<img src="${esc(q.image)}" class="q-img" style="max-height:150px">`:''}
      
      ${!isDiagram && !isTree ? `<div class="row"><select class="input" data-qtype style="max-width:220px"><option value="single" ${q.type==='single'?'selected':''}>Один</option><option value="multi" ${q.type==='multi'?'selected':''}>Несколько</option></select></div>`:''}
      
      <div class="alist">
        ${q.answers.map((a,ai)=>`<div class="arow" data-ai="${ai}">
          ${!isDiagram && !isTree ? `<button class="mark ${a.correct?'on':''}" data-act="correct">${a.correct?'✓':''}</button>`:''}
          <input class="input" data-atext value="${esc(a.text)}">
          
          ${isTree?`<select class="input" data-anext style="max-width:250px;font-size:12px">
            ${treeOptions.replace(`value="${a.nextId||''}"`,`value="${a.nextId||''}" selected`)}
          </select>`:''}
          
          ${isDiagram?`<select class="input" data-acat style="max-width:250px;font-size:12px">
            <option value="">Без балла</option>
            ${diagramOptions.replace(`value="${Object.keys(a.points)[0]}"`, `value="${Object.keys(a.points)[0]}" selected`)}
          </select>`:''}
          
          <button class="btn danger sm" data-act="del-a">✕</button>
        </div>`).join('')}
      </div>
      <button class="btn ghost sm" data-act="add-a" style="margin-top:10px">+ Ответ</button>
    </div>`
  }

  function refreshQuestion(qi){const el=$(`[data-qi="${qi}"]`,$('#qlist'));if(el)el.outerHTML=questionCard(draft.questions[qi],qi)}

  function bindQuestions(){
    const list=$('#qlist');
    list.addEventListener('input',e=>{
      const qi=e.target.closest('[data-qi]')?.dataset.qi;if(qi==null)return;
      const q=draft.questions[qi],ai=e.target.closest('[data-ai]')?.dataset.ai;
      if(e.target.matches('[data-qtext]'))q.text=e.target.value;
      else if(e.target.matches('[data-atext]')&&ai!=null)q.answers[ai].text=e.target.value;
      saveDraftState();
    });
    list.addEventListener('change',e=>{
      const qi=e.target.closest('[data-qi]')?.dataset.qi;if(qi==null)return;
      const q=draft.questions[qi],ai=e.target.closest('[data-ai]')?.dataset.ai;
      if(e.target.matches('[data-qimage]')){
        const file=e.target.files[0];if(!file)return;
        toast('Загрузка...','warn');
        new Compressor(file,{quality:0.6,maxWidth:400,maxHeight:400,success(res){
          const reader=new FileReader();
          reader.onload=ev=>{q.image=ev.target.result;saveDraftState();refreshQuestion(qi);toast('Готово','good')};
          reader.readAsDataURL(res)
        }})
      }
      else if(e.target.matches('[data-qtype]')){
        q.type=e.target.value;
        if(q.type==='single'){let seen=false;q.answers.forEach(a=>{if(a.correct){if(seen)a.correct=false;else seen=true}})}
        saveDraftState();refreshQuestion(qi)
      }
      else if(e.target.matches('[data-anext]')){q.answers[ai].nextId=e.target.value||null;saveDraftState()}
      else if(e.target.matches('[data-acat]')){
        const endId=e.target.value;
        q.answers[ai].points = endId ? {[endId]:1} : {};
        saveDraftState();
      }
    });
    list.addEventListener('click',e=>{
      const btn=e.target.closest('[data-act]');if(!btn)return;e.preventDefault();
      const qi=+btn.closest('[data-qi]').dataset.qi,q=draft.questions[qi],ai=btn.closest('[data-ai]')?+btn.closest('[data-ai]').dataset.ai:null,act=btn.dataset.act;
      if(act==='del-q'){if(draft.questions.length<=1){alert('Хотя бы 1');return}if(!confirm('Удалить?'))return;draft.questions.splice(qi,1);saveDraftState();renderQuestions()}
      else if(act==='add-a'){q.answers.push(newAnswer());saveDraftState();refreshQuestion(qi)}
      else if(act==='del-a'){if(q.answers.length<=2){alert('Минимум 2');return}q.answers.splice(ai,1);saveDraftState();refreshQuestion(qi)}
      else if(act==='correct'){if(q.type==='single')q.answers.forEach((a,i)=>{a.correct=(i===ai)});else q.answers[ai].correct=!q.answers[ai].correct;saveDraftState();refreshQuestion(qi)}
      else if(act==='del-img'){q.image=null;saveDraftState();refreshQuestion(qi)}
    });
  }

  async function saveDraft(){
    if(!draft.title.trim()){alert('Введите название');return}
    if(draft.mode==='diagram'&&(!draft.endings||draft.endings.length<1)){alert('Добавьте хотя бы один результат');return}
    
    for(let i=0;i<draft.questions.length;i++){
      const q=draft.questions[i];
      if(!q.text.trim()){alert(`${draft.mode==='tournament'?'Вариант':'Вопрос'} ${i+1}: нет текста`);return}
      if(draft.mode!=='tournament') {
        if(q.answers.length<2){alert(`Вопрос ${i+1}: мало ответов`);return}
        if(q.answers.some(a=>!a.text.trim())){alert(`Вопрос ${i+1}: пустые ответы`);return}
        if(draft.mode==='standard' && !q.answers.some(a=>a.correct)){alert(`Вопрос ${i+1}: нет верного`);return}
      }
    }
    
    if(draft.id){
      const idx=state.tests.findIndex(t=>t.id===draft.id);
      if(idx>=0){draft.authorId=state.tests[idx].authorId||state.user.id;state.tests[idx]={...state.tests[idx],...draft}}
    }else{
      draft.id=uid();draft.authorId=state.user.id;draft.author=state.user.name;draft.createdAt=Date.now();draft.likes=[];draft.dislikes=[];draft.comments=[];state.tests.unshift(draft);
      localStorage.removeItem('pikuco2.draft');
    }
    await persistTest(draft);location.hash='#/test/'+draft.id;
  }

  function viewProfile(){
    const u=state.user;const mine=state.tests.filter(t=>t.authorId===u.id||(!t.authorId&&t.author===u.name));
    if(u.isGuest){
      return `<div class="wrap narrow"><div class="card">
        <div class="row" style="margin-bottom:20px">
          <div class="avatar">${esc(u.avatar)}</div>
          <div>
            <h2 style="margin:0">${esc(u.name)}</h2>
            <p class="muted small" style="margin:0">Зарегистрируйтесь, чтобы сохранить тесты!</p>
          </div>
        </div>
        <div class="auth-tabs"><div class="auth-tab active" id="tab-login">Вход</div><div class="auth-tab" id="tab-register">Регистрация</div></div>
        <div id="form-login">
          <label class="label">Email</label><input class="input" id="auth-login" type="email" placeholder="you@example.com">
          <label class="label">Пароль</label><input class="input" id="auth-pass" type="password" placeholder="Пароль">
          <button class="btn primary" id="btn-login" style="margin-top:16px;width:100%">Войти</button>
        </div>
        <div id="form-register" style="display:none">
          <label class="label">Email</label><input class="input" id="reg-login" type="email" placeholder="you@example.com">
          <label class="label">Имя (Ник)</label><input class="input" id="reg-name" placeholder="Ник">
          <label class="label">Пароль</label><input class="input" id="reg-pass" type="password" placeholder="Пароль">
          <button class="btn primary" id="btn-register" style="margin-top:16px;width:100%">Создать</button>
        </div>
        </div>
        <h3>Мои тесты (Гость)</h3><div class="grid">${mine.map(testCard).join('')||'<p class="muted">Пусто.</p>'}</div>
      </div>`;
    }
    return `<div class="wrap narrow">
      <div class="card">
        <div class="row between">
          <div class="row">
            <div class="avatar">${esc(u.avatar)}</div>
            <div>
              <h2 style="margin:0">${esc(u.name)}</h2>
              <p class="muted small" style="margin:0">Email: ${esc(u.login)}</p>
            </div>
          </div>
          <div class="row">
            <button class="btn ghost sm" id="btn-change-avatar">Сменить аватар</button>
            <button class="btn danger sm" id="btn-logout">Выйти</button>
          </div>
        </div>
        
        <div id="avatar-picker" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
          <label class="label">Выбери животное:</label>
          <div class="emoji-grid">
            ${EMOJIS.map(e => `<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}
          </div>
        </div>
      </div>
      <h3>Мои тесты</h3>
      <div class="grid">${mine.map(testCard).join('')||'<p class="muted">Пусто.</p>'}</div>
    </div>`;
  }

  function bindProfile(){
    if(state.user.isGuest){
      const tabLogin=$('#tab-login'),tabReg=$('#tab-register'),formLogin=$('#form-login'),formReg=$('#form-register');
      tabLogin.addEventListener('click',()=>{tabLogin.classList.add('active');tabReg.classList.remove('active');formLogin.style.display='block';formReg.style.display='none'});
      tabReg.addEventListener('click',()=>{tabReg.classList.add('active');tabLogin.classList.remove('active');formReg.style.display='block';formLogin.style.display='none'});
      
      $('#btn-login').addEventListener('click',async()=>{
        const email=$('#auth-login').value.trim(),p=$('#auth-pass').value;
        if(!email||!p){toast('Заполните поля','warn');return}
        if(await doLogin(email,p))render()
      });
      
      $('#btn-register').addEventListener('click',async()=>{
        const email=$('#reg-login').value.trim(),n=$('#reg-name').value.trim(),p=$('#reg-pass').value;
        if(!email||!p){toast('Заполните Email и пароль','warn');return}
        if(await doRegister(email,p,n||email.split('@')[0]))render()
      });
    }else{
      const picker = $('#avatar-picker');
      $('#btn-change-avatar').addEventListener('click', () => {
        picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
      });

      $$('.emoji-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          state.user.avatar = btn.dataset.emoji;
          saveUser();
          if(!state.user.isGuest) {
            await fbFetch(`/users/${state.user.id}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ avatar: state.user.avatar })
            });
          }
          toast('Аватар обновлен ✓', 'good');
          render();
        });
      });

      $('#btn-logout').addEventListener('click',()=>{
        if(confirm('Вы собираетесь выйти из аккаунта. Вы уверены?')) {
          doLogout();
        }
      });
    }
  }

  async function init(){
    applyTheme();
    
    firebase.auth().onAuthStateChanged(async (firebaseUser) => {
      if (firebaseUser) {
        try {
          const profileRes = await fbFetch(`/users/${firebaseUser.uid}.json`);
          const profile = await profileRes.json();
          if (profile) {
            state.user = profile;
            saveUser();
          }
        } catch (e) {
          console.warn('Не удалось загрузить профиль', e);
        }
      }
      
      await dbLoad();
      
      if(state.tests.length === 0){
        state.tests = seed();
        for(const t of state.tests) {
          await persistTest(t);
        }
      }

      const loader = document.getElementById('loading');
      if(loader) loader.style.display = 'none';

      updatePresence();
      if(!$('#theme-toggle')._bound) {
        $('#theme-toggle').addEventListener('click',toggleTheme);
        $('#theme-toggle')._bound = true;
      }
      
      window.removeEventListener('hashchange', render);
      window.addEventListener('hashchange', render);
      
      render();
    });
  }
  
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
